<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFSET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Revue de presse quotidienne : économie, géopolitique et IA, chaque matin vers 6 h 40.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OFFSET">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OFFSET">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="OFFSET — Revue du matin">
<meta property="og:description" content="Samedi 14 novembre 2026 — L&#x27;affaire Nvidia remonte jusqu&#x27;à la Maison Blanche">
<meta property="og:image" content="https://2c8g47nkkt-jpg.github.io/offset/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://2c8g47nkkt-jpg.github.io/offset/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc{grid-row:auto}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}

larges : administrations en Australie, au Japon, aux États-Unis ou à Singapour, opérations annulées par le NHS britannique, écoles anglaises perturbées. Le groupe de luxe Richemont a reporté la publication de ses résultats. Selon le FT, le gouvernement allemand « anticipe un très gros impact » sur l'économie."], "why": "Pour le FT, la panne révèle la dépendance mondiale à quelques fournisseurs de technologies de base : banques, gouvernements, pharmacies ou bureaux de shérif utilisent les mêmes outils. Microsoft 365 compte environ 430 millions d'utilisateurs. Vendredi, l'entreprise faisait état d'un « large rétablissement ».", "rep": 1, "sources": ["myFT", "Wikipédia (web)"], "more": ["<b>Le correctif.</b> Microsoft a annulé une modification récente de la configuration de son réseau, puis remis progressivement ses serveurs en service.", "<b>Le précédent.</b> En juillet 2024, une mise à jour défectueuse de CrowdStrike avait déjà paralysé des millions d'ordinateurs Windows."], "prog": "Économie numérique, rendements croissants et concentration, risque systémique"}, {"eyebrow": "Agents IA", "title": "Les agents IA ne devraient pas se faire passer pour nous", "text": ["Une tribune du FT plaide pour que banques et plateformes en ligne offrent aux agents IA un canal d'accès standard, à des conditions équitables, plutôt que de les obliger à imiter un humain qui clique sur un site."], "why": "La question rejoint celle de la panne : à mesure que les tâches passent par quelques infrastructures et quelques agents, les règles d'accès deviennent un enjeu de concurrence.", "rep": 1, "sources": ["myFT"], "prog": "Concurrence, plateformes et régulation"}], "items": []}, {"title": "Le financement de l'IA à l'épreuve", "stories": [{"img": "img/2026-11-14/anthropic.jpg", "alt": "Un intervenant en gilet bleu s'exprime sur scène devant un fond rose et orange", "credit": "Getty Images, via CNBC", "eyebrow": "Bourse", "title": "Anthropic maintient son introduction en Bourse", "text": ["Anthropic veut vendre 825 millions d'actions entre 70 et 78 $, soit jusqu'à 64,35 Md$ levés. En haut de la fourchette, l'entreprise vaudrait jusqu'à 1 405 Md$ sur une base entièrement diluée, contre 965 Md$ lors d'une levée de fonds en mai. Le prix doit être fixé le 18 novembre, pour une cotation au Nasdaq le 19, sous le symbole ANT (CNBC).", "Dario Amodei se dit « pas super inquiet » des turbulences sur les valeurs technologiques (FT). Selon CNBC, le livre d'ordres est déjà couvert, et 20 % des titres sont réservés aux particuliers, contre 5 à 10 % d'habitude."], "why": "L'opération se fait dans un marché devenu méfiant envers l'IA : la hausse des taux renchérit la dette qui finance les centres de données. Anthropic visait environ 2 000 Md$ ; un investisseur juge même 1 500 Md$ « tendu ». Le chiffre d'affaires a atteint 33,24 Md$ sur neuf mois, en hausse d'environ 1 200 % sur un an.", "rep": 1, "sources": ["myFT", "CNBC (web)"], "more": ["<b>Les partenaires.</b> AMD, Broadcom, Google, Micron, Microsoft, Nvidia et TSMC achèteront 26 Md$ d'actions au prix de l'introduction, hors offre publique.", "<b>Le regret.</b> Selon le FT, Sam Bankman-Fried, fondateur emprisonné de FTX, aurait gagné près de 40 Md$ s'il avait conservé son investissement de départ dans Anthropic."], "prog": "Marchés financiers, valorisation et anticipations, bulles spéculatives"}, {"img": "img/2026-11-14/softbank.jpg", "alt": "Masayoshi Son, souriant, lors d'une cérémonie de premier coup de pioche avec des casques dorés", "credit": "Via myFT Daily Digest", "eyebrow": "Énergie", "title": "SoftBank paie cher son pari sur les turbines à gaz", "text": ["SoftBank passe une charge de 597,2 Md¥ (3,7 Md$) après avoir réservé plus de 13 gigawatts de turbines à gaz pour ses centres de données américains, bien au-delà des 9,2 GW prévus en février. Le secteur s'est tourné vers des modèles plus efficaces en énergie, explique le FT.", "La charge comprend 2,85 Md$ d'avances non remboursables. Elle fait plonger SoftBank dans une perte nette de 1 120 Md¥ (7 Md$) au deuxième trimestre de son exercice."], "why": "Pour TechCrunch, l'épisode pourrait freiner le recours au gaz pour alimenter l'IA, au profit des raccordements au réseau. Semafor note qu'il renforce la crainte d'un essoufflement de la frénésie d'investissement.", "rep": 1, "sources": ["myFT", "Semafor (web)", "TechCrunch (web)"], "more": ["<b>Amazon et Fermi.</b> Selon le FT, Amazon relance son accord avec Fermi, la société de centres de données soutenue par Rick Perry, et en devient le locataire principal après des négociations ratées."], "prog": "Investissement, surinvestissement et cycles, contrainte énergétique"}], "items": []}, {"title": "Europe : une croissance à deux vitesses", "stories": [{"eyebrow": "Conjoncture", "title": "La zone euro avance, la France recule", "text": ["Eurostat confirme une croissance de +0,4 % au troisième trimestre dans la zone euro et de +0,5 % dans l'Union. L'emploi est stable sur le trimestre (+0,4 % sur un an).", "Les écarts sont nets : l'Espagne progresse de +0,6 % (+2,7 % sur un an), l'Allemagne de +0,2 %, l'Italie stagne et la France recule de −0,1 %."], "why": "La France est la seule grande économie de la zone en recul ce trimestre, au moment où ses taux d'emprunt ont dépassé 5 % et où le chômage atteint 8,2 % (Insee). Une seconde baisse au quatrième trimestre ferait parler de récession technique.", "rep": 0, "sources": ["Eurostat (web)", "Insee (web)"], "more": ["<b>Le chômage.</b> Selon l'Insee (10 novembre), le taux de chômage est de 8,2 % au troisième trimestre, en baisse de 0,1 point sur le trimestre mais en hausse de 0,4 point sur un an. Il atteint 21,0 % chez les 15-24 ans."], "prog": "Croissance et fluctuations, chômage, politique budgétaire en zone euro"}, {"img": "img/2026-11-14/sarvam.jpg", "alt": "Vivek Raghavan, cofondateur de Sarvam, bras croisés devant le logo de l'entreprise", "credit": "Via myFT Daily Digest", "eyebrow": "Souveraineté", "title": "Où est le boom de l'IA en Europe ?", "text": ["Pour le FT, il faut plisser les yeux, mais l'IA commence à apparaître dans les données européennes. Philip Lane, chef économiste de la BCE, détaille comment elle transforme déjà l'économie de la zone.", "L'Inde, de son côté, mise sur la start-up Sarvam, soutenue par le gouvernement, pour construire ses propres modèles et éviter de devenir une « colonie numérique »."], "why": "La question de la souveraineté numérique se pose partout : dépendre des modèles et des infrastructures américains, c'est, comme la panne de Microsoft vient de le montrer, dépendre de choix faits ailleurs.", "rep": 1, "sources": ["myFT"], "prog": "Innovation et croissance, politique industrielle, souveraineté"}], "items": []}], "briefs": [["Montres", "Les horlogers cherchent à adapter leur marketing aux assistants IA, qui influencent désormais les recherches et les achats des clients (FT)."], ["SpaceX", "SpaceX prévoit d'investir plus de 74 Md$ dans des campus de calcul pour l'IA au Texas et en Arizona, selon Reuters."], ["Procès", "Une coalition d'associations attaque OpenAI, Anthropic, Google, Meta et SpaceX pour obtenir l'arrêt du développement de modèles plus puissants que ceux d'aujourd'hui (Reuters)."], ["Chine", "Les valeurs chinoises de l'IA poursuivent leur chute sur la crainte de restrictions plus dures sur les puces Nvidia (FT)."], ["Sécurité", "Notion confirme que des pirates ont lu des conversations de clients via une faille chez son fournisseur d'IA Fireworks ; moins de 1 % des espaces de travail sont concernés (TechCrunch)."], ["Bots de trading", "Le FT s'interroge sur les erreurs de saisie des robots de trading pilotés par l'IA, et sur les risques qu'ils font courir aux marchés."]], "good": "L'emploi tient en zone euro : il reste stable au troisième trimestre et progresse de 0,4 % sur un an, malgré le ralentissement (Eurostat).", "map": {"start": "huang", "nodes": [{"id": "huang", "x": 200, "y": 34, "l": ["Départ de", "Jensen Huang"], "t": "Le point de départ", "d": "Liaison avec une dirigeante de Megaspeed, soupçonnée de travailler pour la Chine."}, {"id": "mega", "x": 100, "y": 122, "l": ["Megaspeed pas", "sur liste noire"], "t": "La faille", "d": "Bessent accuse le Commerce d'avoir bloqué l'inscription de la société."}, {"id": "succ", "x": 300, "y": 122, "l": ["Recherche", "d'un successeur"], "t": "La gouvernance", "d": "Le conseil a approché Rene Haas, patron d'Arm (FT)."}, {"id": "trump", "x": 100, "y": 222, "l": ["Trump à l'APEC", "sans en parler"], "t": "La diplomatie", "d": "Washington refuse de négocier ses contrôles à l'exportation avec Pékin."}, {"id": "chine", "x": 300, "y": 222, "l": ["Valeurs chinoises", "de l'IA en baisse"], "t": "La contagion", "d": "Crainte de restrictions plus dures sur les puces."}, {"id": "doute", "x": 200, "y": 322, "l": ["Doute sur", "le cycle de l'IA"], "t": "Le climat", "d": "SoftBank perd 3,7 Md$ sur ses turbines ; les marchés se méfient."}, {"id": "ipo", "x": 100, "y": 414, "l": ["Anthropic : IPO", "le 19 novembre"], "t": "Le test", "d": "Jusqu'à 1 405 Md$ de valorisation, sous les 2 000 Md$ visés."}, {"id": "dep", "x": 300, "y": 414, "l": ["Panne Microsoft :", "dépendance révélée"], "t": "L'autre fragilité", "d": "Plus de 70 pays touchés par une seule erreur de configuration."}], "edges": [["huang", "mega"], ["huang", "succ"], ["mega", "trump"], ["succ", "chine"], ["trump", "doute"], ["chine", "doute"], ["doute", "ipo"], ["doute", "dep"]]}, "dossiers": [{"eyebrow": "Valorisation", "title": "1 400 milliards pour Anthropic : comment vaut-on une entreprise qui ne fait pas encore de profits ?", "q": "Anthropic se présente en Bourse à une valorisation pouvant atteindre 1 405 Md$, pour 33 Md$ de chiffre d'affaires sur neuf mois. Comment les investisseurs justifient-ils ce prix, et pourquoi la hausse des taux le fragilise-t-elle ?", "steps": [["Le principe", "La valeur des profits futurs.", "Une action vaut la somme actualisée des flux qu'elle rapportera. Pour une entreprise en très forte croissance, presque toute la valeur vient de profits lointains."], ["La croissance", "Des revenus multipliés par 13.", "Le chiffre d'affaires d'Anthropic a progressé d'environ 1 200 % sur un an ; son rythme annualisé atteignait 81 Md$ fin octobre (CNBC)."], ["Le taux", "L'ennemi des valeurs de croissance.", "Plus le taux d'actualisation monte, plus un profit lointain perd de valeur aujourd'hui. Or les taux longs ont fortement monté cette semaine."], ["Le marché", "De 2 000 à 1 405 Md$.", "Anthropic visait environ 2 000 Md$ ; la fourchette retenue plafonne à 1 405 Md$. Le marché a déjà corrigé le prix."], ["Le verdict", "Le 19 novembre.", "La cotation dira si la demande, déjà supérieure à l'offre selon CNBC, résiste à la méfiance envers l'IA."]], "calc": true, "refs": ["<b>Irving Fisher et la valeur actualisée.</b> La valeur d'un actif est la somme de ses revenus futurs actualisés.", "<b>Myron Gordon.</b> Son modèle montre que la valeur d'une action est très sensible à l'écart entre taux d'actualisation et taux de croissance.", "<b>Keynes, le concours de beauté.</b> Sur les marchés, on achète ce que les autres vont acheter, pas seulement ce qui vaut.", "<b>Robert Shiller, l'exubérance irrationnelle.</b> Les récits collectifs peuvent pousser les prix loin des fondamentaux."], "accroche": "En mai 2026, Anthropic valait 965 Md$ ; six mois plus tard, elle se présente en Bourse jusqu'à 1 405 Md$, mais loin des 2 000 Md$ qu'elle espérait : entre-temps, les taux ont monté.", "sujets": ["Les marchés financiers sont-ils efficients ?", "Faut-il craindre une bulle de l'intelligence artificielle ?", "Les taux d'intérêt gouvernent-ils l'investissement ?"]}, {"eyebrow": "Numérique", "title": "Une panne, 70 pays : la concentration des infrastructures numériques est-elle un risque systémique ?", "q": "Une erreur de configuration chez Microsoft a suffi à perturber hôpitaux, écoles et administrations dans plus de 70 pays. Pourquoi l'économie numérique se concentre-t-elle autant, et que faire du risque qui en découle ?", "steps": [["Les rendements croissants", "Plus on est gros, moins on coûte.", "Un logiciel coûte cher à créer mais presque rien à distribuer : le leader peut baisser ses prix et attirer toujours plus d'utilisateurs."], ["Les effets de réseau", "Tout le monde utilise le même outil.", "Courriel, agenda et visioconférence sont plus utiles quand les partenaires utilisent les mêmes. Environ 430 millions de personnes utilisent Microsoft 365."], ["Le point de défaillance unique", "Une erreur, des effets partout.", "Une mise à jour de configuration a saturé les serveurs ; l'interruption a touché le NHS, des gouvernements et des entreprises comme Richemont."], ["Le coût collectif", "Une externalité négative.", "Chaque client choisit Microsoft pour de bonnes raisons, mais personne ne paie le coût de la dépendance commune : c'est un risque systémique."], ["Les réponses", "Diversifier ou réguler.", "Plans de continuité, solutions de secours, exigences de résilience pour les fournisseurs critiques, voire alternatives européennes au nom de la souveraineté."]], "split": [["Accepter la concentration", "Les grands fournisseurs investissent davantage dans la sécurité et la fiabilité que des acteurs dispersés ; les pannes restent rares au regard du service rendu."], ["La réduire", "Quand une seule entreprise sert des centaines de millions d'utilisateurs, une erreur devient une crise économique ; la diversité des fournisseurs est une assurance."]], "refs": ["<b>Carl Shapiro et Hal Varian (1998).</b> Économie de l'information : effets de réseau, verrouillage et domination du leader.", "<b>Jean Tirole.</b> Ses travaux sur la régulation des marchés à quelques acteurs et des plateformes.", "<b>Ulrich Beck, la société du risque.</b> La modernité produit des risques nouveaux, liés à ses propres technologies.", "<b>Le risque systémique.</b> Notion issue de la finance : la défaillance d'un acteur central se propage à tout le système."], "accroche": "Le 12 novembre 2026, une simple modification de configuration chez Microsoft a privé de messagerie des administrations, des hôpitaux et des écoles dans plus de 70 pays.", "sujets": ["La concentration des marchés est-elle un danger ?", "Faut-il réguler les géants du numérique ?", "La souveraineté numérique de l'Europe est-elle possible ?"]}, {"eyebrow": "Commerce", "title": "Les contrôles à l'exportation : arme efficace ou passoire ?", "q": "Washington interdit la vente de ses puces les plus avancées à la Chine. L'affaire Megaspeed suggère que des milliards de dollars de puces ont pu passer quand même. Que valent ces contrôles ?", "steps": [["L'objectif", "Freiner l'IA chinoise.", "Les États-Unis limitent l'accès de la Chine aux puces d'IA pour préserver leur avance technologique et militaire."], ["Le contournement", "Passer par des pays tiers.", "Megaspeed, basée à Singapour, est soupçonnée d'avoir aidé à faire passer en Chine des puces Nvidia interdites."], ["Les tensions internes", "Qui tient le stylo ?", "Le Trésor accuse le Commerce, seul compétent pour la liste noire, d'avoir tardé ; l'administration se divise."], ["Le dilemme", "Sécurité contre commerce.", "Durcir les contrôles prive Nvidia de ventes et risque de compliquer les négociations commerciales avec Pékin."], ["L'effet", "Une Chine qui accélère.", "Les restrictions poussent aussi la Chine à développer ses propres puces, ce qui peut réduire l'avance qu'elles visaient à protéger."]], "refs": ["<b>Friedrich List.</b> Le protectionnisme éducateur : une nation protège les industries qu'elle veut développer.", "<b>Paul Krugman et Elhanan Helpman.</b> La politique commerciale stratégique dans les secteurs à rendements croissants.", "<b>Albert Hirschman (1945).</b> Le commerce comme instrument de puissance et de dépendance.", "<b>Henry Farrell et Abraham Newman.</b> L'« interdépendance militarisée » : les États utilisent les réseaux économiques comme armes."], "accroche": "« Mais c'est le Commerce qui tient le stylo » : le 13 novembre 2026, le secrétaire au Trésor américain rejette sur un autre ministère l'échec à bloquer une société soupçonnée de faire passer des puces Nvidia en Chine.", "sujets": ["Le protectionnisme peut-il être efficace ?", "La mondialisation est-elle devenue une arme ?", "Les États-Unis et la Chine peuvent-ils se découpler ?"]}], "flash": [["−0,1 %", "PIB France T3", "Seule grande économie de la zone euro en recul ce trimestre (Eurostat)."], ["+0,4 %", "PIB zone euro T3", "Croissance confirmée par Eurostat ; +1,3 % sur un an."], ["8,2 %", "Chômage en France", "Taux au troisième trimestre selon l'Insee, +0,4 point sur un an."], ["70-78 $", "Prix d'Anthropic", "Fourchette de l'introduction en Bourse, prévue le 19 novembre au Nasdaq."], ["1 405 Md$", "Valorisation maximale", "D'Anthropic en haut de la fourchette, contre 965 Md$ en mai."], ["3,7 Md$", "Charge de SoftBank", "Sur des turbines à gaz commandées en trop pour ses centres de données."], ["135 Md$", "Actions de Huang", "Valeur de sa participation dans Nvidia selon le FT."], ["430 M", "Utilisateurs de Microsoft 365", "Touchés potentiellement par la panne, dans plus de 70 pays."], ["18-19 nov.", "APEC à Shenzhen", "Trump y retrouve Xi Jinping, avec un sommet à trois prévu avec Vladimir Putin."]], "quiz": [{"q": "Qui accuse le département du Commerce d'avoir bloqué la mise sur liste noire de Megaspeed ?", "o": ["Marco Rubio", "Scott Bessent", "Howard Lutnick", "Elon Musk"], "a": 1, "e": "Le secrétaire au Trésor Scott Bessent affirme que plusieurs administrations y étaient favorables, mais que « le Commerce tient le stylo »."}, {"q": "Où se tient le sommet de l'APEC où se rend Donald Trump ?", "o": ["Pékin", "Shanghai", "Shenzhen", "Singapour"], "a": 2, "e": "Le sommet a lieu à Shenzhen les 18 et 19 novembre."}, {"q": "Quelle est la cause de la panne de Microsoft 365, selon l'entreprise ?", "o": ["Une cyberattaque", "Un agent IA défaillant", "Des réglages appliqués après une mise à jour", "Une coupure électrique"], "a": 2, "e": "Microsoft écarte la cyberattaque : des réglages appliqués après une mise à jour ont saturé le processus de connexion sécurisée."}, {"q": "Quelle est la fourchette de prix de l'action Anthropic ?", "o": ["50 à 58 $", "70 à 78 $", "90 à 98 $", "120 à 128 $"], "a": 1, "e": "Anthropic propose 825 millions d'actions entre 70 et 78 $, pour une cotation le 19 novembre."}, {"q": "Pourquoi une hausse des taux pèse-t-elle surtout sur la valeur d'une entreprise en forte croissance ?", "o": ["Elle augmente ses impôts", "Elle réduit la valeur actuelle de profits lointains", "Elle interdit les introductions en Bourse", "Elle augmente son chiffre d'affaires"], "a": 1, "e": "La valeur d'une action est la somme actualisée de ses profits futurs : plus ils sont lointains, plus la hausse du taux les déprécie."}, {"q": "Quelle a été la croissance de la France au troisième trimestre 2026 selon Eurostat ?", "o": ["+0,6 %", "+0,2 %", "0,0 %", "−0,1 %"], "a": 3, "e": "La France recule de 0,1 %, quand l'Espagne progresse de 0,6 % et l'Allemagne de 0,2 %."}, {"q": "Sur quoi porte la charge de 3,7 Md$ de SoftBank ?", "o": ["Des puces Nvidia", "Des turbines à gaz pour centres de données", "Des actions WeWork", "Des panneaux solaires"], "a": 1, "e": "SoftBank avait réservé plus de 13 GW de turbines à gaz pour ses centres de données américains."}, {"q": "Quelle notion décrit le fait qu'une défaillance chez un acteur central se propage à tout le système ?", "o": ["L'aléa moral", "La sélection adverse", "Le risque systémique", "L'effet d'éviction"], "a": 2, "e": "Le risque systémique, venu de la finance, s'applique aux infrastructures numériques dont dépendent des millions d'utilisateurs."}], "colle": {"title": "La concentration des marchés numériques est-elle un danger pour l'économie ?", "parts": [["La concentration a des fondements économiques solides", ["Rendements croissants et effets de réseau favorisent naturellement un leader (Shapiro et Varian)", "L {"toc": "Une faille chez un fournisseur d'IA expose des conversations Notion, OpenAI lance ses outils de sécurité, et Hugging Face face à l'après-Huang.", "intro": "Modèles, outils et projets : ce qui change dans l'IA, et ce qui sert vraiment.", "signalTitle": "La sécurité, angle mort de l'IA", "signal": [{"eyebrow": "Fireworks · Notion", "title": "Quand le fournisseur de ton fournisseur se fait pirater", "text": ["Notion confirme que des pirates ont pu lire des transcriptions de conversations de certains clients, en passant par une faille chez Fireworks AI, une entreprise qui fait tourner des modèles d'IA pour d'autres sociétés. Moins de 1 % des espaces de travail sont concernés, et la plupart des conversations exposées ne pouvaient pas être reliées à un utilisateur précis, selon Notion.", "The Neuron rappelle l'existence d'un marché noir des accès volés aux modèles d'IA, où les identifiants d'API dérobés se revendent pour faire tourner des modèles aux frais des victimes."], "why": "Une conversation avec un assistant IA transite souvent par plusieurs entreprises : l'application, l'hébergeur du modèle, parfois un intermédiaire. Chacune est un point d'entrée. C'est un argument de plus pour ne pas coller de données sensibles dans un outil dont on ne connaît pas la chaîne de sous-traitants.", "sources": ["TechCrunch (web)", "The Neuron (web)"], "url": "https://techcrunch.com/2026/11/12/cyberattack-on-fireworks-ai-allowed-hackers-to-access-notion-customers-chat-transcripts/"}, {"eyebrow": "OpenAI · sécurité", "title": "OpenAI vend des agents pour chercher les failles", "text": ["OpenAI lance Daybreak Red Team, qui attaque une application pour en trouver les faiblesses, et Defense Factory, qui propose des correctifs. Red Team est en accès anticipé ; les correctifs de Defense Factory doivent être relus par des ingénieurs avant d'être déployés.", "En parallèle, l'outil en ligne de commande Codex Security d'OpenAI, open source, fait partie des dépôts les plus suivis de GitH   /* ---------- Encre : moteur graphique commun ----------
     Un seul contexte WebGL hors écran dessine toutes les couches vivantes du site : grain des fonds, grain du titre,
     signature de l'édition et traitement photocopie des photos. Chaque couche est un canvas 2D placé dans la page :
     elle défile avec le contenu, n'est recalculée que si elle est visible, et partage le même bruit, la même encre
     et le même papier que les autres. Rien n'est calculé hors écran ni onglet caché ; prefers-reduced-motion fige tout. */
  const ink=(()=>{
    const gc=document.createElement('canvas');
    const gl=gc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:'low-power'});
    const api={scan(){},photo(){},on:false};
    if(!gl) return api;
    const still=matchMedia('(prefers-reduced-motion: reduce)'), dark=matchMedia('(prefers-color-scheme: dark)');
    const t0=performance.now()-Math.random()*3e6, MAXDPR=2, FPS=1000/24;
    const HEAD=`precision highp float;
uniform vec2 uSize; uniform float uDpr,uTime,uSeed; uniform vec3 uInk,uRiso;
vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}
float sn(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)),x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz),l=1.-g,i1=min(g,l.zxy),i2=max(g,l.zxy);
  vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
  i=m3(i);
  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  vec3 ns=.142857142857*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z),xx=floor(j*ns.z),yy=floor(j-7.*xx);
  vec4 x=xx*ns.x+ns.yyyy,y=yy*ns.x+ns.yyyy,h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw),s0=floor(b0)*2.+1.,s1=floor(b1)*2.+1.,sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
  vec4 nr=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
  p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m*=m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
/* px CSS, origine en haut à gauche */
vec2 px(){return vec2(gl_FragCoord.x,uSize.y*uDpr-gl_FragCoord.y)/uDpr;}
/* le grain de toner commun à toutes les couches : fin, en amas, avec les traînées du tambour */
float grain(vec2 p,float t){return .5+.62*(sn(vec3(p/1.3,t*.21))*.56+sn(vec3(p/3.7+19.,t*.13))*.31+sn(vec3(p.x/64.,p.y/1.9,t*.05))*.13);}
/* densité irrégulière : zones chargées, zones délavées */
float density(vec2 p,float t,float s){return sn(vec3(p/240.+s,t*.017))*.55+sn(vec3(p/86.-s,t*.029))*.3+sn(vec3(p.x/40.,p.y/900.,t*.008+s))*.15;}
/* encre déposée pour un taux de couverture c */
float toner(vec2 p,float t,float c){float g=grain(p,t);return smoothstep(g-.085,g+.085,c);}
/* trace du curseur : un champ d'écoulement mémorisé par zone. Il entraîne la matière (bord, nappes, densité)
   comme un fluide ; le grain lui-même est toujours dessiné en place, il n'est jamais étiré. */
uniform sampler2D uDisp; uniform float uHasDisp;
vec2 disp(vec2 p){return uHasDisp>.5?(texture2D(uDisp,p/uSize).rg-.5)*128.:vec2(0.);}
`;
    const FX={
/* Bandes de fond : chute sous les onglets, passage entre thèmes, montée en fin de page */
bands:`uniform float uType;
void main(){
  vec2 p=px(), pd=p-disp(p); float v=p.y/uSize.y, t=uTime, s=uSeed*97.;
  float w=sn(vec3(pd.x/820.+s,pd.y/560.,t*.011))*.62+sn(vec3(pd.x/300.,pd.y/240.+s,t*.019+s))*.38;
  float q=pd.y/uSize.y+w*.17, tone;
  float m=.74+.42*sn(vec3(pd.x/700.+s,pd.y/1100.,t*.009+s));
  if(uType<.5)      tone=.84*m*pow(clamp(1.-q/.6,0.,1.),1.7)*(1.-smoothstep(.5,.7,v))*smoothstep(0.,.22,v);
  else if(uType<1.5)tone=.6*m*pow(sin(3.14159*clamp(q,0.,1.)),2.)*smoothstep(0.,.18,v)*smoothstep(1.,.82,v);
  else              tone=pow(smoothstep(.03,.96,q),1.3)*mix(m,1.,smoothstep(.7,.98,v))*smoothstep(0.,.12,v);
  if(tone<.003){gl_FragColor=vec4(0.);return;}
  float a=toner(p,t,clamp(tone*(1.+.46*density(pd,t,s)),0.,1.));
  gl_FragColor=vec4(uInk*a,a);
}`,
/* Titre : le même grain photocopie que les bandes de fond (même toner, mêmes nappes de densité, même bord
   qui ondule), à environ la moitié de leur intensité pour ne jamais gêner la lecture du titre. */
mast:`void main(){
  vec2 p=px(), pd=p-disp(p); float v=p.y/uSize.y, t=uTime, s=36.;
  float w=sn(vec3(pd.x/820.+s,pd.y/560.,t*.011))*.62+sn(vec3(pd.x/300.,pd.y/240.+s,t*.019+s))*.38;
  float q=pd.y/uSize.y+w*.17;
  float m=.74+.42*sn(vec3(pd.x/700.+s,pd.y/1100.,t*.009+s));
  float tone=.34*m*pow(sin(3.14159*clamp(q,0.,1.)),1.6)*smoothstep(0.,.18,v)*smoothstep(1.,.8,v);
  if(tone<.003){gl_FragColor=vec4(0.);return;}
  float a=toner(p,t,clamp(tone*(1.+.46*density(pd,t,s)),0.,1.));
  gl_FragColor=vec4(uInk*a,a);
}`,
/* Photo : photocopie au seuil, comme le premier filtre (bruit comparé à la luminance, grain de toner net),
   mais la luminance passe d'abord par une courbe réglée sur la photo : noirs et blancs de l'image étirés,
   ombres relevées sur les photos sombres. Les gris restent lisibles par la densité du grain.
   Les extrêmes sont exactement les couleurs du thème (uDark, uLight, tirées de --bg et --ink).
   uRev dissout le grain point par point vers la couleur d'origine. */
photo:`uniform sampler2D uTex; uniform vec2 uImg; uniform vec3 uSt,uDark,uLight; uniform float uRev;
vec2 cover(vec2 u){float ac=uSize.x/uSize.y,ai=uImg.x/uImg.y;return ai>ac?vec2(.5+(u.x-.5)*ac/ai,u.y):vec2(u.x,.5+(u.y-.5)*ai/ac);}
float tone(vec3 c){
  float L=dot(c,vec3(.2126,.7152,.0722)), span=max(uSt.z-uSt.x,.08);
  float x=clamp((L-uSt.x)/span,0.,1.);
  x=pow(x,clamp(log(.5)/log(clamp((uSt.y-uSt.x)/span,.06,.94)),.5,1.1));
  return x+.42*x*(1.-x)*(1.-x);
}
void main(){
  vec2 p=px(), u=p/uSize;
  vec3 rgb=texture2D(uTex,cover(u)).rgb;
  float x=tone(rgb);
  x=mix(x,x*x*(3.-2.*x),.25);
  float n=clamp(.5+.5*(sn(vec3(p/1.25,uSeed*31.))*.68+sn(vec3(p/3.1+7.,uSeed*31.))*.32)*1.25,.05,.95);

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
