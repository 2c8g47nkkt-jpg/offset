<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:locale" content="fr_FR">

<meta property="og:description" content="Mardi 24 novembre 2026 — Jensen Huang revient chez Nvidia, Wall Street s&#x27;envole">

<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.colo .top .sig{grid-column:1/4;grid-row:2;align-self:end;display:block;width:clamp(120px,11vw,190px);aspect-ratio:3368/1451;height:auto;color:var(--ink);overflow:visible}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc,.colo .top .sig{grid-row:auto}.colo .top .sig{grid-column:1/-1;width:132px}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}
.fc.flip{background:var(--riso);color:#000;padding:18px 18px}
.fc.flip .v{display:none} .fc.flip .b{display:block}
.score{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:72px}
.score .sc{font-size:clamp(64px,6vw,120px);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible{outline:2px solid var(--ink)}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:96px var(--col)}
@media (max-width:800px){.quiz{grid-template-columns:1fr}}
.qcard{display:flex;flex-direction:column;gap:18px;min-width:0}
.qq{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;font-size:16.5px}
.opt .kk{font-weight:800;color:var(--faint)}
.opt:hover:not([aria-disabled="true"]) span:last-child{text-decoration:underline;text-underline-offset:4px}
.opt:focus-visible{outline:2px solid var(--ink)}
.opt.ok,.opt.ok .kk{color:var(--up);font-weight:700}
.opt.ko{color:var(--down);text-decoration:line-through;text-decoration-thickness:1px}
.opt[aria-disabled="true"]{cursor:default}
.expl{color:var(--muted);font-size:15.5px}
.plan{display:flex;flex-direction:column;gap:clamp(48px,5vw,88px)}
.plan ol{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.plan ol{grid-template-columns:1fr}}
.plan > ol > li{counter-increment:p;display:flex;flex-direction:column;gap:12px}
.plan > ol > li::before{content:counter(p,upper-roman);font-size:clamp(48px,4vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.plan li b{font-weight:800;font-size:19px;line-height:1.3;letter-spacing:-.015em}
.plan ol ol{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.plan ol ol li{color:var(--muted);font-size:15.5px;display:grid;grid-template-columns:22px minmax(0,1fr);counter-increment:s}
.plan ol ol li::before{content:counter(s,upper-alpha);font-weight:800;color:var(--faint)}

/* Archives */
.arch{display:flex;flex-direction:column;gap:6px}
.arow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--col);padding:14px 0;align-items:baseline}
.arow:focus-visible{outline:2px solid var(--ink)}
.arow .t{font-size:clamp(24px,2.6vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1}
.arow:hover .t{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.arow:not(.cur) .t{color:var(--muted)}
@media (max-width:700px){.arow{grid-template-columns:1fr;row-gap:6px}}

/* Sources */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 8px;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0;font-weight:700}
thead th{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--faint);vertical-align:bottom;padding-bottom:20px}
.d1{display:inline-block;width:10px;height:10px;background:var(--ink)}
.cnt{font-size:24px;font-weight:800;letter-spacing:-.04em}
.srclist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px var(--col)}

@media (max-width:560px){.srclist{grid-template-columns:1fr}}
.srclist div{display:flex;flex-direction:column;gap:2px}
footer{font-size:12.5px;color:var(--faint);max-width:70ch}

const LATEST = {"date": "2026-11-24", "label": "Mardi 24 novembre 2026", "period": "23 au 24 novembre", "sourcesCount": 5, "countLabel": "5 newsletters + 9 sources web", "hero": {"img": "img/2026-11-24/huang.jpg", "alt": "Jensen Huang, en veste de cuir noire, s'exprime sur scène devant un fond sombre", "credit": "via CBC", "eyebrow": "À la une", "title": "Jensen Huang revient chez Nvidia, Wall Street s'envole", "lede": "Onze jours après son départ, le conseil d'administration de Nvidia a réintégré son cofondateur à l'unanimité, après des échanges avec « les plus hauts niveaux » du gouvernement américain. L'action a bondi d'environ +30 %, ajoutant près de 1 000 Md$ de valeur, et le Nasdaq a gagné +7 %. Quatre des cinq newsletters du jour en parlent ; elles s'interrogent aussi sur la fragilité d'un écosystème de l'IA suspendu à un seul homme et à une seule entreprise."}, "brief": [["Nvidia", "Jensen Huang réintégré ; l'action gagne environ +30 % et le Nasdaq +7 % en une séance (FT)."], ["Règle d'or", "Emmanuel Macron envisage d'inscrire dans la Constitution une trajectoire de retour à l'équilibre ; la dette atteint 119 % du PIB."], ["Cybersécurité", "CrowdStrike rachète Zscaler pour environ 43,9 Md$, entièrement payés en actions."], ["Anthropic", "Après une introduction à 83 $, la croissance trimestrielle de ses revenus ralentit de 144 % à environ 47 %."], ["Défense", "Le chef d'état-major de l'armée de l'Air admet un retard français sur les drones bon marché, face à des Shahed à 20 000 $."]], "figures": [{"v": "+30 %", "l": "hausse de l'action Nvidia lundi après le retour de Jensen Huang, près de 1 000 Md$ de valeur ajoutée (FT, CNN)", "dir": "up"}, {"v": "+7 %", "l": "hausse du Nasdaq dans la même séance ; le S&P 500 gagne +4,7 % (myFT)", "dir": "up"}, {"v": "119 %", "l": "dette publique française rapportée au PIB, au moment où Macron relance la règle d'or (Money Stack, Euronews)", "dir": "up"}, {"v": "43,9 Md$", "l": "prix du rachat de Zscaler par CrowdStrike, payé en actions (CrowdStrike)", "dir": "up"}], "themes": [{"title": "Nvidia, Anthropic : l'IA suspendue à quelques acteurs", "stories": [{"img": "img/2026-11-24/asie.jpg", "alt": "Deux opérateurs d'une salle de marché asiatique devant des écrans de cotation", "credit": "via myFT Daily Digest", "eyebrow": "Nvidia", "title": "Le retour de Jensen Huang rallume la flamme de l'IA", "text": ["Le conseil d'administration de Nvidia a voté à l'unanimité la réintégration de Jensen Huang comme président-directeur général, onze jours après sa démission (Nvidia, The Neuron). Le communiqué évoque des discussions incluant « les plus hauts niveaux » du gouvernement américain ; Donald Trump revendique un rôle décisif (CNN).", "L'action a clôturé en hausse d'environ +30 %, sa meilleure séance depuis 2003 selon Bloomberg, et le groupe a repris près de 1 000 Md$ de capitalisation. Le Nasdaq a gagné +7 % et le S&P 500 +4,7 % ; mardi, les valeurs technologiques asiatiques suivent (myFT). TSMC a pris 14 % et ASML 9 % (CNN)."], "why": "Huang avait été poussé au départ par des révélations sur ses liaisons, dont une avec une espionne chinoise présumée (FT Newswrap). Son retour, obtenu avec l'appui de la Maison Blanche, rassure les investisseurs mais crée un précédent : des élus des deux partis veulent l'entendre en public, et le FT relève que Trump aurait gagné jusqu'à 15 M$ sur ses actions Nvidia.", "rep": 4, "sources": ["myFT Daily Digest", "FT Newswrap", "Money Stack", "The Next Big Sh*t", "CNN (web)", "Nvidia (web)", "The Neuron (web)"], "url": "https://www.cnn.com/2026/11/23/markets/us-stocks-rebound-intl", "more": ["<b>Risque de l'homme clé.</b> Quand la valeur d'une entreprise dépend d'un dirigeant, son départ fait chuter le cours : Nvidia avait perdu près de 28 % après l'éviction de Huang (Yahoo Finance).", "<b>Le contrepoint.</b> The Next Big Sh*t rappelle que les « hommes indispensables » le sont rarement : Apple a prospéré après Steve Jobs, Uber a dégagé son premier bénéfice d'exploitation annuel après Travis Kalanick."], "prog": "Gouvernance d'entreprise, théorie de l'agence, État et marché"}, {"eyebrow": "Anthropic", "title": "Après l'introduction en Bourse, la course contre la montre", "text": ["Introduite à 83 $ (Anthropic), l'action a gagné 17 % le premier jour puis perdu −8,5 % vendredi, autour de 89 $ (The Next Big Sh*t). Le retour de Huang l'aide à regagner une partie de ses pertes (FT Newswrap).", "La croissance trimestrielle de ses revenus est passée de 144 % au deuxième trimestre à environ 47 % au troisième, tandis que ses dépenses de calcul ont augmenté de 77 % ; l'entreprise a pris 900,9 Md$ d'engagements futurs jusqu'en 2045 (The Next Big Sh*t, Money Stack)."], "why": "Une valorisation de l'ordre de 1 500 Md$ (FT) à 1 800 Md$ (Money Stack) suppose une croissance forte pendant longtemps. Le ralentissement de la croissance, conjugué à des coûts de calcul qui montent, est exactement ce que surveillent les investisseurs.", "rep": 3, "sources": ["The Next Big Sh*t", "Money Stack", "FT Newswrap", "Anthropic (web)"], "prog": "Valorisation, actualisation, financement de l'innovation"}, {"eyebrow": "Finance", "title": "Le « cirque » du financement circulaire de l'IA", "text": ["Pour Rana Foroohar (FT), Nvidia soutient une grande partie de l'écosystème de l'IA par des prêts et des prises de participation chez des clients qui achètent ensuite ses puces. Cela crée un marché, mais aussi des couches de fragilité interconnectées.", "Elle craint qu'une baisse des commandes de puces dans les prochains mois ne réduise ce financement fournisseur et ne fasse vaciller l'ensemble, d'autant que son ampleur est sans précédent. Le même jour, le FT publie une analyse sur ce qui se passe quand les bulles éclatent."], "why": "Quand un fournisseur finance ses propres clients, la demande observée peut mêler besoins réels et achats rendus possibles par ce crédit : il devient difficile de distinguer la demande solide de la demande spéculative.", "rep": 2, "sources": ["FT Opinion", "myFT Daily Digest"], "more": ["<b>Image du FT.</b> Une « tour de Jenga » : retirer une pièce, la baisse des commandes, peut faire tomber l'édifice."], "prog": "Instabilité financière, crédit, bulles spéculatives"}]}, {"title": "France et Europe : budget, industrie, défense", "stories": [{"eyebrow": "Finances publiques", "title": "Macron confirme qu'il envisage une règle d'or constitutionnelle", "text": ["Dans un entretien au Figaro, Emmanuel Macron confirme réfléchir à inscrire dans la Constitution une trajectoire de retour à l'équilibre budgétaire, avec un Congrès à Versailles évoqué pour janvier (Euronews). La dette atteint 119 % du PIB (Money Stack).", "Il reprendrait une révision votée par les deux chambres en 2011, jamais finalisée. Sans référendum, il faut les trois cinquièmes des suffrages exprimés au Congrès, donc les voix du RN, qui réclamait cette réforme (Money Stack, Euronews)."], "why": "L'objectif affiché est de rassurer les marchés et les partenaires européens avant la présidentielle. La règle ne fixerait pas les choix budgétaires eux-mêmes, mais imposerait une trajectoire contraignante.", "rep": 3, "sources": ["Money Stack", "FT Newswrap", "The Next Big Sh*t", "Euronews (web)", "France 24 (web)"], "url": "https://fr.euronews.com/2026/11/23/emmanuel-macron-confirme-envisager-ladoption-dune-regle-dor-budgetaire", "prog": "Politique budgétaire, dette publique, règles contre discrétion"}, {"eyebrow": "Défense", "title": "Drones à 20 000 $ : la guerre change de modèle économique", "text": ["Dans un entretien au Grand Continent, le général Jérôme Bellanger, chef d'état-major de l'armée de l'Air et de l'Espace, estime que la victoire dépend désormais aussi du coût et du volume des armes. L'Iran l'a montré avec des drones Shahed à 20 000 $ (Money Stack).", "La France mise sur un « high-low mix », mêlant masse bon marché et équipements de pointe, mais admet un retard : les drones qui accompagneront les chasseurs sont américains, Dassault s'appuie sur l'émirati EDGE, et MBDA et Safran ont avancé leurs propres fonds faute de budgets votés à temps."], "why": "Le retard industriel crée une dépendance. Le général compare l'achat de F-35 à celui d'un iPhone : une fois l'écosystème adopté, on bâtit sa défense sur des systèmes qu'on ne contrôle pas.", "rep": 1, "sources": ["Money Stack"], "prog": "Souveraineté, politique industrielle, économie de la défense"}, {"eyebrow": "Allemagne", "title": "L'automobile allemande se serre la ceinture, Tesla investit", "text": ["Volkswagen veut geler les salaires et Mercedes évoque des fermetures d'usines ; dans le même temps, Tesla injecte 3 Md€ près de Berlin, ce qu'applaudit même le syndicat IG Metall (Money Stack).", "Mercedes-Benz a toutefois devancé Tesla en devenant le premier constructeur à obtenir la certification allemande pour son logiciel avancé d'aide à la conduite (FT Newswrap)."], "why": "Le modèle industriel allemand, fondé sur le moteur thermique et l'export, est concurrencé par l'électrique et par les constructeurs chinois : la compétitivité se joue désormais sur le logiciel et les batteries.", "rep": 2, "sources": ["Money Stack", "FT Newswrap"], "prog": "Compétitivité, désindustrialisation, mutations sectorielles"}]}, {"title": "Entreprises : cybersécurité, créateurs et IA française", "stories": [{"eyebrow": "Fusions", "title": "CrowdStrike avale Zscaler", "text": ["CrowdStrike a annoncé le rachat de Zscaler pour environ 43,9 Md$, payé entièrement en actions : chaque action Zscaler sera échangée contre 1,135 action CrowdStrike (CrowdStrike, SEC). Le nouvel ensemble revendique plus de 10 Md$ de revenus annuels récurrents.", "L'opération, annoncée avec les résultats trimestriels de CrowdStrike, doit se conclure au second semestre de son exercice qui s'achève fin janvier 2028, sous réserve de l'accord des actionnaires de Zscaler. Le FT la relie à la multiplication des cybermenaces et des pannes informatiques."], "why": "CrowdStrike entre ainsi dans la sécurité des réseaux, le plus gros segment du marché. Un paiement en actions évite l'endettement mais dilue les actionnaires existants.", "rep": 2, "sources": ["myFT Daily Digest", "FT Newswrap", "CrowdStrike (web)"], "prog": "Concentration, stratégies de croissance externe"}, {"eyebrow": "Creator economy", "title": "L'IA redistribue les cartes de l'influence", "text": ["L'économie des créateurs pèserait 217,3 Md$ en 2026, dont 10,1 Md$ en France (+23 % en un an), mais 56 % des créateurs français gagnent moins de 5 000 $ par an (The Next Big Sh*t). Or 84 % des vidéos citées par l'AI Overview de Google viennent de chaînes de moins de 100 000 abonnés : les marques se tournent vers les petits comptes spécialisés, dont le prix des collaborations a pris +30 % depuis 2025.", "BNP Paribas propose désormais un banquier privé aux créateurs dès 100 000 abonnés ; le secteur a enchaîné 70 fusions-acquisitions en six mois (Money Stack)."], "why": "Un marché très inégalitaire, où le premier 1 % capte un quart des revenus, pourrait se rééquilibrer si les moteurs de réponse d'IA valorisent l'expertise plutôt que l'audience.", "rep": 2, "sources": ["The Next Big Sh*t", "Money Stack"], "prog": "Économie numérique, inégalités de revenus, effets de superstar"}, {"eyebrow": "IA souveraine", "title": "OVHcloud lance Olala, Qwant quitte Mistral", "text": ["OVHcloud a dévoilé Olala mini 7A1B, son premier modèle de langage : petit, frugal, annoncé en open source sous licence Apache 2.0 (Blog du Modérateur, Next). Qwant, qui a quitté Mistral quand celle-ci a triplé ses prix, dit avoir divisé ses coûts par trois (Money Stack).", "Selon OVHcloud, les réponses d'IA de Qwant sont 20 % plus rapides ; aucun résultat de banc d'essai n'a été publié."], "why": "Loin des modèles de pointe, Olala illustre une autre stratégie : des modèles petits et bon marché, hébergés en Europe, pour des usages précis.", "rep": 1, "sources": ["Money Stack", "Blog du Modérateur (web)"], "prog": "Souveraineté numérique, concurrence, coûts"}]}, {"title": "Monde : climat et élections", "stories": [{"eyebrow": "Climat", "title": "COP31 : trois erreurs de méthode selon François Gemenne", "text": ["Au lendemain de l'échec d'Antalya, sans accord pour la première fois depuis Copenhague en 2009, le chercheur François Gemenne pointe trois erreurs : l'obstination à obtenir une déclaration finale globale, la règle du consensus qui donne un droit de veto aux pays qui sabotent l'accord, et le flou sur le rôle des entreprises (Money Stack).", "Il aurait préféré centrer la conférence sur l'électrification, avec un objectif de 35 % d'électricité dans la consommation finale d'énergie en 2035, et laisser avancer des coalitions de pays ambitieux."], "why": "La lecture est utile en dissertation : le blocage ne vient pas seulement des intérêts divergents, mais aussi des règles de décision. Des « clubs » de pays volontaires peuvent contourner l'unanimité.", "rep": 1, "sources": ["Money Stack"], "prog": "Biens publics mondiaux, gouvernance mondiale, économie du climat"}, {"eyebrow": "Voiture électrique", "title": "Une voiture neuve sur quatre est électrique", "text": ["Selon le centre de réflexion Ember, plus d'un quart des voitures neuves vendues dans le monde sont électriques ou hybrides rechargeables ; les constructeurs chinois assurent l'essentiel des ventes (FT Newswrap, Ember).", "L'Agence internationale de l'énergie compte plus de 20 millions de ventes en 2025, dont plus de 13 millions en Chine, soit environ six sur dix (AIE)."], "why": "La transition avance plus vite par le marché et la politique industrielle chinoise que par les négociations climatiques : un contraste frappant avec l'échec de la COP31.", "rep": 1, "sources": ["FT Newswrap", "Ember (web)", "AIE (web)"], "prog": "Transition énergétique, concurrence internationale, Chine"}, {"eyebrow": "Espagne", "title": "Dernière ligne droite avant les législatives", "text": ["Les Espagnols votent dimanche 29 novembre, après huit ans de gouvernement de Pedro Sánchez. Selon une analyse du FT, les immigrés ont vu leurs revenus progresser davantage que les Espagnols de naissance sur la période, alors que l'immigration devient un sujet clivant (FT Newswrap).", "Trois sondages publiés le 16 novembre donnaient la majorité au Parti populaire allié à Vox (Reuters, via The Star) ; la loi interdit d'en publier dans les cinq jours précédant le scrutin."], "why": "L'Espagne a été l'une des économies les plus dynamiques de la zone euro, en partie grâce à l'immigration ; le scrutin dira si cette croissance suffit face à la crise du logement.", "rep": 1, "sources": ["FT Newswrap", "The Star / Reuters (web)"], "prog": "Migrations, croissance, crise du logement"}]}], "briefs": [["Royaume-Uni", "L'action du sous-traitant Capita s'effondre de plus de −70 % après un changement brutal de directeur général et un deuxième avertissement sur résultats en six mois (FT Newswrap)."], ["Immobilier", "Le promoteur britannique Crest Nicholson chute jusqu'à −30 % après une perte plus lourde que prévu (FT Newswrap)."], ["Concurrence", "Bruxelles ouvre une enquête sur l'embouteilleur londonien de Coca-Cola, soupçonné de restreindre les ventes transfrontalières (FT Newswrap)."], ["BYD", "Un tribunal néerlandais interdit en Europe la vente d'un SUV jugé copié sur le Defender de Jaguar Land Rover ; l'action BYD perd jusqu'à −4 % (FT Newswrap)."], ["Mailchimp", "Revendu à Bending Spoons pour 3,68 Md$, contre 12 Md$ payés par Intuit en 2021 (The Next Big Sh*t)."], ["États-Unis", "Elon Musk regrette d'avoir donné 500 M$ à des candidats républicains battus aux élections de mi-mandat et assure ne pas être « MAGA » (Money Stack)."]], "good": "Une voiture neuve sur quatre vendue dans le monde est désormais électrique ou hybride rechargeable, selon le centre de réflexion Ember (FT Newswrap).", "map": {"start": "depart", "nodes": [{"id": "depart", "x": 200, "y": 34, "l": ["Départ de", "Jensen Huang"], "t": "Le choc", "d": "Le 12 novembre, Huang quitte Nvidia après des révélations sur sa vie privée."}, {"id": "chute", "x": 100, "y": 122, "l": ["Nvidia et la", "tech chutent"], "t": "La sanction", "d": "Le marché valorise l'homme clé : l'action recule fortement."}, {"id": "lobby", "x": 300, "y": 122, "l": ["Pression de", "la Maison Blanche"], "t": "L'intervention", "d": "Trump, JD Vance et des patrons de la tech plaident pour son retour."}, {"id": "retour", "x": 200, "y": 222, "l": ["Huang", "réintégré"], "t": "Le revirement", "d": "Le conseil vote son retour à l'unanimité le 23 novembre."}, {"id": "rebond", "x": 100, "y": 322, "l": ["Nvidia +30 %", "Nasdaq +7 %"], "t": "Le rebond", "d": "Près de 1 000 Md$ de valeur retrouvée en une séance."}, {"id": "enquetes", "x": 300, "y": 322, "l": ["Enquêtes et", "précédent"], "t": "Le revers", "d": "Les élus veulent l'entendre en public ; la gouvernance est en question."}, {"id": "fragilite", "x": 200, "y": 414, "l": ["Écosystème IA", "fragile"], "t": "La question", "d": "Financement circulaire et dépendance à un acteur : jusqu'où ?"}], "edges": [["depart", "chute"], ["depart", "lobby"], ["chute", "retour"], ["lobby", "retour"], ["retour", "rebond"], ["retour", "enquetes"], ["rebond", "fragilite"], ["enquetes", "fragilite"]]}, "dossiers": [{"eyebrow": "Gouvernance", "title": "Un dirigeant peut-il être indispensable ?", "q": "Nvidia a perdu une large part de sa valeur au départ de Jensen Huang, puis l'a retrouvée à son retour, obtenu avec l'appui de la Maison Blanche. Que dit cet épisode du pouvoir des dirigeants et de la gouvernance des grandes entreprises ?", "steps": [["Le fondateur", "Une stratégie incarnée.", "Huang a transformé Nvidia en entreprise phare de l'IA ; marché et salariés l'identifient à la stratégie."], ["Le scandale", "Le conseil tranche.", "Des révélations sur sa vie privée et un risque de sécurité nationale poussent à son départ."], ["La sanction", "Le marché vote.", "L'action recule : les investisseurs valorisent le dirigeant lui-même."], ["L'intervention", "L'État s'invite.", "La Maison Blanche et des patrons de la tech font pression pour son retour."], ["Le précédent", "Qui contrôle qui ?", "Le conseil cède ; le Congrès veut des auditions publiques et les enquêtes se poursuivent."]], "split": [["Oui, certains le sont", "Le marché l'a dit en ajoutant près de 1 000 Md$ de valeur en une séance ; la vision et les réseaux d'un fondateur sont des actifs difficiles à remplacer."], ["Non, personne ne l'est", "Apple après Jobs, Uber après Kalanick : les organisations survivent à leurs fondateurs ; croire l'inverse justifie une concentration du pouvoir sans contre-pouvoir."]], "refs": ["<b>Michael Jensen et William Meckling.</b> La théorie de l'agence : les intérêts des dirigeants et des actionnaires divergent, d'où le besoin de contrôle.", "<b>Adolf Berle et Gardiner Means.</b> La séparation de la propriété et du contrôle dans la grande entreprise moderne.", "<b>Max Weber.</b> L'autorité charismatique, fondée sur les qualités exceptionnelles prêtées à un chef.", "<b>Joseph Schumpeter.</b> L'entrepreneur innovateur, moteur de la destruction créatrice."], "accroche": "« Les cimetières sont pleins d'hommes indispensables. » Le 23 novembre 2026, le retour de Jensen Huang à la tête de Nvidia fait pourtant gagner près de 1 000 Md$ à l'entreprise en une séance.", "sujets": ["Qui gouverne l'entreprise ?", "L'entreprise est-elle seulement au service de ses actionnaires ?", "L'État doit-il intervenir dans la gouvernance des entreprises stratégiques ?"]}, {"eyebrow": "Finance", "title": "Combien vaut une entreprise d'IA ?", "q": "Anthropic est valorisée entre 1 500 et 1 800 Md$ alors que la croissance de ses revenus ralentit et que ses coûts de calcul augmentent. Comment justifier une telle valeur ?", "steps": [["Le principe", "Actualiser les flux futurs.", "La valeur d'une entreprise est la somme de ses profits futurs ramenés au présent par un taux d'actualisation."], ["La croissance", "Le pari sur la durée.", "Une valorisation élevée suppose une croissance forte pendant de nombreuses années."], ["Le ralentissement", "De 144 % à 47 %.", "La croissance trimestrielle des revenus ralentit tandis que les dépenses de calcul augmentent de 77 %."], ["Les engagements", "Des coûts fixes énormes.", "900,9 Md$ d'engagements futurs jusqu'en 2045 pèsent sur la rentabilité attendue."], ["La sensibilité", "Le rôle du taux.", "Plus les profits sont lointains, plus une hausse du taux ou de la prime de risque fait chuter la valeur actuelle."]], "calc": true, "refs": ["<b>Irving Fisher.</b> La valeur d'un actif comme valeur actualisée de ses revenus futurs.", "<b>Myron Gordon.</b> Le modèle de croissance des dividendes : la valeur dépend de l'écart entre taux d'actualisation et croissance.", "<b>John Maynard Keynes.</b> Le concours de beauté : on achète ce que les autres vont acheter.", "<b>Hyman Minsky.</b> Le financement spéculatif, qui fragilise le système quand les flux attendus déçoivent."], "accroche": "En novembre 2026, Anthropic entre en Bourse à 83 $ par action ; quelques jours plus tard, la croissance de ses revenus a été divisée par trois.", "sujets": ["Les marchés financiers financent-ils efficacement l'innovation ?", "Les bulles spéculatives sont-elles inévitables ?", "Le taux d'intérêt est-il le prix du temps ?"]}, {"eyebrow": "Défense", "title": "La masse contre la technologie : l'économie de la guerre change", "q": "Des drones à 20 000 $ peuvent semer le chaos face à des armées technologiquement supérieures. L'Europe peut-elle rattraper son retard industriel sans dépendre des États-Unis ?", "steps": [["Le constat", "Coût et volume comptent.", "La victoire dépend désormais du coût et du volume des armes, pas seulement de leur qualité."], ["L'exemple", "Les Shahed iraniens.", "Des drones bon marché saturent des défenses coûteuses."], ["La réponse", "Le high-low mix.", "Associer masse bon marché et équipements de pointe."], ["Le retard", "Une industrie lente.", "Solutions américaines, budgets votés en retard, industriels qui avancent leurs fonds."], ["L'enjeu", "Dépendance ou autonomie.", "Acheter américain, c'est bâtir sa défense sur des systèmes qu'on ne contrôle pas."]], "refs": ["<b>Paul Kennedy.</b> Naissance et déclin des grandes puissances : la puissance militaire repose sur la base économique.", "<b>Friedrich List.</b> Le protectionnisme éducateur pour bâtir une industrie nationale.", "<b>Albert Hirschman.</b> La dépendance commerciale comme instrument de pouvoir.", "<b>Alan Milward.</b> L'économie de guerre et la mobilisation industrielle."], "accroche": "« Acheter du F-35, c'est comme acheter un iPhone », ironise en novembre 2026 le chef d'état-major de l'armée de l'Air et de l'Espace.", "sujets": ["L'Union européenne peut-elle être une puissance ?", "La souveraineté économique est-elle encore possible ?", "Faut-il une politique industrielle européenne ?"]}], "flash": [["+30 %", "Nvidia", "Hausse de l'action le 23 novembre après le retour de Huang."], ["~1 000 Md$", "Capitalisation", "Valeur regagnée par Nvidia en une séance."], ["+7 %", "Nasdaq", "Hausse dans la même séance ; S&P 500 +4,7 %."], ["119 %", "Dette française", "Rapportée au PIB, selon Money Stack."], ["3/5", "Congrès", "Majorité requise pour réviser la Constitution sans référendum."], ["43,9 Md$", "CrowdStrike", "Prix du rachat de Zscaler, payé en actions."], ["47 %", "Anthropic", "Croissance trimestrielle des revenus au T3, contre 144 % au T2."], ["20 000 $", "Drone Shahed", "Le coût d'une arme qui change l'économie de la guerre."], ["1 sur 4", "Voitures neuves", "Part des électriques et hybrides rechargeables dans le monde (Ember)."]], "quiz": [{"q": "De combien l'action Nvidia a-t-elle progressé après le retour de Jensen Huang ?", "o": ["+7 %", "+15 %", "+30 %", "+50 %"], "a": 2, "e": "Environ +30 %, près de 1 000 Md$ de capitalisation regagnée en une séance."}, {"q": "Quelle majorité faut-il au Congrès pour réviser la Constitution ?", "o": ["Majorité simple", "Majorité absolue", "Trois (function(){

  const tint=html=>html.replace(SIGNED,(m,pre,sign)=>pre+`<span class="${sign==='+'?'up':'down'}">${m.slice(pre.length)}</span>`);

  const stair=(txt,n)=>{const w=String(txt).replace(/« /g,'«\u00a0').replace(/ ([»:;?!])/g,'\u00a0$1').split(' ');n=Math.min(n||3,w.length);const per=Math.ceil(w.length/n),out=[];for(let i=0;i<w.length;i+=per)out.push(w.slice(i,i+per).join(' '));return out.map(l=>`<span>${esc(l)}</span>`).join('');};
  const cache={}; if(LATEST) cache[LATEST.date]=LATEST;

  const tabs=[...document.querySelectorAll('.tab')], views=[...document.querySelectorAll('.view')];

  const tabsTop=()=>$('main').offsetTop-$('nav.tabs').offsetHeight;

  function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);

  function initCalc(){

    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);

  /* ---------- Encre : moteur graphique commun ----------
     Un seul contexte WebGL hors écran dessine toutes les couches vivantes du site : grain des fonds, grain du titre,
     signature de l'édition et traitement photocopie des photos. Chaque couche est un canvas 2D placé dans la page :
     elle défile avec le contenu, n'est recalculée que si elle est visible, et partage le même bruit, la même encre
     et le même papier que les autres. Rien n'est calculé hors écran ni onglet caché ; prefers-reduced-motion fige tout. */
  const ink=(()=>{
    const gc=document.createElement('canvas');
    const gl=gc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:'low-power'});
    const api={scan(){},photo(){},on:false};
    if(!gl) return api;
    const still=matchMedia('(prefers-reduced-motion: reduce)'), dark=matchMedia('(prefers-color-scheme: dark)');
    const t0=performance.now()-Math.random()*3e6, MAXDPR=2, FPS=1000/24;
    const HEAD=`precision highp float;
uniform vec2 uSize; uniform float uDpr,uTime,uSeed; uniform vec3 uInk,uRiso;
vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}
float sn(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)),x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz),l=1.-g,i1=min(g,l.zxy),i2=max(g,l.zxy);
  vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
  i=m3(i);
  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  vec3 ns=.142857142857*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z),xx=floor(j*ns.z),yy=floor(j-7.*xx);
  vec4 x=xx*ns.x+ns.yyyy,y=yy*ns.x+ns.yyyy,h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw),s0=floor(b0)*2.+1.,s1=floor(b1)*2.+1.,sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
  vec4 nr=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
  p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m*=m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
/* px CSS, origine en haut à gauche */

    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
  function fitStair(el){
    const W=el.clientWidth; if(!W||el._w===W) return; el._w=W;
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let k=1;
    el.querySelectorAll(':scope > span').forEach(s=>{const pad=parseFloat(getComputedStyle(s).paddingLeft)||0,text=s.scrollWidth-pad;if(text>0)k=Math.min(k,(W-pad)/text);});
    if(k<1) el.style.fontSize=(base*k*.985)+'px';
  }
  const stairRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitStair(e.target))):null;
  function fitStairs(){document.querySelectorAll('.stair').forEach(el=>{el._w=0;fitStair(el);if(stairRO)stairRO.observe(el);});}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStairs);
  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();fitStairs();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
