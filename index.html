<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFSET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Revue de presse quotidienne : économie, géopolitique et IA, chaque matin vers 6 h 40.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OFFSET">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:site_name" content="OFFSET">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="OFFSET — Revue du matin">
<meta property="og:description" content="Lundi 23 novembre 2026 — Wall Street vit sa pire semaine depuis le Covid, l&#x27;IA en ligne de mire">
<meta property="og:image" content="https://2c8g47nkkt-jpg.github.io/offset/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://2c8g47nkkt-jpg.github.io/offset/">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.colo .top .sig{grid-column:1/4;grid-row:2;align-self:end;display:block;width:clamp(120px,11vw,190px);aspect-ratio:3368/1451;height:auto;color:var(--ink);overflow:visible}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc,.colo .top .sig{grid-row:auto}.colo .top .sig{grid-column:1/-1;width:132px}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}
.fc.flip{background:var(--riso);color:#000;padding:18px 18px}
.fc.flip .v{display:none} .fc.flip .b{display:block}
.score{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:72px}
.score .sc{font-size:clamp(64px,6vw,120px);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible{outline:2px solid var(--ink)}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:96px var(--col)}
@media (max-width:800px){.quiz{grid-template-columns:1fr}}
.qcard{display:flex;flex-direction:column;gap:18px;min-width:0}
.qq{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;font-size:16.5px}
.opt .kk{font-weight:800;color:var(--faint)}
.opt:hover:not([aria-disabled="true"]) span:last-child{text-decoration:underline;text-underline-offset:4px}
.opt:focus-visible{outline:2px solid var(--ink)}
.opt.ok,.opt.ok .kk{color:var(--up);font-weight:700}
.opt.ko{color:var(--down);text-decoration:line-through;text-decoration-thickness:1px}
.opt[aria-disabled="true"]{cursor:default}
.expl{color:var(--muted);font-size:15.5px}
.plan{display:flex;flex-direction:column;gap:clamp(48px,5vw,88px)}
.plan ol{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.plan ol{grid-template-columns:1fr}}
.plan > ol > li{counter-increment:p;display:flex;flex-direction:column;gap:12px}
.plan > ol > li::before{content:counter(p,upper-roman);font-size:clamp(48px,4vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.plan li b{font-weight:800;font-size:19px;line-height:1.3;letter-spacing:-.015em}
.plan ol ol{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.plan ol ol li{color:var(--muted);font-size:15.5px;display:grid;grid-template-columns:22px minmax(0,1fr);counter-increment:s}
.plan ol ol li::before{content:counter(s,upper-alpha);font-weight:800;color:var(--faint)}

/* Archives */
.arch{display:flex;flex-direction:column;gap:6px}
.arow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--col);padding:14px 0;align-items:baseline}
.arow:focus-visible{outline:2px solid var(--ink)}
.arow .t{font-size:clamp(24px,2.6vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1}
.arow:hover .t{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.arow:not(.cur) .t{color:var(--muted)}
@media (max-width:700px){.arow{grid-template-columns:1fr;row-gap:6px}}

/* Sources */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 8px;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0;font-weight:700}
thead th{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--faint);vertical-align:bottom;padding-bottom:20px}
.d1{display:inline-block;width:10px;height:10px;background:var(--ink)}
.cnt{font-size:24px;font-weight:800;letter-spacing:-.04em}
.srclist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:1000px){.srclist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.srclist{grid-template-columns:1fr}}
.srclist div{display:flex;flex-direction:column;gap:2px}
footer{font-size:12.5px;color:var(--faint);max-width:70ch}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Labo IA */
.tab[hidden]{display:none}
.src a{color:var(--ink);text-decoration:none;font-weight:700}
.src a:hover{text-decoration:underline}
.cmd{display:flex;align-items:flex-start;gap:14px;background:color-mix(in srgb,var(--ink) 7%,var(--bg));padding:14px 16px;min-width:0}
.cmd code{font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;min-width:0}
.cmd button{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);flex:none;padding-top:3px}
.cmd button:hover{color:var(--ink)} .cmd button:focus-visible{outline:2px solid var(--ink)}
.cc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px var(--col)}
.cc > div{display:flex;flex-direction:column;gap:10px;min-width:0}
.cc h3,.repo h3{font-size:clamp(22px,1.8vw,30px);letter-spacing:-.035em;line-height:1.05}
.cc p{font-size:15.5px;line-height:1.55;color:var(--muted)}
@media (max-width:800px){.cc{grid-template-columns:1fr}}
.repos{display:flex;flex-direction:column;gap:clamp(64px,6vw,104px)}
.repo{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px var(--col);align-items:start}
.repo .nm{display:flex;flex-direction:column;gap:12px;min-width:0}
.repo .nm a{color:inherit;text-decoration:none;overflow-wrap:anywhere}
.repo .nm a:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.repo .nm .ow{display:block;font-size:.6em;color:var(--muted);letter-spacing:-.01em;margin-bottom:4px}
.repo .st{color:var(--muted)} .repo .st b{color:var(--ink);font-weight:700}
.repo .tx{display:flex;flex-direction:column;gap:12px;min-width:0}
.repo .tx p{font-size:16.5px;line-height:1.6}
.repo .tx .why{color:var(--muted)}
@media (max-width:800px){.repo{grid-template-columns:1fr}}
.labcard{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(36px,4vw,72px);display:flex;flex-direction:column;gap:18px}
.labcard > :not(.spk){position:relative}
.labcard h3{font-size:clamp(30px,3.4vw,60px);line-height:.95;letter-spacing:-.045em}
.labcard p{font-size:clamp(17px,1.3vw,21px);line-height:1.45;max-width:54ch}
.labsteps{list-style:none;margin:clamp(44px,4vw,72px) 0 0;padding:0;display:flex;flex-direction:column;gap:40px;counter-reset:l}
.labsteps li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;counter-increment:l}
.labsteps li::before{content:counter(l,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--faint);padding-top:7px}
.labsteps .d{display:flex;flex-direction:column;gap:12px;min-width:0}
.labsteps .t{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.labsteps p{font-size:16px;line-height:1.6;color:var(--muted)}
@media (max-width:600px){.labsteps li{grid-template-columns:36px minmax(0,1fr)}}
.cl{display:block;color:var(--faint);margin:4px 0 -4px}
.models{display:flex;flex-direction:column;gap:6px}
.mdl{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr) minmax(0,3fr);gap:8px var(--col);padding:18px 0;align-items:baseline}
.mdl h3{font-size:clamp(22px,1.9vw,32px);letter-spacing:-.035em;line-height:1.05;margin-bottom:6px}
.mdl .mono{color:var(--muted)}
.mdl p{font-size:15.5px;line-height:1.5;color:var(--muted)}
.mdl .pr{color:var(--ink);font-weight:600}
@media (max-width:800px){.mdl{grid-template-columns:1fr;gap:6px}}
.build{display:flex;flex-direction:column;gap:16px;max-width:900px}
.build h3{font-size:clamp(30px,3.4vw,60px);line-height:.95;letter-spacing:-.045em}
.build > p{font-size:clamp(17px,1.3vw,20px);line-height:1.5}
.build .s{font-size:14px}
.crea{display:flex;flex-direction:column;gap:6px}
.crea a{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px var(--col);padding:14px 0;color:inherit;text-decoration:none;align-items:baseline}
.crea a .t{font-size:clamp(18px,1.5vw,24px);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.crea a .n{color:var(--muted);font-size:14px;display:block;font-weight:500;letter-spacing:0;margin-top:4px}
.crea a:hover .t{text-decoration:underline;text-underline-offset:4px}
.crea .go{color:var(--faint)}
@media (max-width:700px){.crea a{grid-template-columns:1fr auto}.crea a .mono:first-child{grid-column:1/-1}}

<script>
const LATEST = {"date": "2026-11-23", "label": "Lundi 23 novembre 2026", "period": "22 au 23 novembre", "sourcesCount": 2, "countLabel": "2 newsletters + 13 sources web", "hero": {"img": "img/2026-11-23/bourse.jpg", "alt": "Un écran de CNBC affiche la chute du Nasdaq et de Nvidia, devant un opérateur la tête dans la main à la Bourse de New York", "credit": "Michael Nagle/Bloomberg via Aktionnaire", "eyebrow": "À la une", "title": "Wall Street vit sa pire semaine depuis le Covid, l'IA en ligne de mire", "lede": "Le S&P 500 a perdu −8,03 % en cinq jours et entre en zone de correction ; le Nasdaq efface tous ses gains de l'année. Au centre de la tempête, Nvidia chute de −23 % sur la semaine, sa pire depuis 2008, et l'action Anthropic, à peine cotée, retombe vers son prix d'introduction. Les deux newsletters du jour posent la même question : la bulle de l'IA est-elle en train d'éclater ?"}, "brief": [["Marchés", "S&P 500 −8,03 %, Nasdaq −9,00 %, CAC 40 −5,46 % sur la semaine : la tech entraîne tout le monde."], ["Nvidia", "−14 % vendredi, −23 % sur la semaine ; Trump réclame le retour de Jensen Huang, le conseil d'administration refuse."], ["COP31", "Échec à Antalya : l'UE rejette un texte final muet sur les énergies fossiles, une première depuis 2009."], ["Worldline", "Soupçonné d'avoir embelli sa trésorerie avant ses publications ; l'action chute de −15 %."], ["Choose France", "Macron présente aujourd'hui 42,5 Md€ d'investissements d'entreprises françaises, dont 14,9 Md€ de projets nouveaux."]], "figures": [{"v": "−8,03 %", "l": "baisse du S&P 500 sur la semaine, qui entre en zone de correction (Aktionnaire)", "dir": "down"}, {"v": "−23 %", "l": "chute de Nvidia en cinq jours, sa pire semaine depuis 2008 ; plus de −40 % depuis octobre (Aktionnaire)", "dir": "down"}, {"v": "7,28 %", "l": "taux moyen du crédit immobilier à 30 ans aux États-Unis, contre 7,11 % une semaine plus tôt (Freddie Mac)", "dir": "up"}, {"v": "42,5 Md€", "l": "d'investissements d'entreprises françaises annoncés au sommet Choose France, dont 14,9 Md€ nouveaux (Aktionnaire)", "dir": "up"}], "themes": [{"title": "Marchés : la semaine où l'IA a vacillé", "stories": [{"eyebrow": "Bourse", "title": "La pire semaine de Wall Street depuis mars 2020", "text": ["Sur la semaine, le S&P 500 recule de −8,03 %, le Nasdaq de −9,00 % et le CAC 40 de −5,46 % (Aktionnaire). Le Dow Jones a perdu 8 %, sa plus forte baisse hebdomadaire depuis mars 2020, et le Nasdaq a effacé tous ses gains de l'année (CNN). L'indice tech de Morningstar a cédé plus de 12 %.", "Le recul touche aussi les valeurs refuges et les actifs risqués : l'or perd près de 6 %, le bitcoin −5,85 % à 60 969 $, et l'indice de volatilité de la tech, le VXN, atteint son plus haut depuis la pandémie (Aktionnaire). Lundi, le FT signale que la vente des valeurs technologiques s'étend aux marchés asiatiques."], "why": "Aktionnaire avance trois accélérateurs : les doutes sur le financement des investissements géants dans les centres de données, la perspective d'un durcissement réglementaire après la victoire démocrate aux élections de mi-mandat, et la démission de Jensen Huang. Bank of America juge l'euphorie terminée ; Goldman Sachs prévient que la baisse pourrait s'aggraver.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "CNN (web)", "Morningstar (web)"], "more": ["<b>Zone de correction.</b> On parle de correction quand un indice recule de 10 % à 20 % par rapport à son dernier sommet ; au-delà de 20 %, c'est un marché baissier.", "<b>Le contrepoint.</b> Selon des analystes cités par FactSet, le ratio cours/bénéfices prévisionnels de la tech est à son plus bas depuis 2020 : les prix baissent plus vite que les profits attendus."], "prog": "Marchés financiers, bulles spéculatives, instabilité financière"}, {"img": "img/2026-11-23/bessent.jpg", "alt": "Scott Bessent s'exprime devant un pupitre, drapeau américain en arrière-plan", "credit": "via myFT Daily Digest", "eyebrow": "Nvidia", "title": "Nvidia, la moitié de la chute à elle seule", "text": ["Nvidia a perdu −14 % vendredi et −23 % sur la semaine, sa pire depuis la crise de 2008, et plus de 40 % depuis octobre. Selon Aktionnaire, le groupe explique à lui seul la moitié du recul du S&P 500 depuis son sommet. CNN relie aussi la glissade à une enquête de la SEC sur sa comptabilité, d'abord rapportée par Reuters.", "Le 12 novembre, Jensen Huang a quitté la direction et le conseil d'administration ; la directrice financière Colette Kress assure l'intérim (Nvidia). Samedi, Donald Trump a appelé à réintégrer un Huang « brillant » (Al Jazeera), et le secrétaire au Trésor Scott Bessent n'a pas exclu son retour (myFT, SCMP). Le président du conseil a pourtant déclaré ne pas avoir l'intention de le reprendre."], "why": "Quand une seule entreprise pèse autant dans un indice, ses déboires deviennent un risque pour tout le marché : c'est le revers de la concentration des indices américains sur quelques géants de la tech.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "CNN (web)", "Nvidia (web)", "Al Jazeera (web)", "SCMP (web)"], "more": ["<b>Gouvernance.</b> L'intervention de la Maison Blanche dans le choix d'un dirigeant d'entreprise privée pose la question de l'indépendance des conseils d'administration."], "prog": "Gouvernance d'entreprise, concentration, rôle de l'État"}, {"eyebrow": "Anthropic", "title": "Une introduction en Bourse rattrapée par la tempête", "text": ["Introduite à 83 $, l'action Anthropic a gagné environ 17 % le premier jour avant de rendre l'essentiel de ce gain : elle a fini vendredi près de son prix d'introduction (NPR). Aktionnaire la donne à 88,91 $, en baisse de −15,34 % sur la semaine.", "Le FT se demande si les banques n'ont pas exercé trop vite l'option de surallocation, qui leur a permis d'émettre davantage d'actions, et si le titre pourra résister à la vente générale cette semaine."], "why": "La plus grosse introduction en Bourse de l'histoire devait rassurer sur la valeur des laboratoires d'IA ; elle n'a pas suffi à enrayer la chute. Le prix d'une action nouvellement cotée dépend autant du climat de marché que des fondamentaux de l'entreprise.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "NPR (web)"], "prog": "Marché primaire, financement de l'innovation, sentiment de marché"}]}, {"title": "France : entreprises, budget et investissements", "stories": [{"img": "img/2026-11-23/choose_france.jpg", "alt": "Emmanuel Macron parle sur scène devant un écran Choose France dans la galerie des Batailles du château de Versailles", "credit": "Gonzalo Fuentes/AFP via Aktionnaire", "eyebrow": "Investissement", "title": "Choose France, cette fois pour les entreprises françaises", "text": ["Ce lundi, l'Élysée organise « Choose France - Édition France », consacré aux investissements des entreprises tricolores sur le territoire. Emmanuel Macron doit annoncer 42,5 Md€ d'investissements, dont 14,9 Md€ de projets nouveaux (Aktionnaire, France 24). La première édition, en 2025, avait recensé 30,4 Md€ (Sud Radio).", "Selon le ministre Roland Lescure, le Grand Ouest concentre 37 projets pour 5,45 Md€ (France 24). Aktionnaire rappelle le contexte : l'investissement des entreprises françaises recule depuis quatre trimestres de suite."], "why": "Incertitude politique, ralentissement et coût du crédit freinent l'investissement : le sommet cherche à prouver que la France reste attractive. Mais le montant mêle projets déjà décidés et projets nouveaux, ce qui invite à la prudence sur l'effet réel.", "rep": 1, "sources": ["Aktionnaire", "France 24 (web)", "Sud Radio (web)"], "more": ["<b>Lecture critique.</b> Un chiffre agrégé d'annonces n'est pas un flux d'investissement nouveau : seuls 14,9 Md€ sur 42,5 Md€ correspondent à des projets inédits."], "prog": "Investissement, attractivité, politique industrielle"}, {"eyebrow": "Entreprises", "title": "Worldline accusé d'avoir maquillé sa trésorerie", "text": ["Selon une enquête du FT, le spécialiste français des paiements aurait, de 2021 à 2023, retardé le paiement de ses fournisseurs et exigé des avances de ses clients juste avant ses publications de résultats. Un rapport interne de PwC daté de fin 2023 chiffrerait l'effet à environ 38 % de ses flux de trésorerie (Aktionnaire).", "Pour 2022, ce rapport évaluerait à environ 200 M€ l'impact sur le flux de trésorerie disponible : environ 320 M€ au lieu des 520 M€ publiés (Investing.com, Option Finance). L'action a chuté de −15,47 % le 20 novembre. Worldline affirme que ses comptes sont audités et sans irrégularité."], "why": "Ces pratiques ne sont pas illégales en soi, mais elles donnent une image trompeuse de la santé financière aux actionnaires : c'est un cas d'école d'asymétrie d'information entre dirigeants et investisseurs.", "rep": 1, "sources": ["Aktionnaire", "Investing.com / Option Finance (web)"], "more": ["<b>Le besoin en fonds de roulement.</b> Payer ses fournisseurs plus tard et encaisser ses clients plus tôt gonfle la trésorerie à une date donnée, sans rien changer à la rentabilité."], "prog": "Gouvernance, information financière, théorie de l'agence"}, {"eyebrow": "Finances publiques", "title": "Une règle d'or budgétaire dans la Constitution ?", "text": ["Selon Aktionnaire, Emmanuel Macron envisage d'inscrire dans la Constitution un plafond de déficit ou une obligation de retour à l'équilibre, assortis de mécanismes correctifs. La réforme contraindrait le prochain gouvernement à une trajectoire de réduction des déficits.", "Vendredi soir, l'agence S&P doit réviser la note de la dette française, aujourd'hui A+ avec une perspective stable (Aktionnaire)."], "why": "Le débat est classique : une règle crédibilise la trajectoire auprès des marchés, mais elle prive l'État de sa marge de manœuvre en cas de crise. Son adoption, qui suppose une révision constitutionnelle, s'annonce difficile.", "rep": 1, "sources": ["Aktionnaire"], "prog": "Politique budgétaire, dette publique, règles contre discrétion"}]}, {"title": "Monde : climat, Europe et Amérique", "stories": [{"img": "img/2026-11-23/cop31.jpg", "alt": "La tribune de la COP31 à Antalya, sous un écran « UN Climate Change Conference, November 9-20, 2026 »", "credit": "Yasin Akgul/AFP/Getty Images via Aktionnaire", "eyebrow": "Climat", "title": "La COP31 s'achève sans accord", "text": ["Après deux jours de prolongation, la conférence d'Antalya s'est terminée le 22 novembre sans déclaration finale : l'Union européenne a rejeté le texte, qui ne mentionnait pas explicitement la sortie des énergies fossiles et se contentait d'une référence indirecte à l'engagement pris à Dubaï lors de la COP28 (Aktionnaire, France 24).", "L'UE, plusieurs pays du Pacifique et d'Amérique latine voulaient des engagements plus ambitieux ; les producteurs d'hydrocarbures, dont l'Arabie saoudite, s'y opposaient. Aucun échec de ce type n'avait été enregistré depuis Copenhague en 2009 (Aktionnaire). Les questions en suspens passent à la COP32, prévue en Éthiopie en 2027 (Agence Europe)."], "why": "Le FT y voit des fractures géopolitiques mises à nu entre le groupe arabe et la coalition menée par l'UE. Avec la règle du consensus, chaque pays dispose d'un veto de fait : la sortie des fossiles bute sur les intérêts des producteurs.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "France 24 (web)", "Agence Europe (web)"], "more": ["<b>Bien public mondial.</b> Le climat profite à tous, que l'on contribue ou non à sa protection : chaque pays a intérêt à laisser les autres faire l'effort. C'est le problème du passager clandestin."], "prog": "Économie du climat, biens publics mondiaux, gouvernance mondiale"}, {"eyebrow": "Europe", "title": "Londres et Bruxelles se rapprochent", "text": ["Au sommet de Bruxelles, le Premier ministre britannique Andy Burnham a de nouveau dénoncé le Brexit : « Nous avons perdu plus que nous avons gagné » (Aktionnaire). Le Royaume-Uni et l'UE ont conclu des accords sur les exportations alimentaires, le rapprochement de leurs marchés du carbone et la mobilité des jeunes (France 24).", "Dès 2030, 100 000 jeunes de chaque côté de la Manche pourront étudier, travailler ou voyager chez le voisin pendant trois ans. Ces accords pourraient rapporter jusqu'à 0,5 % de PIB supplémentaire au Royaume-Uni (Aktionnaire)."], "why": "Le rapprochement répond aussi aux doutes sur les engagements de sécurité américains envers l'Europe. Il montre le coût des barrières non tarifaires créées par le Brexit, que ces accords cherchent à réduire.", "rep": 1, "sources": ["Aktionnaire", "France 24 (web)"], "prog": "Intégration européenne, commerce, Brexit"}, {"eyebrow": "États-Unis", "title": "Le rêve de propriété s'éloigne, les démocrates contre-attaquent", "text": ["Donald Trump avait promis de ramener le taux des crédits immobiliers à 3 % ; il dépasse désormais 7 % (myFT). Selon Freddie Mac, le taux moyen à 30 ans atteignait 7,28 % la semaine du 19 novembre, contre 7,11 % une semaine plus tôt.", "Après leur victoire aux élections de mi-mandat, les démocrates veulent détricoter la politique fiscale et douanière du président : Richard Neal promet des auditions sur ses mesures phares (myFT)."], "why": "Le taux immobilier suit les taux longs, que la banque centrale ne contrôle pas directement : la promesse présidentielle se heurte aux marchés obligataires.", "rep": 1, "sources": ["myFT Daily Digest", "Freddie Mac (web)"], "prog": "Politique monétaire, taux longs, logement"}]}], "briefs": [["Espagne", "Législatives anticipées dimanche ; trois sondages publiés le 16 novembre donnaient la majorité au PP allié à Vox (Reuters, via The Star)."], ["Stellantis", "Le groupe, à −65 % en Bourse depuis janvier, abandonne l'endurance et la Formule E pour économiser 300 M€ par an (Aktionnaire)."], ["Chine", "Pour le FT, le sommet de Shenzhen montre que Xi Jinping a plus que jamais besoin de Donald Trump (myFT)."], ["Cyber", "Le premier port américain d'exportation de pétrole brut signale des milliers de tentatives de piratage par jour (myFT)."], ["Jeu vidéo", "GTA VI a généré 3,79 Md$ de ventes dès le premier jour, près de cinq fois GTA V en 2013 (Aktionnaire)."], ["Crypto", "Le meme coin de Trump est passé de 75 $ au pic à environ 0,95 $ ; les démocrates vont enquêter (Aktionnaire)."]], "good": "Dès 2030, 100 000 jeunes Britanniques et autant d'Européens pourront étudier, travailler ou voyager de l'autre côté de la Manche pendant trois ans, grâce à l'accord conclu à Bruxelles (Aktionnaire).", "map": {"start": "capex", "nodes": [{"id": "capex", "x": 200, "y": 34, "l": ["Investissements", "géants en IA"], "t": "Le point de départ", "d": "Les géants du cloud dépensent des centaines de milliards en centres de données."}, {"id": "doute", "x": 100, "y": 122, "l": ["Doutes sur", "le financement"], "t": "Le doute", "d": "Qui paiera, et quand ces dépenses seront-elles rentables ?"}, {"id": "politique", "x": 300, "y": 122, "l": ["Choc", "politique"], "t": "Le contexte", "d": "Victoire démocrate, risque réglementaire, départ de Jensen Huang."}, {"id": "nvidia", "x": 100, "y": 222, "l": ["Nvidia", "−23 %"], "t": "L'épicentre", "d": "La moitié du recul du S&P 500 depuis son sommet."}, {"id": "anthropic", "x": 300, "y": 222, "l": ["Anthropic", "retombe"], "t": "Le test", "d": "L'action revient vers son prix d'introduction de 83 $."}, {"id": "indices", "x": 100, "y": 322, "l": ["Indices en", "correction"], "t": "La contagion", "d": "S&P 500 −8,03 %, CAC 40 −5,46 %, Asie en baisse."}, {"id": "refuges", "x": 300, "y": 322, "l": ["Or et bitcoin", "reculent aussi"], "t": "Les ventes forcées", "d": "Les investisseurs vendent ce qui est liquide pour couvrir leurs pertes."}, {"id": "eco", "x": 200, "y": 414, "l": ["Économie", "réelle ?"], "t": "La question", "d": "Effet de richesse, coût du capital, investissement : la crise peut-elle déborder ?"}], "edges": [["capex", "doute"], ["capex", "politique"], ["doute", "nvidia"], ["politique", "anthropic"], ["nvidia", "indices"], ["anthropic", "refuges"], ["indices", "eco"], ["refuges", "eco"]]}, "dossiers": [{"eyebrow": "Finance", "title": "La bulle de l'IA est-elle en train d'éclater ?", "q": "Wall Street vient de vivre sa pire semaine depuis 2020, tirée par Nvidia et les valeurs de l'IA. Simple prise de bénéfices de fin d'année ou retournement durable d'une bulle spéculative ?", "steps": [["La promesse", "Des profits futurs immenses.", "Les valorisations de l'IA reposent sur des bénéfices attendus dans plusieurs années."], ["L'emballement", "Des prix qui s'auto-alimentent.", "La hausse attire de nouveaux acheteurs, qui font encore monter les prix : c'est la logique mimétique."], ["Le doute", "Le financement en question.", "Les investissements géants dans les centres de données inquiètent ; un choc politique et le départ de Jensen Huang font basculer le sentiment."], ["La sensibilité", "Le poids du taux.", "Plus les profits sont lointains, plus leur valeur actuelle chute quand le taux d'actualisation ou la prime de risque monte."], ["La contagion", "Des ventes en cascade.", "Indices, or et bitcoin reculent ensemble : les investisseurs vendent ce qu'ils peuvent pour couvrir leurs pertes."]], "calc": true, "split": [["C'est une bulle qui éclate", "Bank of America juge l'euphorie terminée, Goldman Sachs prévient que la baisse peut s'aggraver, et la volatilité de la tech atteint son plus haut depuis la pandémie."], ["C'est une correction saine", "Selon FactSet, le ratio cours/bénéfices prévisionnels de la tech est au plus bas depuis 2020 : les profits attendus restent solides, et les ventes peuvent relever de la prise de bénéfices."]], "refs": ["<b>Charles Kindleberger.</b> Manias, Panics and Crashes : euphorie, détresse puis panique, les étapes récurrentes des crises financières.", "<b>Hyman Minsky.</b> L'hypothèse d'instabilité financière : la stabilité nourrit la prise de risque, qui prépare la crise.", "<b>Robert Shiller.</b> Irrational Exuberance : les récits contagieux expliquent les bulles mieux que les fondamentaux.", "<b>André Orléan.</b> Le pouvoir de la finance : la valeur boursière naît de croyances collectives et de comportements mimétiques."], "accroche": "« La bulle de l'IA est-elle en train d'éclater ? » La question, posée par Aktionnaire le 23 novembre 2026, suit une semaine où Nvidia a perdu −23 % et le S&P 500 −8,03 %.", "sujets": ["Les marchés financiers sont-ils efficients ?", "Les bulles spéculatives sont-elles inévitables ?", "L'innovation technologique s'accompagne-t-elle forcément d'instabilité financière ?", "Faut-il réguler les marchés pour prévenir les crises ?"]}, {"eyebrow": "Climat", "title": "Pourquoi la diplomatie climatique échoue-t-elle ?", "q": "La COP31 s'est achevée sans accord, faute de consensus sur la sortie des énergies fossiles. Pourquoi la coopération internationale peine-t-elle tant à protéger le climat ?", "steps": [["Le bien commun", "Un climat partagé.", "La stabilité du climat profite à tous, qu'on y contribue ou non."], ["L'incitation", "Le passager clandestin.", "Chaque pays a intérêt à laisser les autres réduire leurs émissions, tout en profitant du résultat."], ["La règle", "Le consensus.", "À la COP, un texte doit être accepté par tous : les producteurs d'hydrocarbures disposent d'un veto de fait."], ["Le blocage", "Antalya, 22 novembre.", "L'UE refuse un texte muet sur les fossiles ; les producteurs refusent un texte plus ambitieux."], ["Les issues", "Coalitions et prix du carbone.", "Clubs climatiques, taxe carbone aux frontières, rapprochement des marchés du carbone, comme entre Londres et Bruxelles."]], "refs": ["<b>Garrett Hardin.</b> La tragédie des communs : une ressource partagée tend à être surexploitée.", "<b>Elinor Ostrom.</b> La gestion des communs est possible avec des règles adaptées et des institutions locales.", "<b>William Nordhaus.</b> Les clubs climatiques : sanctionner commercialement les pays qui ne coopèrent pas.", "<b>Mancur Olson.</b> La logique de l'action collective : plus le groupe est grand, plus la coopération est difficile."], "accroche": "Le 22 novembre 2026, la COP31 d'Antalya s'achève sans déclaration finale : une première depuis Copenhague en 2009, sur le même point de blocage, les énergies fossiles.", "sujets": ["La lutte contre le changement climatique peut-elle se passer d'une gouvernance mondiale ?", "Le multilatéralisme est-il en crise ?", "Faut-il donner un prix au carbone ?"]}, {"eyebrow": "Finances publiques", "title": "Faut-il graver une règle d'or dans la Constitution ?", "q": "Emmanuel Macron envisagerait d'inscrire dans la Constitution un plafond de déficit ou une obligation d'équilibre. Une règle peut-elle discipliner durablement les finances publiques ?", "steps": [["Le constat", "Des déficits persistants.", "La France n'a pas présenté de budget à l'équilibre depuis des décennies et sa note est sous surveillance."], ["Le biais", "La tentation de dépenser.", "Les gouvernements privilégient le court terme électoral et reportent l'ajustement."], ["La règle", "Se lier les mains.", "Un plafond constitutionnel rend l'engagement crédible et rassure les créanciers."], ["La limite", "La perte de souplesse.", "En récession, la règle empêche la relance et peut aggraver la crise."], ["Le compromis", "Des règles intelligentes.", "Solde structurel, clauses dérogatoires, institutions indépendantes de contrôle."]], "split": [["Pour la règle d'or", "Elle corrige le biais en faveur du déficit, crédibilise la trajectoire auprès des marchés et des agences de notation, et protège les générations futures."], ["Contre la règle d'or", "Elle prive l'État de sa capacité de relance en crise, réduit le débat démocratique sur le budget et peut être contournée par des artifices comptables."]], "refs": ["<b>Finn Kydland et Edward Prescott.</b> L'incohérence temporelle : les règles battent la discrétion quand la crédibilité compte.", "<b>James Buchanan.</b> L'économie publique des choix : les politiques ont un biais structurel vers le déficit.", "<b>John Maynard Keynes.</b> Le déficit comme outil contracyclique en période de sous-emploi.", "<b>Olivier Blanchard.</b> Quand le taux d'intérêt est inférieur à la croissance, la dette publique coûte moins cher qu'on ne le croit."], "accroche": "En novembre 2026, alors que S&P s'apprête à réviser la note de la France, Emmanuel Macron envisagerait de constitutionnaliser une règle d'or budgétaire.", "sujets": ["Les règles budgétaires sont-elles efficaces ?", "Faut-il réduire la dette publique ?", "La politique budgétaire a-t-elle encore des marges de manœuvre ?"]}], "flash": [["−8,03 %", "S&P 500", "Baisse sur la semaine ; l'indice entre en correction."], ["−9,00 %", "Nasdaq", "Il efface tous ses gains de l'année."], ["−23 %", "Nvidia", "Pire semaine depuis 2008 ; −14 % le seul vendredi."], ["88,91 $", "Anthropic", "Cours de fin de semaine, −15,34 % ; introduit à 83 $."], ["7,28 %", "Crédit immobilier", "Taux moyen à 30 ans aux États-Unis (Freddie Mac)."], ["42,5 Md€", "Choose France", "Investissements annoncés, dont 14,9 Md€ nouveaux."], ["−15,47 %", "Worldline", "Chute de l'action le 20 novembre après l'enquête du FT."], ["2009", "COP", "Dernier échec comparable à celui d'Antalya : Copenhague."], ["100 000", "Jeunes", "Par an et de chaque côté de la Manche, dès 2030."]], "quiz": [{"q": "À partir de quelle baisse depuis le sommet parle-t-on de « correction » ?", "o": ["5 %", "10 %", "20 %", "30 %"], "a": 1, "e": "Une correction correspond à une baisse de 10 % à 20 % ; au-delà de 20 %, on parle de marché baissier."}, {"q": "De combien Nvidia a-t-elle chuté sur la semaine ?", "o": ["−8 %", "−14 %", "−23 %", "−40 %"], "a": 2, "e": "−23 % sur la semaine, dont −14 % vendredi ; plus de −40 % depuis octobre."}, {"q": "Qui assure l'intérim à la tête de Nvidia ?", "o": ["Jensen Huang", "Colette Kress", "Scott Bessent", "Harvey Jones"], "a": 1, "e": "La directrice financière Colette Kress dirige le groupe depuis le départ de Jensen Huang le 12 novembre."}, {"q": "Pourquoi l'UE a-t-elle rejeté le texte final de   const cache={}; if(LATEST) cache[LATEST.date]=LATEST;

  function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);
  }

  function calcHTML(){return `
    <div class="calc">
      <div class="l">
        <span class="k">Maths appliquées · Actualisation</span>
        <h3>Pourquoi les taux font plus mal aux valeurs de l'IA</h3>
        <div class="formula">V = Σ (t = 1…30) CF<sub>t</sub> / (1 + r)<sup>t</sup></div>
        <p class="note">Deux entreprises gagnent la même somme sur 30 ans. L'entreprise <b>mature</b> touche 10 par an dès maintenant. L'entreprise <b>IA</b> gagne peu au début puis beaucoup plus tard (croissance de 25 % par an pendant 15 ans).</p>
      </div>
      <div class="r">
        <div class="slider"><label for="rate"><span class="k">Taux d'actualisation r</span><span class="rv" id="rateV">3,0 %</span></label><input type="range" id="rate" min="1" max="9" step="0.25" value="3"></div>
        <div class="bars">
          <div class="barrow"><span class="k">Mature</span><div class="track"><div class="fill" id="barA"></div></div><span class="num" id="valA">100</span></div>
          <div class="barrow"><span class="k">IA</span><div class="track"><div class="fill ia" id="barB"></div></div><span class="num" id="valB">100</span></div>
        </div>
        <p class="note" id="calcMsg"></p>
      </div>
    </div>`;}
  function initCalc(){
    const A=Array.from({length:30},()=>10), raw=Array.from({length:30},(_,i)=>Math.pow(1.25,Math.min(i,15)));
    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);
    const f1=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
    const rate=$('#rate');
    const upd=()=>{const r=parseFloat(rate.value)/100,a=pv(A,r)/bA*100,b=pv(B,r)/bB*100,mx=Math.max(a,b,100);
      $('#rateV').textContent=f1(r*100)+' %';$('#valA').textContent=Math.round(a);$('#valB').textContent=Math.round(b);
      $('#barA').style.width=(a/mx*100)+'%';$('#barB').style.width=(b/mx*100)+'%';
      const a1=pv(A,r+.01)/pv(A,r)-1,b1=pv(B,r+.01)/pv(B,r)-1;
      $('#calcMsg').innerHTML=`Base 100 à r = 3 %. À ${f1(r*100)} %, un point de taux en plus fait perdre <b class="down">${f1(-a1*100)} %</b> à l'entreprise mature et <b class="down">${f1(-b1*100)} %</b> à l'entreprise IA. Plus les profits sont lointains, plus la valeur est sensible au taux : c'est la duration.`;};
    rate.addEventListener('input',upd);upd();
  }

  /* ---------- Encre : moteur graphique commun ----------
     Un seul contexte WebGL hors écran dessine toutes les couches vivantes du site : grain des fonds, grain du titre,
     signature de l'édition et traitement photocopie des photos. Chaque couche est un canvas 2D placé dans la page :
     elle défile avec le contenu, n'est recalculée que si elle est visible, et partage le même bruit, la même encre
     et le même papier que les autres. Rien n'est calculé hors écran ni onglet caché ; prefers-reduced-motion fige tout. */
  const ink=(()=>{
    const gc=document.createElement('canvas');
    const gl=gc.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false,powerPreference:'low-power'});
    const api={scan(){},photo(){},on:false};
    if(!gl) return api;
    const still=matchMedia('(prefers-reduced-motion: reduce)'), dark=matchMedia('(prefers-color-scheme: dark)');
    const t0=performance.now()-Math.random()*3e6, MAXDPR=2, FPS=1000/24;
    const HEAD=`precision highp float;
uniform vec2 uSize; uniform float uDpr,uTime,uSeed; uniform vec3 uInk,uRiso;
vec3 m3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 m4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 pm(vec4 x){return m4(((x*34.)+1.)*x);}
float sn(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy)),x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz),l=1.-g,i1=min(g,l.zxy),i2=max(g,l.zxy);
  vec3 x1=x0-i1+C.xxx,x2=x0-i2+C.yyy,x3=x0-D.yyy;
  i=m3(i);
  vec4 p=pm(pm(pm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  vec3 ns=.142857142857*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z),xx=floor(j*ns.z),yy=floor(j-7.*xx);
  vec4 x=xx*ns.x+ns.yyyy,y=yy*ns.x+ns.yyyy,h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy),b1=vec4(x.zw,y.zw),s0=floor(b0)*2.+1.,s1=floor(b1)*2.+1.,sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy,a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x),p1=vec3(a0.zw,h.y),p2=vec3(a1.xy,h.z),p3=vec3(a1.zw,h.w);
  vec4 nr=1.79284291400159-.85373472095314*vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
  p0*=nr.x;p1*=nr.y;p2*=nr.z;p3*=nr.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m*=m;

        if(!img.complete) img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      kick();
    }
    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
  function fitStair(el){
    const W=el.clientWidth; if(!W||el._w===W) return; el._w=W;
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let k=1;
    el.querySelectorAll(':scope > span').forEach(s=>{const pad=parseFloat(getComputedStyle(s).paddingLeft)||0,text=s.scrollWidth-pad;if(text>0)k=Math.min(k,(W-pad)/text);});
    if(k<1) el.style.fontSize=(base*k*.985)+'px';
  }
  const stairRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitStair(e.target))):null;
  function fitStairs(){document.querySelectorAll('.stair').forEach(el=>{el._w=0;fitStair(el);if(stairRO)stairRO.observe(el);});}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStairs);
  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();fitStairs();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
