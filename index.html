<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc{grid-row:auto}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}

<script>
const LATEST = {"date": "2026-11-12", "label": "Jeudi 12 novembre 2026", "period": "11 au 12 novembre", "sourcesCount": 5, "countLabel": "5 newsletters + 7 sources web", "hero": {"img": "img/2026-11-12/anthropic.jpg", "alt": "Dario Amodei, patron d'Anthropic, lève l'index lors d'une table ronde du Forum économique mondial", "credit": "Via The San Francisco Standard", "eyebrow": "À la une", "title": "Anthropic : l'introduction en Bourse « trop importante pour échouer »", "lede": "Face à une demande massive, les banques d'Anthropic envisagent de relever la valorisation du créateur de Claude à 1 500 Md$ ou plus, selon le FT. L'opération pourrait dépasser 100 Md$ levés et battre le record de SpaceX. Le même jour, OpenAI publie des pertes de 10,9 Md$ sur un trimestre. Quatre des cinq newsletters du jour en parlent."}, "brief": [["Anthropic", "Les banques envisagent de relever la valorisation à 1 500 Md$ ou plus (FT). Cotation sur le Nasdaq attendue la semaine prochaine, sous le symbole « ANT »."], ["Nvidia", "Nouvelles révélations du New York Times sur Jensen Huang : l'action chute de près de 10 % et, selon plusieurs médias, le conseil d'administration envisage de l'écarter."], ["Dette", "France et Belgique deviennent les nouveaux « maillons faibles » de la zone euro : le taux à 10 ans français a pris 1,6 point depuis fin février."], ["Espagne", "Première grève générale depuis 14 ans contre la crise du logement, à 18 jours des législatives anticipées du 29 novembre."], ["Taux", "Inflation américaine de +0,4 % en octobre : la Fed se prépare à monter ses taux en décembre, peut-être d'un demi-point."]], "figures": [{"v": "1 500 Md$", "l": "valorisation qu'Anthropic pourrait viser après une forte demande des investisseurs (FT)", "dir": "up"}, {"v": "−10,9 Md$", "l": "perte d'exploitation d'OpenAI au troisième trimestre, pour 10 Md$ de chiffre d'affaires", "dir": "down"}, {"v": "+1,6 pt", "l": "hausse du taux d'emprunt français à 10 ans depuis le début de la guerre avec l'Iran", "dir": "up"}, {"v": "+0,4 %", "l": "hausse des prix à la consommation aux États-Unis en octobre, sur un mois", "dir": "up"}], "themes": [{"title": "L'IA face au verdict des marchés", "stories": [{"eyebrow": "Introduction en Bourse", "title": "Anthropic veut lever le plus possible, pas valoir le plus possible", "text": ["La fourchette officielle reste de 70 à 78 $ par action pour 825 millions d'actions, soit jusqu'à 64,4 Md$ levés et 1 400 Md$ de valorisation. Mais selon le FT, les banques étudient déjà une hausse à 1 500 Md$ ou plus. Avec cette hausse, les fonds levés dépasseraient 100 Md$, devant le record de SpaceX (86 Md$).", "Trois actionnaires expliquent au FT que l'objectif est de lever un maximum d'argent pour payer la puissance de calcul : Anthropic a révélé 900 Md$ d'engagements en infrastructures. Sept partenaires, dont Google et Nvidia, achèteront aussi 26 Md$ d'actions sans droit de vote au prix de l'introduction (Fortune)."], "why": "Les chiffres donnent le vertige : 4,6 Md$ de chiffre d'affaires en 2025, un rythme annualisé d'environ 81 Md$ fin octobre (Fortune), et plus de 600 Md$ prévus en 2030 par Goldman Sachs. Au troisième trimestre, Anthropic a réalisé 17 Md$ de chiffre d'affaires pour une perte de 467 M$ (Aktionnaire).", "rep": 4, "sources": ["FT Newswrap", "TNBS", "Aktionnaire", "Économix", "Fortune (web)"], "more": ["<b>« Trop importante pour échouer ».</b> FT Alphaville estime que l'opération porte tout le secteur : elle a déjà aidé les valeurs technologiques à se reprendre après leur chute post-élections de mi-mandat.", "<b>Prudence.</b> Des investisseurs se replient sur des valeurs défensives, doutant que des dépenses aussi massives soient rentables. « Un week-end est une éternité sur ce marché », résume l'un d'eux au FT.", "<b>Le calendrier.</b> Cotation sur le Nasdaq sous le symbole « ANT », possible dès le mercredi ou le jeudi de la semaine prochaine (Fortune)."], "prog": "Marchés financiers, financement de l'innovation, valorisation des actifs"}, {"img": "img/2026-11-12/huang.jpg", "alt": "Jensen Huang, patron de Nvidia, en veste de cuir noire, l'air grave, devant un fond bleu", "credit": "Carlos Barria/Reuters, via Aktionnaire", "eyebrow": "Nvidia", "title": "Jensen Huang au bord de la sortie", "text": ["Quelques jours après avoir reconnu une relation avec une espionne chinoise présumée, Jensen Huang est visé par de nouvelles révélations du New York Times sur une relation avec une cadre placée sous son autorité. L'action Nvidia a chuté de près de 10 %. Selon le WSJ, CNBC, le FT et Bloomberg, cités par Aktionnaire, le conseil d'administration se préparerait à l'écarter et travaillerait avec un cabinet de recrutement."], "why": "Le FT ajoute que le département du Commerce retarde l'inscription sur liste noire d'une société liée à l'espionne présumée, et que Donald Trump dit que le FBI « s'intéresse » à Huang. L'affaire révèle aussi le rôle de Singapour comme plaque tournante des puces américaines vers la Chine.", "rep": 2, "sources": ["Aktionnaire", "FT Newswrap", "Khaleej Times (web)"], "more": ["<b>Le pari du vendeur à découvert.</b> En mai, le petit fonds Culper Research avait publié un rapport sur ces liens et parié à la baisse sur l'action. Nvidia a perdu 25 % depuis (Aktionnaire).", "<b>Pas de successeur désigné.</b> Sur le marché de prédiction Kalshi, la probabilité de son départ est passée de 40 % à près de 80 %."], "prog": "Gouvernance d'entreprise, théorie de l'agence, guerre technologique sino-américaine"}, {"eyebrow": "Résultats", "title": "OpenAI grandit vite, mais perd plus encore", "text": ["Le créateur de ChatGPT a réalisé 10 Md$ de chiffre d'affaires au troisième trimestre, +50 % par rapport au trimestre précédent. Mais sa perte d'exploitation atteint 10,9 Md$, contre 10,1 Md$ trois mois plus tôt. Sa marge opérationnelle ajustée s'améliore pourtant, de −150 % à −109 %."], "why": "La comparaison tombe mal à une semaine de l'introduction en Bourse de son rival : Anthropic affiche 17 Md$ de chiffre d'affaires et une perte de 467 M$. Pour se redresser, OpenAI mise sur l'IA pour les entreprises et sur la publicité, en espérant entrer en Bourse l'an prochain.", "rep": 2, "sources": ["Aktionnaire", "Économix"], "prog": "Économies d'échelle, coûts fixes, concurrence oligopolistique"}], "items": []}, {"title": "Zone euro : la nouvelle carte du risque", "stories": [{"img": "img/2026-11-12/taux_graph.jpg", "alt": "Graphique : hausse des taux à 10 ans depuis février 2026 ; la France monte le plus, devant la Belgique et l'Italie, l'Allemagne le moins", "credit": "FT, données LSEG, via Économix", "eyebrow": "Dette souveraine", "title": "France et Belgique prennent la place de l'Italie au fond de la classe", "text": ["Depuis le début de la guerre avec l'Iran fin février, le taux d'emprunt français à 10 ans a bondi de 1,6 point et a brièvement dépassé 5 %, une première depuis 2002. Celui de la Belgique a pris 1,2 point, à environ 4,3 %. L'Espagne, portée par une croissance attendue à +2,4 % en 2026, ne prend que 0,8 point.", "La France cumule une dette proche de 120 % du PIB, un déficit supérieur à 5 % et un plan d'environ 43 Md€ d'économies et de hausses d'impôts à faire voter sans majorité. La Belgique a des chiffres proches."], "why": "Différence clé : la dette française est énorme et très liquide. Il est donc facile de parier contre elle, par exemple en vendant à découvert des obligations. Selon Eurostat, la dette publique atteignait 115,7 % du PIB fin 2025 en France et 108,1 % en Belgique.", "rep": 2, "sources": ["Économix", "FT Newswrap", "Eurostat (web)"], "more": ["<b>L'inflation complique tout.</b> La hausse de l'énergie a ramené l'inflation de la zone euro à 4 %, au plus haut depuis 2023. Plus elle dure, plus les taux restent hauts.", "<b>Le filet de la BCE.</b> Klaas Knot, candidat à la présidence de la BCE, assure qu'elle « n'hésitera pas » à intervenir en cas de crise de la dette, quitte à créer un nouvel outil."], "prog": "Dette publique, primes de risque, politique monétaire de la BCE"}, {"img": "img/2026-11-12/drapeaux.jpg", "alt": "Les drapeaux de la France, de l'Union européenne et de la Belgique flottent sous un ciel bleu", "credit": "Via Économix", "eyebrow": "Budget 2027", "title": "Un budget sans majorité", "text": ["Le 4 novembre, les députés ont rejeté à l'unanimité la partie « recettes » du projet de loi de finances pour 2027. Le texte initial du gouvernement part donc au Sénat sans que l'Assemblée ait examiné les dépenses. Selon LCP, le Premier ministre Sébastien Lecornu pourrait recourir au 49.3."], "why": "C'est exactement ce que redoutent les marchés : un pays très endetté qui peine à voter ses efforts budgétaires. Économix y voit trois ingrédients d'un écart durable avec l'Allemagne : croissance faible, dépenses élevées et coût du financement en hausse.", "rep": 1, "sources": ["Économix", "LCP (web)"], "prog": "Politique budgétaire, soutenabilité de la dette, institutions"}], "items": []}, {"title": "Le retour des hausses de taux", "stories": [{"img": "img/2026-11-12/inflation.jpg", "alt": "Un client pousse un chariot devant des rayons d'œufs dans un supermarché américain", "credit": "Getty Images, via CNBC", "eyebrow": "États-Unis", "title": "Inflation : la Fed n'exclut plus un demi-point", "text": ["Les prix à la consommation ont augmenté de 0,4 % en octobre, plus que les 0,3 % attendus ; hors énergie et alimentation, +0,3 %. L'électricité prend 0,9 % et l'alimentation 0,5 %. Aucun taux sur un an n'est publié : le shutdown de 2025 avait empêché la collecte des prix d'octobre 2025."], "why": "Le gouverneur Christopher Waller juge qu'une hausse d'un demi-point pourrait se discuter en décembre, une première depuis quatre ans. Une hausse d'un quart de point est déjà entièrement anticipée par les marchés, à partir d'un taux directeur de 3,75 à 4 %. L'inflation dépasse la cible de 2 % depuis environ cinq ans et demi (CNBC).", "rep": 1, "sources": ["FT Newswrap", "CNBC (web)"], "more": ["<b>Les causes citées.</b> Droits de douane, guerre avec l'Iran, dépenses liées à l'IA et prix de l'énergie, selon les responsables de la Fed.", "<b>Les avis.</b> Lorie Logan (Fed de Dallas) voit le besoin de deux nouvelles hausses d'un quart de point ; Anna Paulson (Philadelphie) juge « appropriée » une poursuite graduelle du resserrement."], "prog": "Inflation, politique monétaire, règle de Taylor"}, {"eyebrow": "Europe", "title": "Partout, l'argent coûte plus cher", "text": ["Au Royaume-Uni, une responsable de la Banque d'Angleterre voit réunies les conditions d'une inflation « persistante » et n'exclut pas une deuxième hausse de taux d'affilée. En Allemagne, Friedrich Merz est appelé à freiner l'emprunt pour la défense avant que la charge d'intérêts ne pèse trop sur le budget. En Italie, les banques dénoncent un projet de taxe de 7 Md€ sur trois ans."], "why": "Le FT consacre sa grande enquête à « la fin de l'argent bon marché » pour les entreprises américaines : la hausse du coût de l'emprunt frappe d'abord les plus endettées.", "rep": 2, "sources": ["FT Newswrap", "FT Opinion"], "prog": "Coût du capital, investissement, effet d'éviction"}], "items": []}, {"title": "Europe : colère sociale et campagnes électorales", "stories": [{"img": "img/2026-11-12/madrid.jpg", "alt": "Vue de nuit d'une foule immense sous des parapluies sur la place de Cibeles, à Madrid", "credit": "Alejandro Martinez Velez/Reuters, via Aktionnaire", "eyebrow": "Espagne", "title": "La première grève générale depuis 14 ans", "text": ["Les deux grands syndicats, CCOO et UGT, ont appelé à une grève de 24 heures le 11 novembre, avec pour mot d'ordre « salaires, logement, prix ». Selon une confédération organisatrice, 4 millions de personnes y auraient participé. Transports, usines et services publics ont été perturbés, et des heurts ont opposé piquets de grève et police."], "why": "Le loyer moyen atteint 1 176 € par mois, pour un salaire moyen des jeunes de 1 190 €, selon le Conseil de la jeunesse espagnol. La Banque d'Espagne estime qu'il manque 750 000 logements, et plus d'un million d'ici 2028. Les élections législatives anticipées ont lieu le 29 novembre (Al Jazeera).", "rep": 2, "sources": ["Aktionnaire", "FT Newswrap", "Al Jazeera (web)"], "more": ["<b>Le paradoxe espagnol.</b> L'Espagne est l'une des économies les plus dynamiques de la zone euro (+2,4 % attendus en 2026), mais la croissance ne se traduit pas en logements abordables.", "<b>Les origines.</b> Le mouvement prolonge les manifestations pour le logement nées fin septembre."], "prog": "Inégalités, marché du logement, conflits sociaux"}, {"eyebrow": "France", "title": "Impôt sur le revenu : 48 % des foyers paient", "text": ["Les recettes de l'impôt sur le revenu atteignent 92,6 Md€ en 2025, +1 % sur un an après +9,9 % en 2024. Sur 42,1 millions de foyers déclarants, 20,1 millions l'ont payé, soit environ 48 %. Les 10 % les plus aisés acquittent 73 % de l'impôt total (DGFiP)."], "why": "L'impôt des 10 % les plus aisés a reculé de 1,4 % en moyenne en 2025, tandis que celui des classes moyennes et supérieures a augmenté de 3 à 12 %, du fait de la hausse de leurs revenus (Aktionnaire). La part des pensions de retraite dans les revenus déclarés progresse.", "rep": 2, "sources": ["Aktionnaire", "Économix"], "prog": "Fiscalité, progressivité, redistribution"}, {"eyebrow": "Présidentielle 2027", "title": "Zemmour candidat, Lagarde testée", "text": ["Éric Zemmour officialise sa candidature, cinq ans après ses 7,07 % du premier tour de 2022. Un sondage crédite Christine Lagarde, présidente de la BCE, de 14 % au premier tour si elle se présentait."], "why": "La campagne s'ouvre dans un contexte de défiance des marchés envers la dette française : les programmes budgétaires seront scrutés par les investisseurs autant que par les électeurs.", "rep": 2, "sources": ["Économix", "Aktionnaire"], "prog": "Vie politique, économie politique des finances publiques"}], "items": []}, {"title": "Consommation, médias et plateformes", "stories": [{"eyebrow": "Société", "title": "La « friendflation » : l'amitié coûte cher", "text": ["Voir ses amis coûte en moyenne 393 $ par mois aux États-Unis et 335 € en France. 67 % des Américains ont déjà renoncé à un événement social faute d'argent ; en France, 44 % de la génération Z refuse des sorties pour des raisons financières. Les dépenses de sorties ont augmenté de 17 % depuis 2019."], "why": "Un bon exemple de consommation ostentatoire (Veblen) amplifiée par les réseaux sociaux, et de la façon dont l'inflation se diffuse aux liens sociaux.", "rep": 1, "sources": ["TNBS"], "prog": "Consommation, socialisation, inégalités"}, {"eyebrow": "Régulation", "title": "Bruxelles s'attaque aux pièges des plateformes", "text": ["Le Digital Fairness Act imposerait la résiliation des abonnements numériques en deux clics et interdirait les essais gratuits transformés automatiquement en abonnements payants, les fausses promotions et les interfaces manipulatrices. Bruxelles estime le gain pour les consommateurs à 13,7 Md€ par an. Le texte doit encore être adopté."], "why": "Le FT note que Bruxelles dévoile de nouvelles règles pour les géants du numérique malgré sa promesse de simplification. En France, un projet de loi obligerait les annonceurs à consacrer 10 % de leur budget publicitaire en ligne aux sites d'information, sous peine de 75 000 € d'amende ; Google et Meta captent 82 % des revenus publicitaires du web français (TNBS).", "rep": 2, "sources": ["Économix", "FT Newswrap", "TNBS"], "prog": "Concurrence, protection du consommateur, économie des plateformes"}], "items": []}], "briefs": [["Fnac Darty", "Daniel Kretinsky prend le contrôle : son groupe EP détient 69,3 % du capital après son offre à 35 € par action, rouverte du 12 au 25 novembre."], ["Carburants", "Selon Terra Nova, ramener la TVA de 20 % à 5,5 % coûterait 6 Md€ par an sans faire passer le gazole sous 2 € le litre."], ["Immobilier", "La Fnaim anticipe un recul de 3 à 5 % des ventes en 2026 et des prix en baisse de 1 % sur un an."], ["Chine", "6,8 millions de mariages en 2025, contre 12,2 millions dix ans plus tôt (−44 %) : Pékin tente de relancer les unions."], ["Alertes à la bombe", "Des centaines d'écoles évacuées en Italie, en Écosse et en Irlande, dans ce qui semble être une attaque coordonnée."], ["Paris sur la téléréalité", "Sur Kalshi, les paris sur le divertissement atteignent 814 M$ au 25 septembre 2026, contre 300 M$ sur toute l'année 2025."]], "good": "Aux États-Unis, le nombre de personnes sans domicile a connu l'an dernier sa plus forte baisse depuis plus de dix ans, après des années de records. C'est la deuxième année de suite qu'il recule (FT Newswrap).", "map": {"start": "iran", "nodes": [{"id": "iran", "x": 200, "y": 34, "l": ["Guerre avec l'Iran :", "énergie plus chère"], "t": "Le choc d'offre", "d": "Depuis fin février, la hausse de l'énergie nourrit l'inflation des deux côtés de l'Atlantique."}, {"id": "infus", "x": 100, "y": 122, "l": ["États-Unis : +0,4 %", "de prix en octobre"], "t": "Une inflation tenace", "d": "Plus que prévu, avec l'électricité (+0,9 %) et l'alimentation (+0,5 %) en tête."}, {"id": "infez", "x": 300, "y": 122, "l": ["Zone euro : 4 %", "d'inflation"], "t": "Au plus haut depuis 2023", "d": "L'énergie pousse les prix ; les taux longs suivent."}, {"id": "fed", "x": 100, "y": 222, "l": ["La Fed prépare", "une hausse de taux"], "t": "Un quart ou un demi-point ?", "d": "Christopher Waller n'exclut pas un demi-point en décembre, une première depuis quatre ans."}, {"id": "oat", "x": 300, "y": 222, "l": ["OAT 10 ans : +1,6 pt", "et cap des 5 %"], "t": "La France sous surveillance", "d": "Avec la Belgique, la France devient le nouveau maillon faible de la zone euro."}, {"id": "capital", "x": 200, "y": 322, "l": ["Le coût du capital", "remonte partout"], "t": "La fin de l'argent bon marché", "d": "Entreprises endettées, États et projets de long terme paient plus cher leur financement."}, {"id": "anthropic", "x": 100, "y": 414, "l": ["Anthropic vise", "1 500 Md$"], "t": "Le test de l'IA", "d": "Une valorisation fondée sur des profits lointains, donc très sensible aux taux. La demande reste pourtant massive."}, {"id": "budget", "x": 300, "y": 414, "l": ["Budget 2027 :", "pas de majorité"], "t": "Un effort difficile à voter", "d": "Environ 43 Md€ d'économies et de hausses d'impôts, sans majorité à l'Assemblée."}], "edges": [["iran", "infus"], ["iran", "infez"], ["infus", "fed"], ["infez", "oat"], ["fed", "capital"], ["oat", "capital"], ["capital", "anthropic"], ["oat", "budget"]]}, "dossiers": [{"eyebrow": "Dette souveraine", "title": "Pourquoi les marchés regardent Paris plutôt que Madrid", "q": "Il y a quinze ans, la crise de la dette frappait la Grèce, l'Italie et l'Espagne. En 2026, c'est la France qui paie la plus forte hausse de taux de la zone euro. Comment un grand pays devient-il un « maillon faible » ?", "steps": [["Le choc", "La guerre avec l'Iran relance l'inflation.", "L'énergie plus chère pousse l'inflation de la zone euro à 4 %. Les investisseurs exigent des taux plus élevés pour compenser la perte de pouvoir d'achat de leurs placements."], ["Le tri", "Les marchés regardent les fondamentaux.", "Ils comparent croissance, déficit et dette. L'Espagne (+2,4 % de croissance attendue) s'en sort ; la France (dette proche de 120 % du PIB, déficit supérieur à 5 %) et la Belgique décrochent."], ["La prime de risque", "Le taux français dépasse 5 %.", "Le taux à 10 ans français prend 1,6 point, contre 0,8 point pour l'Espagne. L'écart avec l'Allemagne, l'emprunteur de référence, mesure la défiance."], ["La spéculation", "La liquidité devient une faiblesse.", "La dette française, très abondante et facile à échanger, permet de parier contre elle à moindre coût, par la vente à découvert. La Belgique, moins liquide, est moins exposée à ces paris."], ["La contrainte politique", "Un budget sans majorité.", "Le plan d'environ 43 Md€ doit passer devant une Assemblée qui a rejeté à l'unanimité la partie recettes. Plus le doute dure, plus la prime de risque s'installe."], ["Le filet de sécurité", "La BCE en dernier recours.", "Klaas Knot assure que la BCE « n'hésitera pas » à intervenir. Mais ses outils sont conditionnés au respect des règles budgétaires : l'aléa moral reste au cœur du débat."]], "calc": true, "refs": ["<b>Paul De Grauwe (2011).</b> Dans une union monétaire, un État emprunte dans une monnaie qu'il ne contrôle pas : il est exposé aux crises de liquidité autoexcitatrices.", "<b>Évsey Domar.</b> La dette se stabilise si la croissance nominale dépasse le taux d'intérêt ; au-delà de 5 % de taux, la condition se durcit pour la France.", "<b>Mario Draghi (2012), « whatever it takes ».</b> La parole d'une banque centrale crédible a suffi à faire baisser les primes de risque.", "<b>Reinhart et Rogoff, « Cette fois, c'est différent ».</b> Les crises de dette reviennent par vagues, souvent après des chocs extérieurs."], "accroche": "« La France est arrivée et tout le monde s'est soudain mis à regarder les fondamentaux » : c'est ainsi qu'une gérante de BNY Investments résume, en novembre 2026, le retour de la France au rang des emprunteurs à risque.", "sujets": ["La zone euro est-elle à l'abri d'une nouvelle crise des dettes souveraines ?", "Les marchés financiers disciplinent-ils les États ?", "Faut-il une union budgétaire européenne ?"]}, {"eyebrow": "Logement", "title": "Espagne : quand la croissance ne loge plus les jeunes", "q": "L'Espagne affiche l'une des croissances les plus fortes de la zone euro, et pourtant ses syndicats lancent la première grève générale depuis 2012. Pourquoi le logement est-il devenu la question sociale centrale ?", "steps": [["Une offre insuffisante", "750 000 logements manquent.", "Selon la Banque d'Espagne, le déficit pourrait dépasser un million de logements d'ici 2028 : la construction ne suit pas la croissance démographique et urbaine."], ["Des loyers qui s'envolent", "Loyer moyen : 1 176 € par mois.", "Soit l'équivalent du salaire moyen d'un jeune (1 190 €). Le taux d'effort devient insoutenable pour les nouveaux entrants sur le marché."], ["Une fracture entre générations", "Propriétaires contre locataires.", "Ceux qui possèdent déjà voient leur patrimoine grimper ; les jeunes et les locataires subissent la hausse. Le logement devient un facteur d'inégalités de patrimoine."], ["Le conflit social", "Grève générale du 11 novembre.", "CCOO et UGT mobilisent sur « salaires, logement, prix ». La question est portée au cœur de la campagne des législatives du 29 novembre."]], "split": [["Encadrer les loyers", "Protège immédiatement les locataires, limite la captation de rente par les propriétaires, et répond à l'urgence sociale ; le logement est un bien essentiel, pas un actif comme les autres."], ["Construire davantage", "Le contrôle des loyers réduit l'offre locative à long terme et dégrade l'entretien du parc ; seule une hausse de l'offre (foncier, normes, logement social) fait baisser durablement les prix."]], "refs": ["<b>Thomas Piketty, « Le Capital au XXIe siècle ».</b> Le poids croissant du patrimoine immobilier dans les inégalités.", "<b>Assar Lindbeck.</b> Le contrôle des loyers serait, après les bombardements, le moyen le plus efficace de détruire une ville (formule célèbre, débattue).", "<b>Hirschman, « Exit, Voice and Loyalty ».</b> Faute de pouvoir partir, les locataires choisissent la prise de parole : la grève en est une forme."], "accroche": "En Espagne, un jeune salarié gagne en moyenne 1 190 € par mois, quand le loyer moyen atteint 1 176 € : toute sa paie pour un toit.", "sujets": ["Le logement est-il devenu le principal facteur d'inégalités ?", "Faut-il réguler le marché du logement ?", "La croissance suffit-elle à réduire les inégalités ?"]}, {"eyebrow": "Gouvernance", "title": "Nvidia : peut-on se passer d'un PDG fondateur ?", "q": "Le conseil d'administration de Nvidia envisagerait d'écarter Jensen Huang, cofondateur et visage du groupe. Comment arbitrer entre la discipline de gouvernance et le risque de perdre l'homme qui incarne l'entreprise ?", "steps": [["Le scandale", "Des révélations en cascade.", "Relation reconnue avec une espionne chinoise présumée, puis nouvelles révélations du New York Times sur une relation avec une cadre placée sous son autorité."], ["La sanction du marché", "Près de −10 % en une séance.", "L'action recule fortement : les investisseurs intègrent un risque de départ du dirigeant, passé de 40 % à près de 80 % sur Kalshi."], ["Le rôle du conseil", "Contrôler le dirigeant.", "Le conseil d'administration doit défendre l'intérêt des actionnaires : il préparerait un PDG par intérim et chercherait un successeur avec un cabinet extérieur."], ["Le risque « homme-clé »", "Aucun successeur préparé.", "La stratégie et le modèle de gouvernance du groupe sont étroitement associés à la personnalité de Huang : son départ crée une forte incertitude."]], "split": [["Oui, l'écarter", "La relation hiérarchique et les soupçons d'ingérence étrangère créent des risques juridiques et de réputation ; un conseil qui ne réagit pas perd sa crédibilité, et l'entreprise doit survivre à son fondateur."], ["Non, le garder", "La valeur de Nvidia repose en partie sur la vision et les relations de Huang ; un départ précipité, sans successeur, pourrait détruire davantage de valeur que le scandale lui-même."]], "refs": ["<b>Jensen et Meckling (1976).</b> La théorie de l'agence : comment les actionnaires contrôlent un dirigeant dont les intérêts peuvent diverger des leurs.", "<b>Berle et Means (1932).</b> La séparation de la propriété et du contrôle dans la grande entreprise moderne.", "<b>Joseph Schumpeter.</b> L'entrepreneur innovateur, moteur de la destruction créatrice, difficilement remplaçable."], "accroche": "En novembre 2026, le conseil d'administration de la première entreprise de puces d'IA au monde envisage de se séparer de son fondateur, sans successeur désigné.", "sujets": ["Qui gouverne l'entreprise ?", "Les actionnaires contrôlent-ils vraiment les dirigeants ?", "L'entrepreneur est-il encore indispensable à l'innovation ?"]}], "flash": [["1 500 Md$", "Anthropic", "Valorisation que les banques envisagent, au-dessus de la fourchette officielle (jusqu'à 1 400 Md$)."], ["86 Md$", "Record SpaceX", "Le plus gros montant levé lors d'une introduction en Bourse, qu'Anthropic pourrait dépasser."], ["−10,9 Md$", "OpenAI", "Perte d'exploitation au troisième trimestre, pour 10 Md$ de chiffre d'affaires."], ["5 %", "OAT 10 ans", "Seuil brièvement franchi par le taux français, une première depuis 2002."], ["4 %", "Inflation zone euro", "Son plus haut niveau depuis 2023, sous l'effet de l'énergie."], ["+0,4 %", "Prix aux États-Unis", "Hausse sur un mois en octobre ; +0,3 % hors énergie et alimentation."], ["1 176 €", "Loyer moyen en Espagne", "Pour un salaire moyen des jeunes de 1 190 € par mois."], ["92,6 Md€", "Impôt sur le revenu", "Recettes 2025 ; 48 % des foyers paient l'impôt."], ["13,7 Md€", "Digital Fairness Act", "Économies annuelles attendues pour les consommateurs européens."]], "quiz": [{"q": "Quel record l'introduction en Bourse d'Anthropic pourrait-elle battre ?", "o": ["Celui d'Aramco", "Celui de SpaceX, 86 Md$ levés", "Celui d'Alibaba", "Celui de Facebook"], "a": 1, "e": "Si les banques relèvent le prix, les fonds levés dépasseraient 100 Md$, devant les 86 Md$ de SpaceX (FT)."}, {"q": "De combien le taux à 10 ans français a-t-il augmenté depuis fin février ?", "o": ["0,8 point", "1,2 point", "1,6 point", "3 points"], "a": 2, "e": "1,6 point. La Belgique a pris 1,2 point et l'Espagne 0,8 point."}, {"q": "Pourquoi la dette française est-elle plus facile à attaquer que la dette belge ?", "o": ["Elle est notée AAA", "Elle est très abondante et liquide", "Elle est libellée en dollars", "La BCE n'en achète pas"], "a": 1, "e": "Un marché vaste et liquide permet de vendre à découvert facilement, donc de parier contre la dette."}, {"q": "Quel était le taux directeur de la Fed après sa réunion d'octobre ?", "o": ["2 à 2,25 %", "3,75 à 4 %", "5,25 à 5,5 %", "0 à 0,25 %"], "a": 1, "e": "3,75 à 4 %, maintenu par un vote de 10 voix contre 2 (CNBC). Une hausse est attendue en décembre."}, {"q": "Pourquoi le taux d'inflation américain sur un an n'a-t-il pas été publié ?", "o": ["Grève du Bureau des statistiques", "Changement de méthode", "Le shutdown de 2025 avait empêché la collecte d'octobre 2025", "Décision de la Fed"], "a": 2, "e": "Sans prix d'octobre 2025, impossible de calculer la variation sur douze mois."}, {"q": "Quel est le mot d'ordre de la grève générale espagnole ?", "o": ["« Retraites, santé, école »", "« Salaires, logement, prix »", "« Climat, énergie, emploi »", "« Europe, paix, travail »"], "a": 1, "e": "CCOO et UGT ont mobilisé sur les salaires, le logement et les prix."}, {"q": "Quelle part des foyers fiscaux français paie l'impôt sur le revenu ?", "o": ["Environ 25 %", "Environ 48 %", "Environ 65 %", "Environ 90 %"], "a": 1, "e": "20,1 millions sur 42,1 millions de foyers déclarants, soit environ 48 %."}, {"q": "Quelle théorie éclaire le mieux le rôle du conseil d'administration de Nvidia face à son PDG ?", "o": ["La théorie quantitative de la monnaie", "La théorie de l'agence", "La loi de Say", "La théorie des avantages comparatifs"], "a": 1, "e": "Jensen et Meckling : les actionnaires (mandants) doivent contrôler le dirigeant (mandataire)."}], "colle": {"title": "La zone euro est-elle à l'abri d'une nouvelle crise des dettes souveraines ?", "parts": [["Depuis 2012, la zone euro s'est dotée de protections", ["« Whatever it takes » (Draghi), MES et outils de la BCE : la crise de liquidité autoexcitatrice (De Grauwe) est mieux maîtrisée", "Les anciens « maillons faibles », comme l'Espagne, ont redressé croissance et finances publiques"]], ["Mais de nouvelles fragilités apparaissent", ["Choc énergétique, inflation à 4 % et hausse des taux : la France prend 1,6 point et frôle 5 %", "Dette proche de 120 % du PIB, déficit supér  Anthropic : actions offertes, Nasdaq « ANT », chiffre d'affaires annualisé, investisseurs stratégiques"], ["Decrypt", "web, 10 nov.", "Fourchette de prix de 70 à 78 $ et valorisation jusqu'à 1 400 Md$"], ["CNBC", "web, 10 nov.", "Détail de l'inflation américaine d'octobre et positions des membres de la Fed"], ["Al Jazeera", "web, 10 nov.", "Grève espagnole : syndicats, loyers, déficit de logements, date des élections"], ["Eurostat", "web, 12 nov.", "Dette publique en % du PIB fin 2025 : France 115,7 %, Belgique 108,1 %"], ["LCP", "web, 4 nov.", "Rejet de la partie recettes du budget 2027 à l'Assemblée"], ["Khaleej Times", "web, 9 nov.", "Enquête du conseil d'administration de Nvidia sur Jensen Huang"]], "ia": {"toc": "Claude se porte lui-même sur une nouvelle puce, Meta ouvre son design system pour agents, et un hook qui sonne quand Claude a fini.", "intro": "Chaque jour, ce qui bouge dans l'IA et ce que tu peux en faire avec ton abonnement Claude. Aujourd'hui : l'IA qui accélère sa propre fabrication, et ta première automatisation de Claude Code.", "signalTitle": "L'IA qui accélère sa propre fabrication", "signal": [{"eyebrow": "Anthropic · 11 novembre", "title": "Claude a porté Claude sur une nouvelle puce en trois jours", "text": ["Dans la vidéo de présentation de son introduction en Bourse, Anthropic explique entraîner et faire tourner Claude sur quatre familles de puces : Trainium (Amazon), TPU (Google), et les processeurs graphiques de Nvidia et d'AMD.", "Jusqu'ici, ajouter une nouvelle plateforme demandait « des dizaines d'ingénieurs » pendant des mois. Selon Anthropic, cette fois, Mythos a fait tourner Claude sur les puces AMD en trois jours, presque sans intervention humaine, en écrivant ou en adaptant la quasi-totalité des kernels, ces petits programmes de calcul optimisés pour une puce."], "why": "Pour toi : c'est l'argument central de l'entreprise auprès des investisseurs, l'IA qui accélère la fabrication de l'IA. Garde l'esprit critique : ce sont des affirmations d'Anthropic dans un document destiné à vendre ses actions, résumées par Simon Willison.", "sources": ["Simon Willison (web)"], "url": "https://simonwillison.net/2026/Nov/11/anthropic-ipo-roadshow/"}, {"img": "img/2026-11-12/ia_astryx.jpg", "alt": "Visuel d'Astryx : le logo bleu entouré d'exemples de composants d'interface (réglages, panier, inventaire)", "credit": "Meta, via GitHub", "eyebrow": "Meta · open source", "title": "Meta ouvre le design system de 13 000 applications, pensé pour les agents", "text": ["Astryx est la bibliothèque d'interface utilisée en interne chez Meta depuis huit ans : plus de 150 composants accessibles, des thèmes, un mode sombre, des modèles prêts à l'emploi et un outil en ligne de commande. Elle est publiée sous licence MIT, en version bêta.", "Sa particularité : la documentation et les outils sont conçus pour qu'une personne et un assistant IA construisent de la même façon. C'est le dépôt qui a gagné le plus d'étoiles sur GitHub ce jour-là : +2 776, pour plus de 26 000 au total."], "why": "Pour toi : quand tu demandes une interface à Claude, il réinvente le style à chaque fois. Un design system documenté pour les agents lui donne des briques prêtes et cohérentes. Demande React 19 ; à réserver à un vrai projet web.", "sources": ["GitHub (web)"], "url": "https://github.com/meta/astryx"}, {"eyebrow": "Google · 11 novembre", "title": "Un modèle qui ne fait que répondre oui ou non", "text": ["Google lance Gemini Decision 1, un « modèle de décision » accessible par API. Il répond à des questions fermées : oui ou non, choix entre options, notation selon une grille. Il lit du texte, des images, du son, de la vidéo et des PDF.", "Pour un oui ou non, il renvoie une probabilité entre 0 et 1. Selon Simon Willison, le prix est de 10 cents par million de jetons en entrée, et la réponse est gratuite."], "why": "Pour toi : l'idée est utile même sans ce modèle. Demander à Claude une réponse fermée (« oui/non », « note sur 5 ») rend son résultat facile à trier ou à compter, par exemple pour classer 200 articles selon qu'ils parlent de politique monétaire ou non.", "sources": ["Simon Willison (web)"], "url": "https://simonwillison.net/2026/Nov/11/gemini-decisions-api/"}], "claude": [{"k": "Sécurité", "t": "Mets Claude Code à jour", "d": "La version 2.1.321 corrige une faille : un serveur MCP qui redirigeait une connexion pouvait recevoir tes jetons d'accès. Elle corrige aussi une commande en lecture seule qui pouvait s'exécuter hors du bac à sable sans te demander.", "cmd": "claude update"}, {"k": "Permissions", "t": "Les interdits s'appliquent aussi aux copies", "d": "Depuis la 2.1.321, une règle qui interdit d'écrire dans un fichier s'applique aussi quand Claude utilise cp ou mv vers un dossier. Tes protections deviennent plus fiables."}, {"k": "Contrôle à distance", "t": "Des réglages dédiés au pilotage depuis ton téléphone", "d": "La commande remote-control accepte maintenant un fichier de réglages appliqué à chaque session qu'elle lance : pratique pour être plus prudent quand tu pilotes Claude à distance.", "cmd": "claude remote-control --settings <fichier>"}], "augmente": [{"gap": "Piloter ta maison connectée", "tool": "homeassistant-ai/ha-mcp", "url": "https://github.com/homeassistant-ai/ha-mcp", "meta": "7,7 k étoiles · serveur MCP · licence MIT", "d": "Ce serveur MCP relie Claude à Home Assistant, le logiciel libre de domotique : Claude peut lire l'état des appareils, créer des automatisations ou modifier des scènes en langage naturel.", "why": "C'est l'angle « objets connectés » : Claude ne sait pas allumer une lampe, mais il sait parler à un logiciel qui le fait. Il faut déjà avoir une installation Home Assistant ; lis le script avant de le lancer.", "cmd": "curl -LsSf https://raw.githubusercontent.com/homeassistant-ai/ha-mcp/master/scripts/install.sh | sh -s -- --claude-code", "cmdLabel": "Terminal"}, {"gap": "Prendre du recul sur tout un projet", "tool": "shadcn/improve", "url": "https://github.com/shadcn/improve", "meta": "11,4 k étoiles · skill · licence MIT", "d": "Un skill de shadcn qui audite un projet entier et écrit des plans de travail détaillés dans un dossier plans/, sans rien modifier lui-même. Un modèle moins cher peut ensuite exécuter chaque plan.", "why": "La logique est bonne à retenir : le modèle le plus capable réfléchit et planifie, un modèle plus rapide exécute. Tu économises ton quota en gardant la qualité. Commence par /improve quick.", "cmd": "npx skills add shadcn/improve", "cmdLabel": "Terminal"}], "repos": [{"name": "meta/astryx", "stars": "26,2 k", "week": "+2 776 en un jour", "lang": "TypeScript", "what": "Le design system interne de Meta, ouvert à tous : 150 composants d'interface accessibles, des thèmes et un outil en ligne de commande pensé pour les agents.", "why": "Ce qu'il montre : une bibliothèque documentée pour les IA autant que pour les humains. À essayer pour donner un rendu professionnel à une appli que Claude t'écrit.", "cmd": "npm install @astryxdesign/core @astryxdesign/theme-neutral @stylexjs/stylex"}, {"name": "ZhuLinsen/daily_stock_analysis", "stars": "71 k", "week": "+278 en un jour", "lang": "Python", "what": "Un système d'analyse boursière qui combine données de marché, actualités et un modèle de langage, avec un tableau de bord et des envois automatiques programmés.", "why": "Ce qu'il apprend : comment un particulier assemble données, IA et tâche planifiée en un outil personnel. À regarder comme exemple d'architecture, pas comme conseil d'investissement.", "cmd": "git clone https://github.com/ZhuLinsen/daily_stock_analysis.git && cd daily_stock_analysis"}, {"name": "addyosmani/agent-skills", "stars": "116,5 k", "week": "+787 en un jour", "lang": "JavaScript", "what": "25 skills d'ingénierie logicielle par Addy Osmani (Google) : revue de code, tests, et « interview-me », qui t'interroge question par question pour clarifier ce que tu veux vraiment construire.", "why": "Ce qu'il apprend : de bons exemples de SKILL.md à lire pour écrire les tiens. Commence par interview-me avant ton prochain projet.", "cmd": "npx skills add addyosmani/agent-skills --skill interview-me"}], "labo": {"meta": "15 minutes · débutant · Claude Code", "title": "Ton premier hook : un son quand Claude a fini", "goal": "Un hook est une commande que Claude Code lance automatiquement à un moment précis. Tu vas en créer un qui joue un son quand Claude termine sa réponse : tu peux faire autre chose pendant qu'il travaille. C'est la porte d'entrée des automatisations.", "steps": [{"t": "Choisis ton son", "d": "macOS contient des sons système. Teste-les dans le Terminal (remplace Glass par Hero, Ping ou Submarine).", "cmd": "afplay /System/Library/Sounds/Glass.aiff"}, {"t": "Demande à Claude d'ajouter le hook", "d": "Les hooks se rangent dans ~/.claude/settings.json, sous la forme {\"hooks\": {\"Stop\": [{\"hooks\": [{\"type\": \"command\", \"command\": \"...\"}]}]}}. Plutôt que d'écraser le fichier, laisse Claude le compléter : colle ce message dans Claude Code.", "cmd": "Ajoute à mes réglages utilisateur (~/.claude/settings.json) un hook sur l'événement Stop qui lance la commande afplay /System/Library/Sounds/Glass.aiff. Garde tous mes réglages existants et montre-moi le fichier avant d'enregistrer."}, {"t": "Vérifie qu'il est actif", "d": "Cette commande liste les hooks configurés. Pose ensuite une question à Claude : le son retentit à la fin de sa réponse.", "cmd": "/hooks"}, {"t": "Va plus loin : une notification", "d": "L'événement Notification se déclenche quand Claude attend ton accord. Demande à Claude d'y brancher cette commande, qui affiche une bulle macOS.", "cmd": "osascript -e 'display notification \"Claude attend ta réponse\" with title \"Claude Code\"'"}]}, "build": {"k": "Inspiré de ZhuLinsen/daily_stock_analysis", "title": "Ton tableau de bord de la dette européenne", "d": "Le dépôt du jour assemble données et IA en un outil personnel pour suivre la Bourse. En voici une version gratuite et utile pour l'ESH : une page qui interroge l'API publique d'Eurostat et trace la dette publique des pays de la zone euro, pour illustrer le dossier du jour.", "prompt": "Crée un fichier dette.html autonome (HTML, CSS et JavaScript, sans dépendance externe). Au chargement, il interroge l'API publique d'Eurostat, sans clé : https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/gov_10dd_edpt1?unit=PC_GDP&na_item=GD&sector=S13&sinceTimePeriod=2007&geo=FR&geo=BE&geo=IT&geo=ES&geo=DE&geo=IE&geo=EL (format JSON-stat : lis les dimensions geo et time pour retrouver chaque valeur). Trace un graphique en courbes en SVG dessiné à la main : dette publique en % du PIB, une couleur par pays, avec légende cliquable pour masquer un pays. Ajoute un second onglet avec le solde public (na_item=B9 au lieu de GD). Sous le graphique, affiche un tableau des dernières valeurs triées. Style sobre, lisible sur téléphone. Gère proprement les erreurs réseau. Ensuite, ouvre le fichier dans mon navigateur.", "note": "L'API d'Eurostat autorise les appels depuis une page locale. Prochaine étape : ajouter les taux à 10 ans (jeu de données irt_lt_mcby_m) pour comparer dette et coût de financement, comme dans le dossier sur la France et la Belgique."}, "briefs": [["Anthropic en Bourse", "Cotation sur le Nasdaq attendue la semaine prochaine sous le symbole « ANT » ; les banques envisagent de relever la valorisation à 1 500 Md$ ou plus (FT)."], ["OpenAI", "10 Md$ de chiffre d'affaires et 10,9 Md$ de perte d'exploitation au troisième trimestre. OpenAI lance aussi en bêta un Business Hub pour que les commerçants gèrent leur présence dans ChatGPT."], ["Jeux faits par IA", "Sur Roblox, plus de 500 000 personnes ont utilisé l'outil Build, qui crée un jeu à partir d'une description, et publié plus de 70 000 jeux ; deux d'entre eux ont atteint le top 20 (TNBS)."], ["Faille corrigée", "Simon Willison publie llm 0.37.2 : deux failles pouvaient envoyer une clé d'API OpenAI à d'autres fournisseurs. Rappel utile : mets à jour tes outils qui manipulent des clés."], ["244 outils", "Simon Willison a classé par étiquettes les 244 petits outils web qu'il a codés avec l'IA : une belle source d'idées de projets d'une page."]], "glossaire": [["Kernel", "Un petit programme de calcul très optimisé pour une puce donnée (une multiplication de matrices, par exemple). Changer de puce oblige à réécrire ces kernels."], ["Design system", "Une bibliothèque de composants d'interface (boutons, menus, tableaux) avec des règles de style communes, pour que toutes les pages d'une application se ressemblent."], ["Multiplicateur de calcul", "Une amélioration de méthode qui permet d'obtenir le même modèle avec moins de calcul. Un multiplicateur de 4 signifie 25 unités au lieu de 100."], ["Modèle de décision", "Un modèle spécialisé dans les réponses fermées (oui/non, choix, note), qui renvoie une probabilité plutôt qu'un texte. Rapide et peu coûteux pour trier en masse."], ["Événement Stop", "Le moment où Claude termine sa réponse. Un hook branché sur Stop se déclenche à ce moment-là, à chaque fois."]], "sources": [["Simon Willison", "web, 10-11 nov.", "Vidéo de l'IPO d'Anthropic, Gemini Decision 1, llm 0.37.2, outils étiquetés"], ["GitHub Trending", "web, 12 nov.", "Dépôts du jour et étoiles gagnées"], ["Changelog Claude Code", "web, 10 nov.", "Versions 2.1.321 et 2.1.322"], ["meta/astryx (README)", "web, 12 nov.", "Description, licence, installation"], ["shadcn/improve (README)", "web, 12 nov.", "Fonctionnement et commande d'installation"], ["homeassistant-ai/ha-mcp (README)", "web, 12 nov.", "Installation pour Claude Code"], ["addyosmani/agent-skills (README)", "web, 12 nov.", "Liste des skills et installation"], ["Eurostat", "web, 12 nov.", "API publique utilisée dans « Construis-le »"]]}};
const INDEX = [{"date": "2026-11-12", "title": "Anthropic : l'introduction en Bourse « trop importante pour échouer »"}, {"date": "2026-11-11", "title": "Affaire Huang : procès, puces passées en Chine et liste noire repoussée"}, {"date": "2026-11-10", "title": "Smic : le premier coup de pouce depuis 14 ans"}, {"date": "2026-11-09", "title": "Mélenchon chiffre son programme, la calculatrice tousse"}, {"date": "2026-11-08", "title": "Après la défaite, l'Amérique en retrait ?"}, {"date": "2026-11-07", "title": "La vague bleue fait tanguer Wall Street"}];
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  /* Chiffres signés en rouge/vert (−6,4 %, +165 000…) */
  const SIGNED=/(^|[\s(«])([+−])\s?\d[\d   ,.]*(\s?(%|Md\$|\$|€|k|points?))?/g;
  const tint=html=>html.replace(SIGNED,(m,pre,sign)=>pre+`<span class="${sign==='+'?'up':'down'}">${m.slice(pre.length)}</span>`);
  const T=s=>tint(esc(s));
  /* Coupe un titre en lignes décalées (gauche / droite / retrait) */
  const stair=(txt,n)=>{const w=String(txt).split(' ');n=Math.min(n||3,w.length);const per=Math.ceil(w.length/n),out=[];for(let i=0;i<w.length;i+=per)out.push(w.slice(i,i+per).join(' '));return out.map(l=>`<span>${esc(l)}</span>`).join('');};
  const cache={}; if(LATEST) cache[LATEST.date]=LATEST;
  let D=LATEST;

  const tabs=[...document.querySelectorAll('.tab')], views=[...document.querySelectorAll('.view')];
  /* position naturelle de la barre d'onglets (offsetTop d'un élément sticky suit le défilement) */
  const tabsTop=()=>$('main').offsetTop-$('nav.tabs').offsetHeight;
  function show(id){views.forEach(v=>v.hidden=v.id!==id);tabs.forEach(t=>t.setAttribute('aria-selected',t.getAttribute('aria-controls')===id));}
  tabs.forEach(t=>t.addEventListener('click',()=>{show(t.getAttribute('aria-controls'));window.scrollTo({top:tabsTop()});}));

  const fmtShort=iso=>{const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};
  const dayName=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long'});
  const issueNo=iso=>{const i=[...INDEX].reverse().findIndex(x=>x.date===iso);return i<0?'—':String(i+1).padStart(3,'0');};
  const blk=(k,body,cls='')=>`<div class="g blk ${cls}">${/\bop\b/.test(cls)?fx('fall'):''}<span class="k">${k}</span><div class="body">${body}</div></div>`;
  const ix=i=>String(i+1).padStart(2,'0');
  const fx=g=>`<canvas class="fx" data-g="${g}" aria-hidden="true"></canvas>`;
  const SPK='<svg class="spk" aria-hidden="true"><rect width="100%" height="100%" filter="url(#speck)"/></svg>';
  const ph=(src,alt,lazy)=>`<div class="ph"><img src="${src}" alt="${esc(alt||'')}"${lazy?' loading="lazy"':''}><canvas class="xr" aria-hidden="true"></canvas>`;

  /* ---------- Couverture : sommaire façon Kolt ---------- */
  function renderCover(){
    $('#specNo').textContent='Nr. '+issueNo(D.date);
    $('#specDate').textContent=dayName(D.date)+' '+fmtShort(D.date);
    const items=D.brief.map(([k,t],i)=>`<a href="#th${Math.min(i,D.themes.length-1)}" data-th="${Math.min(i,D.themes.length-1)}"><span class="mono ix">( ${ix(i)} )</span><span class="k">${esc(k)}</span><span class="t">${T(t)}</span></a>`);
    if(D.ia&&D.ia.toc) items.push(`<a href="#" data-tab="ia"><span class="mono ix">( ${ix(items.length)} )</span><span class="k">Labo IA</span><span class="t">${T(D.ia.toc)}</span></a>`);

  function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);
  }

  function calcHTML(){return `
    <div class="calc">
      <div class="l">
        <span class="k">Maths appliquées · Actualisation</span>
        <h3>Pourquoi les taux font plus mal aux valeurs de l'IA</h3>
        <div class="formula">V = Σ (t = 1…30) CF<sub>t</sub> / (1 + r)<sup>t</sup></div>
        <p class="note">Deux entreprises gagnent la même somme sur 30 ans. L'entreprise <b>mature</b> touche 10 par an dès maintenant. L'entreprise <b>IA</b> gagne peu au début puis beaucoup plus tard (croissance de 25 % par an pendant 15 ans).</p>
      </div>
      <div class="r">
        <div class="slider"><label for="rate"><span class="k">Taux d'actualisation r</span><span class="rv" id="rateV">3,0 %</span></label><input type="range" id="rate" min="1" max="9" step="0.25" value="3"></div>
        <div class="bars">
          <div class="barrow"><span class="k">Mature</span><div class="track"><div class="fill" id="barA"></div></div><span class="num" id="valA">100</span></div>
          <div class="barrow"><span class="k">IA</span><div class="track"><div class="fill ia" id="barB"></div></div><span class="num" id="valB">100</span></div>
        </div>
        <p class="note" id="calcMsg"></p>
      </div>
    </div>`;}
  function initCalc(){
    const A=Array.from({length:30},()=>10), raw=Array.from({length:30},(_,i)=>Math.pow(1.25,Math.min(i,15)));
    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);
    const f1=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
    const rate=$('#rate');
    const upd=()=>{const r=parseFloat(rate.value)/100,a=pv(A,r)/bA*100,b=pv(B,r)/bB*100,mx=Math.max(a,b,100);
      $('#rateV').textContent=f1(r*100)+' %';$('#valA').textContent=Math.round(a);$('#valB').textContent=Math.round(b);
      $('#barA').style.width=(a/mx*100)+'%';$('#barB').style.width=(b/mx*100)+'%';
      const a1=pv(A,r+.01)/pv(A,r)-1,b1=pv(B,r+.01)/pv(B,r)-1;
      $('#calcMsg').innerHTML=`Base 100 à r = 3 %. À ${f1(r*100)} %, un point de taux en plus fait perdre <b class="down">${f1(-a1*100)} %</b> à l'entreprise mature et <b class="down">${f1(-b1*100)} %</b> à l'entreprise IA. Plus les profits sont lointains, plus la valeur est sensible au taux : c'est la duration.`;};
    rate.addEventListener('input',upd);upd();
  }

        if(!l.tex){
          try{l.tex=texture(img);l.st=l.st||stats(img);}
          catch(e){l.broken=true;l.el.style.display='none';l.ph.classList.add('raw');return false;}
        }
        const dt=l.tl?Math.min(.1,(now-l.tl)/1000):0;
        if(l.rev!==l.target){
          const s=still.matches?1:dt/1.5;
          l.rev=l.target>l.rev?Math.min(l.target,l.rev+s):Math.max(l.target,l.rev-s);
        }
        l.tl=l.rev===l.target?0:now;
        const e=l.rev*l.rev*(3-2*l.rev);
        return paint(l,'photo',time,pr=>{
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uRev',e);set(pr,'uDark',col.dark);set(pr,'uLight',col.light);
        });
      }
    };
    function frame(now){
      raf=0;
      if(!ok) return;
      const move=!still.matches, time=move?(now-t0)/1000:(t0%1e5)/1000;
      let again=false;
      layers.forEach(l=>{
        if(!l.seen) return;
        const live=l.kind==='photo'?l.rev!==l.target:move;
        const fluid=l.wakeUntil>now;     /* pendant le geste : chaque image, pour un mouvement fluide */
        if(l.dirty||fluid||(live&&(l.kind==='photo'||now-l.last>=FPS))){
          if(R[l.kind](l,time,now)!==false)l.dirty=false;
          l.last=now;
        }
        if(fluid||(l.kind==='photo'?l.rev!==l.target:move)) again=true;
      });
      if(again&&!document.hidden) raf=requestAnimationFrame(frame);
    }
    function kick(){if(!raf&&ok)raf=requestAnimationFrame(frame);}
    const io=new IntersectionObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l){l.seen=e.isIntersecting;if(l.seen)l.dirty=true;}});kick();},{rootMargin:'200px 0px'});
    const ro=new ResizeObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l)l.dirty=true;});kick();});
    const add=(el,kind,o)=>{layers.set(el,Object.assign({el,kind,seen:false,dirty:true,last:0,ctx:null},o));io.observe(el);ro.observe(el);};
    const TYPE={fall:0,band:1,rise:2};
    /* (re)branche les couches après chaque rendu ; celles retirées du DOM sont libérées */
    function scan(){
      layers.forEach((l,el)=>{
        if(el.isConnected) return;
        io.unobserve(el);ro.unobserve(el);
        [l.tex,l.atex,l.dtex].forEach(x=>x&&gl.deleteTexture(x));
        layers.delete(el);
      });
      document.querySelectorAll('canvas.fx').forEach((el,i)=>{if(!layers.has(el))add(el,'bands',{type:TYPE[el.dataset.g]||0,seed:((i+1)*.6180339)%1});});
      document.querySelectorAll('canvas.mastfx').forEach(el=>{if(!layers.has(el))add(el,'mast',{});});
      document.querySelectorAll('canvas.ascfx').forEach(el=>{
        if(layers.has(el)) return;
        const img=new Image();img.src=el.dataset.src;
        add(el,'ascii',{img});
        img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      document.querySelectorAll('.ph').forEach((ph,i)=>{
        const el=ph.querySelector('canvas.xr'), img=ph.querySelector('img');
        if(!el||layers.has(el)) return;
        add(el,'photo',{img,ph,rev:0,target:0,tl:0,seed:((i+3)*.7548777)%1});
        if(!img.complete) img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      kick();
    }
    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
