<meta charset="utf-8">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Revue de presse quotidienne : économie, géopolitique et IA, chaque matin vers 6 h 40.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-title" content="OFFSET">

<meta property="og:site_name" content="OFFSET">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="OFFSET — Revue du matin">
<meta property="og:description" content="Vendredi 20 novembre 2026 — Anthropic bondit de 17 % pour son premier jour en Bourse">
<meta property="og:image" content="https://2c8g47nkkt-jpg.github.io/offset/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.colo .top .sig{grid-column:1/4;grid-row:2;align-self:end;display:block;width:clamp(120px,11vw,190px);aspect-ratio:3368/1451;height:auto;color:var(--ink);overflow:visible}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc,.colo .top .sig{grid-row:auto}.colo .top .sig{grid-column:1/-1;width:132px}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}
.fc.flip{background:var(--riso);color:#000;padding:18px 18px}
.fc.flip .v{display:none} .fc.flip .b{display:block}
.score{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:72px}
.score .sc{font-size:clamp(64px,6vw,120px);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible{outline:2px solid var(--ink)}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:96px var(--col)}
@media (max-width:800px){.quiz{grid-template-columns:1fr}}
.qcard{display:flex;flex-direction:column;gap:18px;min-width:0}
.qq{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;font-size:16.5px}
.opt .kk{font-weight:800;color:var(--faint)}
.opt:hover:not([aria-disabled="true"]) span:last-child{text-decoration:underline;text-underline-offset:4px}
.opt:focus-visible{outline:2px solid var(--ink)}
.opt.ok,.opt.ok .kk{color:var(--up);font-weight:700}
.opt.ko{color:var(--down);text-decoration:line-through;text-decoration-thickness:1px}
.opt[aria-disabled="true"]{cursor:default}
.expl{color:var(--muted);font-size:15.5px}
.plan{display:flex;flex-direction:column;gap:clamp(48px,5vw,88px)}
.plan ol{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.plan ol{grid-template-columns:1fr}}
.plan > ol > li{counter-increment:p;display:flex;flex-direction:column;gap:12px}
.plan > ol > li::before{content:counter(p,upper-roman);font-size:clamp(48px,4vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.plan li b{font-weight:800;font-size:19px;line-height:1.3;letter-spacing:-.015em}
.plan ol ol{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.plan ol ol li{color:var(--muted);font-size:15.5px;display:grid;grid-template-columns:22px minmax(0,1fr);counter-increment:s}
.plan ol ol li::before{content:counter(s,upper-alpha);font-weight:800;color:var(--faint)}

/* Archives */
.arch{display:flex;flex-direction:column;gap:6px}
.arow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--col);padding:14px 0;align-items:baseline}
.arow:focus-visible{outline:2px solid var(--ink)}
.arow .t{font-size:clamp(24px,2.6vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1}
.arow:hover .t{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.arow:not(.cur) .t{color:var(--muted)}
@media (max-width:700px){.arow{grid-template-columns:1fr;row-gap:6px}}

/* Sources */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 8px;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0;font-weight:700}
thead th{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--faint);vertical-align:bottom;padding-bottom:20px}
.d1{display:inline-block;width:10px;height:10px;background:var(--ink)}
.cnt{font-size:24px;font-weight:800;letter-spacing:-.04em}
.srclist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px var(--col)}

@media (max-width:560px){.srclist{grid-template-columns:1fr}}
.srclist div{display:flex;flex-direction:column;gap:2px}
footer{font-size:12.5px;color:var(--faint);max-width:70ch}

const LATEST = {"date": "2026-11-20", "label": "Vendredi 20 novembre 2026", "period": "19 au 20 novembre", "sourcesCount": 7, "countLabel": "7 newsletters + 9 sources web", "hero": {"img": "img/2026-11-20/anthropic_nasdaq.jpg", "alt": "Une vingtaine de personnes applaudissent derrière le pupitre du Nasdaq, sous un grand logo Anthropic", "credit": "Charly Triballeau / AFP via Aktionnaire", "eyebrow": "À la une", "title": "Anthropic bondit de 17 % pour son premier jour en Bourse", "lede": "Introduite à 83 $, l'action du créateur de Claude a ouvert jeudi à 111,50 $ (+34 %), avant de refluer pour clôturer à 97,17 $, en hausse de 17,1 % (Investing.com). Avec le placement privé de 26 Md$, l'opération atteint 107,3 Md$, un record. La société vaut environ 1 270 Md$ en capitalisation boursière, près de 1 760 Md$ en comptant toutes les actions et options. Mais le Nasdaq a reculé de plus de 2 %, à son plus bas depuis sept mois : l'euphorie d'Anthropic n'a pas suffi à rassurer un marché qui doute de l'IA."}, "brief": [["Anthropic", "Clôture à 97,17 $, +17 % sur le prix d'introduction mais −12,9 % par rapport à l'ouverture."], ["Shenzhen", "Trump, Xi et Putin promettent plus de produits pétroliers et des discussions sur le risque nucléaire."], ["Emploi", "Selon Coface, l'IA freine déjà les embauches de cols blancs : 100 000 offres manquantes en France en 2026."], ["Cybersécurité", "Lecornu juge la menace « particulièrement grave et inédite » ; les ministères devront y consacrer 5 % de leur budget numérique dès 2027."], ["Présidentielle", "Édouard Philippe veut ne remplacer qu'un fonctionnaire sur trois partant à la retraite, soit 250 000 postes en cinq ans."]], "figures": [{"v": "+17,1 %", "l": "hausse de l'action Anthropic à la clôture de son premier jour (Investing.com)", "dir": "up"}, {"v": "−2 %", "l": "recul du Nasdaq jeudi, à son plus bas depuis sept mois (Investing.com)", "dir": "down"}, {"v": "100 000", "l": "offres d'emploi qualifiées manquantes en France en 2026 à cause de l'IA, selon Coface (Cosmos Finance)", "dir": "down"}, {"v": "207 M€", "l": "dégâts assurés des émeutes des 17 et 18 octobre, selon France Assureurs (Cosmos Finance)", "dir": "up"}], "themes": [{"title": "Anthropic en Bourse : l'euphorie, puis les questions", "stories": [{"eyebrow": "Marchés", "title": "Une ouverture à 111,50 $, une clôture à 97,17 $", "text": ["Dès l'ouverture, l'action a gagné 34 % et a brièvement valorisé Anthropic à plus de 2 000 Md$. Elle a ensuite reculé de 12,9 % depuis ce sommet pour finir à 97,17 $ ; après la clôture, elle perdait encore 6,3 %, à 91,05 $ (Investing.com). Plus de 857 millions d'actions ont changé de mains.", "La valorisation dépend du calcul : environ 1 270 Md$ en capitalisation boursière classique (Forbes, Aktionnaire), près de 1 760 Md$ en incluant actions restreintes et options. Selon Aktionnaire, la fortune cumulée des sept cofondateurs atteint 140 Md$ et 400 salariés deviennent « centimillionnaires »."], "why": "Le premier jour d'une introduction mesure surtout l'écart entre l'offre de titres et la demande. Le prix fixé à 83 $ laissait une marge aux acheteurs : les banques préfèrent un léger « rabais » qui garantit une hausse initiale. La retombée en séance montre que l'enthousiasme a des limites dans un marché nerveux.", "rep": 4, "sources": ["Aktionnaire", "Cosmos Finance", "Money Stack", "myFT Daily Digest", "Investing.com (web)", "Forbes (web)"], "more": ["<b>Les analystes.</b> Melius Research vise 155 $ et Needham 150 $, ce dernier anticipant plus de 150 % de croissance du chiffre d'affaires en 2027 (Investing.com).", "<b>Le montant.</b> 81,3 Md$ levés en Bourse, plus 26 Md$ de placement privé au même prix : 107,3 Md$ au total, loin devant SpaceX en juin (Cosmos Finance).", "<b>Washington.</b> Quatre sénateurs des deux partis ont déposé un texte imposant aux sociétés cotées de mieux informer sur leur usage de l'IA (Semafor, via The Neuron)."], "prog": "Marché primaire, formation des prix, asymétries d'information"}, {"eyebrow": "Valorisation", "title": "602 Md$ de chiffre d'affaires pour justifier le prix", "text": ["Anthropic s'est engagée à dépenser environ 1 000 Md$ dans les prochaines années, dont 700 Md$ d'ici cinq ans, surtout en puissance de calcul (Aktionnaire). Selon un calcul du FT cité par Aktionnaire, il lui faudrait 602 Md$ de chiffre d'affaires annuel, trois fois celui de Meta, pour obtenir un rendement du capital investi de 20 %, la norme des géants de la tech.", "Pour l'instant : 17 Md$ de chiffre d'affaires au troisième trimestre, +1 127 % sur un an. Mais les dépenses d'infrastructure ont bondi de 77 % en un trimestre, contre 47 % pour les revenus (Money Stack)."], "why": "Money Stack pointe une circularité : Google et Nvidia injectent chacun 10 Md$ en parallèle de l'introduction, alors qu'ils vendent puces et cloud à Anthropic. Une partie de l'argent levé revient donc chez les actionnaires sous forme de commandes. Pour gagner des parts de marché, Anthropic casse aussi ses prix, jusqu'à −40 % pour le gouvernement américain (Aktionnaire).", "rep": 3, "sources": ["Aktionnaire", "Money Stack", "myFT Daily Digest"], "more": ["<b>Le contrôle.</b> Les sept cofondateurs gardent 50,1 % des droits de vote : les nouveaux actionnaires « paient cher pour avoir peu à dire », résume Money Stack.", "<b>La suite.</b> La prochaine grande introduction pourrait être celle d'OpenAI, qui vise une cotation en 2027."], "prog": "Rentabilité du capital, actualisation, gouvernance d'entreprise"}, {"eyebrow": "Bourses", "title": "Wall Street recule, Paris tient bon", "text": ["Jeudi, le Nasdaq a perdu plus de 2 % et Nvidia 3,3 % (Investing.com, Aktionnaire). Selon le Wall Street Journal cité par Money Stack, Nvidia a perdu plus de 1 000 Md$ de capitalisation depuis six mois. Un rapport accuse par ailleurs AMD d'entretenir des liens avec des sociétés chinoises sur liste noire (Aktionnaire).", "À l'inverse, le CAC 40 a enchaîné cinq hausses, +2,82 % sur la semaine. Money Stack y voit un paradoxe : Paris doit sa solidité à son manque de valeurs technologiques."], "why": "Goldman Sachs prévoit pourtant pour 2027 +16 % pour le S&P 500 et +13 % pour le Stoxx Europe 600, dividendes compris, malgré un net ralentissement des bénéfices : de 36 % à 11 % de croissance aux États-Unis, de 18 % à 7 % en Europe (Cosmos Finance). La composition sectorielle d'un indice pèse autant que la santé de l'économie nationale.", "rep": 3, "sources": ["Aktionnaire", "Money Stack", "Cosmos Finance", "Investing.com (web)"], "prog": "Marchés financiers, diversification, cycles boursiers"}]}, {"title": "Puissances : Shenzhen et la bataille des puces", "stories": [{"img": "img/2026-11-20/trio_shenzhen.jpg", "alt": "Vladimir Putin, Xi Jinping et Donald Trump debout côte à côte devant les drapeaux chinois et américain", "credit": "V. Prokofyev / AFP via Aktionnaire", "eyebrow": "Sommet à trois", "title": "Plus de pétrole et des pourparlers nucléaires", "text": ["À l'issue de leur premier sommet à trois, Donald Trump, Xi Jinping et Vladimir Putin ont publié une « déclaration vers la paix ». Ils prévoient d'« augmenter la production et l'offre de produits pétroliers raffinés » et réaffirment qu'une guerre nucléaire ne peut être gagnée (Fox News).", "Ils s'engagent aussi à discuter de la réduction des risques nucléaires et de la prolifération, sans évoquer de traité de désarmement. Le cours du pétrole n'a pas bougé (Aktionnaire)."], "why": "La promesse pétrolière laisse les marchés sceptiques : les États-Unis produisent déjà au maximum, la Chine est importatrice et les raffineries russes sont endommagées par les drones ukrainiens (Aktionnaire). Plusieurs commentateurs y voient surtout un succès diplomatique pour Putin, réintégré dans un club des grandes puissances.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "Fox News (web)"], "more": ["<b>Le contexte.</b> Les circuits pétroliers sont perturbés depuis le début de la guerre en Iran."], "prog": "Relations internationales, énergie, puissance"}, {"img": "img/2026-11-20/nvidia_chine.jpg", "alt": "Des visiteurs examinent une carte électronique sur un stand Nvidia lors d'un salon", "credit": "via myFT Daily Digest", "eyebrow": "Semi-conducteurs", "title": "Washington autorise, Pékin et les fabricants freinent", "text": ["Les États-Unis ont approuvé des ventes de puces Nvidia et AMD à des entreprises chinoises (FT). Ces licences, accordées depuis l'été pour les puces H200, n'ont guère débouché sur des livraisons : Pékin a lui-même restreint les achats (Reuters).", "Les nouvelles règles américaines limitent aussi l'accès à distance des entreprises chinoises aux puces avancées : Moonshot AI a renoncé à un contrat de 150 M$ en Indonésie (The Information, via The Neuron). La britannique Nscale, soutenue par Nvidia, prévient de son exposition à des fournisseurs menacés de liste noire, ce qui fragilise son projet d'introduction à 35 Md$ (FT)."], "why": "Les puces sont devenues un instrument de puissance : en autorisant ou bloquant les ventes, Washington arbitre entre recettes de ses champions industriels et avance technologique de la Chine. Pékin, lui, pousse ses entreprises vers les puces nationales pour réduire sa dépendance.", "rep": 3, "sources": ["myFT Daily Digest", "Aktionnaire", "Money Stack", "Reuters (web)"], "prog": "Rivalité sino-américaine, politique industrielle, contrôle des exportations"}, {"img": "img/2026-11-20/starship.jpg", "alt": "Le lanceur Starship décolle au coucher du soleil dans un nuage de fumée", "credit": "via myFT Daily Digest", "eyebrow": "SpaceX", "title": "Des puces en orbite, des prêteurs inquiets", "text": ["Les prêteurs du financement de 40 Md$ de puces de SpaceX veulent l'empêcher d'envoyer ce matériel en orbite (FT). Ces puces servent de garantie : une fois dans l'espace, elles deviendraient presque impossibles à saisir en cas de défaut.", "En octobre, Elon Musk avait annoncé la conclusion de ce financement, monté autour d'Apollo, pour acheter des puces Nvidia."], "why": "Un prêt garanti n'a de valeur que si le créancier peut récupérer l'actif. Le projet de calcul en orbite, porté aussi par Google qui a choisi Blue Origin pour lancer ses satellites en 2029 (The Verge), pose un problème juridique inédit.", "rep": 1, "sources": ["myFT Daily Digest"], "prog": "Financement par la dette, garanties, asymétrie d'information"}]}, {"title": "L'IA au travail, et contre les systèmes", "stories": [{"img": "img/2026-11-20/emploi_ia.jpg", "alt": "Un homme âgé en costume attend sur une chaise à côté d'un robot humanoïde tenant une mallette", "credit": "via Cosmos Finance", "eyebrow": "Emploi", "title": "L'IA freine les embauches de cols blancs", "text": ["Dans une étude publiée le 17 novembre, Coface estime qu'aux États-Unis la productivité des cols blancs (informatique, comptabilité, banque, conseil) progresse de plus de 5 % par an depuis l'arrivée de ChatGPT, contre 1,5 % entre 2010 et 2019. Il manquerait environ trois millions d'emplois de ce type par rapport à la tendance (Cosmos Finance).", "En France, les offres dans les métiers exposés à l'IA sont 12 % inférieures à celles de métiers comparables depuis novembre 2022 ; en ressources humaines, comptabilité, informatique ou banque-assurance, près de 30 % sous leur tendance. Coface chiffre à plus de 100 000 les postes manquants en 2026. Les offres de la production industrielle sont, elles, 12 % au-dessus."], "why": "L'ajustement ne passe pas par des licenciements massifs mais par des départs non remplacés et des embauches différées : « on embauche comme si on était en récession et on licencie comme en période d'expansion », résume Aurélien Duthoit. Ce sont donc les jeunes diplômés qui cherchent un premier poste qui en paient le prix. Il s'agit d'un écart à un scénario théorique, pas de suppressions constatées.", "rep": 2, "sources": ["Cosmos Finance", "myFT Daily Digest", "L'Avenir (web)"], "more": ["<b>L'exemple.</b> Dans l'automobile, les offres pour les agents de maintenance ont augmenté de 20 %, contre 5 % pour les comptables (Cosmos Finance).", "<b>L'expérience ne protège pas.</b> Pour les postes demandant au moins quatre ans d'expérience, les offres exposées à l'IA accusent un retard de 16 %.", "<b>La comptabilité.</b> Le FT se demande si l'IA surpasse déjà les comptables débutants : utiles en un an, les modèles ne remplacent pas la relation client."], "prog": "Progrès technique et emploi, destruction créatrice, marché du travail"}, {"img": "img/2026-11-20/commission_cyber.jpg", "alt": "La silhouette d'un homme portant une oreillette devant le drapeau européen", "credit": "via The Register", "eyebrow": "Cybersécurité", "title": "La menace « particulièrement grave et inédite »", "text": ["Après une réunion interministérielle au SGDSN, Sébastien Lecornu a décrit une menace qui ne laisse rien espérer d'une amélioration (AFP). Les ministères devront consacrer au moins 5 % de leur budget numérique à la cybersécurité dès 2027, puis 10 % en 2030 ; près de 20 000 organisations seront soumises à des exigences renforcées et le service d'assistance 17Cyber sera développé (Cosmos Finance).", "Une filiale de La Poste a été visée le week-end dernier ; en octobre, une attaque attribuée à l'Iran a touché des centaines de réfrigérateurs connectés (AFP)."], "why": "L'IA abaisse le coût des attaques : elle accélère la recherche de failles et permet de les multiplier. En Allemagne, le niveau de menace est jugé « critique » (FT). À Bruxelles, une attaque menée avec ARTEX, un outil de test d'intrusion assisté par IA, perturbe depuis plus de dix jours la paie et les remboursements médicaux des agents de la Commission (The Register).", "rep": 2, "sources": ["Cosmos Finance", "myFT Daily Digest", "AFP (web)", "The Register (web)"], "prog": "Biens publics, sécurité, souveraineté numérique"}]}, {"title": "France : l'État en campagne", "stories": [{"eyebrow": "Fonction publique", "title": "Philippe veut 250 000 postes en moins", "text": ["Édouard Philippe propose de ne remplacer qu'un fonctionnaire sur trois partant à la retraite, soit 250 000 postes supprimés en cinq ans, pour ramener le déficit de plus de 5 % à 2 % du PIB (The Friday memo). Il veut aussi supprimer progressivement le statut pour certaines missions administratives, en le réservant à l'enseignement, la police ou la justice (Cosmos Finance).", "Sur près de 6 millions d'agents publics, 3,7 millions sont fonctionnaires. Selon François Lenglet, les économies seraient lentes : seuls 10 % des fonctionnaires ont plus de 60 ans."], "why": "Laurent Joffrin rappelle que la France n'emploie pas beaucoup plus d'agents publics que la moyenne de l'OCDE, et que ces postes sont souvent des enseignants, soignants, policiers ou magistrats. Réduire la masse salariale publique est un levier budgétaire, mais il dépend de la nature des postes supprimés.", "rep": 2, "sources": ["The Friday memo", "Cosmos Finance"], "prog": "Dépense publique, État, finances publiques"}, {"eyebrow": "Emploi", "title": "« Territoires zéro chômeur » devient permanent", "text": ["L'Assemblée a définitivement adopté, par 258 voix contre 3, la pérennisation du dispositif lancé il y a dix ans. Il emploie 4 300 salariés au Smic dans 85 territoires, au sein d'entreprises à but d'emploi (Cosmos Finance).", "Le financement inquiète : 63 M€ sont prévus pour 2027, contre 99 M€ jugés nécessaires."], "why": "L'idée est de financer des emplois utiles localement avec l'argent que coûte le chômage de longue durée (allocations, coûts sociaux). Le débat porte sur le coût net par emploi créé, comparé à d'autres politiques actives.", "rep": 1, "sources": ["Cosmos Finance"], "prog": "Chômage, politiques de l'emploi, exclusion"}, {"eyebrow": "Émeutes", "title": "207 M€ de dégâts en deux jours", "text": ["Les émeutes des 17 et 18 octobre ont provoqué 207 M€ de dégâts assurés, selon France Assureurs : 5 280 sinistres, dont 95 % du coût porte sur des biens professionnels (Cosmos Finance, Aktionnaire).", "La facture est comparable à celle des émeutes de 2005 ou des Gilets jaunes, malgré des violences concentrées sur deux jours."], "why": "Les assureurs mutualisent ce risque, mais sa répétition pèse sur les primes des commerçants dans les quartiers touchés : un coût social qui dépasse les seuls dégâts.", "rep": 2, "sources": ["Cosmos Finance", "Aktionnaire"], "prog": "Assurance, cohésion sociale"}]}, {"title": "Attention, médias et démocratie", "stories": [{"img": "img/2026-11-20/gta_times_square.jpg", "alt": "Des écrans publicitaires géants pour GTA VI au-dessus d'un carrefour new-yorkais, la nuit", "credit": "Jeenah Moon / Reuters via Aktionnaire", "eyebrow": "Économie de l'attention", "title": "La « grippe GTA »", "text": ["GTA VI, sorti jeudi, a suscité 2,6 millions de messages en 24 heures sur les réseaux, 7 % de plus que le coup d'envoi de la Coupe du monde (Aktionnaire). 12,13 millions d'exemplaires avaient été précommandés sur Xbox et PlayStation, pour 1,18 Md$ (The Next Big Sh*t).", "30 % des salariés interrogés envisagent de prendre du temps pour jouer, et plus d'un tiers d'entre eux pourraient se déclarer malades. Logitech offre une journée à ses 7 000 salariés. Le jeu est interdit en Chine."], "why": "L'attention est une ressource rare : Sensor Tower prévoit 10 % de joueurs quotidiens en moins sur les autres jeux le mois suivant. Ubisoft anticipe une chute de 26 % de ses revenus au trimestre des fêtes et doit rembourser 675 M€ en novembre 2027 (Aktionnaire). Côté production, des salariés de Rockstar dénoncent des semaines de 80 heures (Money Stack).", "rep": 3, "sources": ["Aktionnaire", "The Next Big Sh*t", "Money Stack"], "prog": "Concurrence, industries culturelles, conditions de travail"}, {"eyebrow": "Presse", "title": "La « sécession informationnelle »", "text": ["Le groupe de médias de LVMH (Les Échos, Le Parisien) signe avec OpenAI : outils d'IA pour les journalistes et contenus intégrés à ChatGPT avec des liens vers les articles (The Friday memo). Le Monde, premier à franchir le pas en 2024, affirme que ChatGPT convertit vingt fois mieux en abonnements que Facebook.", "Selon la Fondation Jean-Jaurès, trois Français sur quatre ont limité ou coupé leur consommation d'actualité cette année ; les désintéressés sont passés de 20 % à 26 % en quatre ans."], "why": "Le risque démocratique n'est pas que chacun s'informe autrement, mais que les publics ne partagent plus de faits communs. Un assistant qui résume l'actualité sur mesure pour chacun pourrait renforcer ces bulles, au moment où la presse y voit une source de revenus.", "rep": 1, "sources": ["The Friday memo"], "prog": "Médias, opinion publique, démocratie"}, {"eyebrow": "Opinion", "title": "Sortir du populisme en le traversant", "text": ["Pour Janan Ganesh, le Royaume-Uni et les États-Unis, premiers touchés par la fièvre populiste, pourraient être les premiers à s'en remettre : il faudrait qu'un mouvement soit essayé et échoue pour être vaincu (FT Opinion).", "Robert Armstrong rappelle que les États-Unis ne construisent toujours pas assez de logements pour permettre aux gens de s'installer là où sont les bons emplois."], "why": "Les causes économiques du vote populiste (logement, mobilité, déclassement) restent entières : la défaite électorale d'un mouvement ne règle pas ses ressorts. Les élections de mi-mandat américaines, largement favorables aux démocrates, ont déçu Elon Musk, qui dit ne pas être « MAGA » après près de 500 M$ de dons (Aktionnaire).", "rep": 2, "sources": ["FT Opinion", "Aktionnaire"], "prog": "Populisme, logement, géographie économique"}]}], "briefs": [["Banques", "Berlin, qui détient 13 % de Commerzbank, donne un accord de principe au rachat par UniCredit, qui maintiendra le siège à Francfort (Aktionnaire) ; Bruxelles avait validé l'opération sans condition le 16 novembre (Commission européenne)."], ["Immobilier américain", "Les promesses de vente chutent de 17 % sur un an, au plus bas depuis 2001, avec des taux de crédit à 30 ans au-dessus de 7 % (Cosmos Finance)."], ["Art", "Le dernier tableau de Van Gogh, Châtaigniers en fleurs, s'est vendu 190,4 M$, record pour le peintre (Aktionnaire), après un accord avec les héritiers de son ancien propriétaire juif (The Art Newspaper)."], ["BCE", "Paris et Berlin s'entendent sur l'Espagnol Pablo Hernández de Cos pour succéder à Christine Lagarde ; la France cède le poste d'économiste en chef à l'Allemagne (Money Stack)."], ["Énergie", "L'Agence internationale de l'énergie prévient que la consommation d'électricité des centres de données pourrait doubler d'ici 2030 (Aktionnaire)."], ["Streaming", "Les plateformes de niche décollent aux États-Unis : 42 millions d'abonnés, +20 % par an contre 7 % pour les grandes (The Next Big Sh*t)."], ["Présidentielle", "L'Arcom imposera aux grands créateurs de vidéos les mêmes règles de pluralisme qu'aux télévisions et radios pour 2027 (Aktionnaire)."]], "good": "La Bretagne affiche le chômage le plus faible de France depuis plus de vingt ans : 6,8 % au deuxième trimestre 2026, contre 8,3 % au niveau national, grâce à une économie diversifiée entre agroalimentaire, industrie navale, tourisme et cybersécurité (Cosmos Finance).", "map": {"start": "ia", "nodes": [{"id": "ia", "x": 200, "y": 34, "l": ["Boom de", "l'IA"], "t": "Le moteur", "d": "Modèles plus performants, investissements colossaux."}, {"id": "ipo", "x": 100, "y": 122, "l": ["Anthropic", "en Bourse"], "t": "Le marché", "d": "+17 % le premier jour, environ 1 270 Md$ de capitalisation."}, {"id": "puces", "x": 300, "y": 122, "l": ["Course", "aux puces"], "t": "Le calcul", "d": "Près de 1 000 Md$ d'engagements pour Anthropic seule."}, {"id": "prod", "x": 100, "y": 222, "l": ["Productivité", "des cols blancs"], "t": "L'effet", "d": "Plus de 5 % par an aux États-Unis depuis ChatGPT (Coface)."}, {"id": "chine", "x": 300, "y": 222, "l": ["Licences", "vers la Chine"], "t": "La géopolitique", "d": "Washington autorise, Pékin freine, les règles se durcissent."}, {"id": "emploi", "x": 100, "y": 322, "l": ["Embauches", "freinées"], "t": "Le coût social", "d": "100 000 offres qualifiées manquantes en France en 2026."}, {"id": "cyber", "x": 300, "y": 322, "l": ["Attaques", "assistées par IA"], "t": "Le risque", "d": "Commission européenne, ministères français, Allemagne."}, {"id": "etat", "x": 200, "y": 414, "l": ["États", "en réaction"], "t": "La réponse", "d": "Budgets de cybersécurité, débats sur l'emploi et la régulation."}], "edges": [["ia", "ipo"], ["ia", "puces"], ["ipo", "prod"], ["puces", "chine"], ["prod", "emploi"], ["chine", "cyber"], ["emploi", "etat"], ["cyber", "etat"]]}, "dossiers": [{"eyebrow": "Valorisation", "title": "Que paie-t-on en achetant Anthropic à 97 $ ?", "q": "Selon un calcul du FT, Anthropic devrait réaliser 602 Md$ de chiffre d'affaires annuel pour offrir un rendement du capital de 20 %. Comment le marché peut-il la valoriser 1 270 Md$ ?", "steps": [["Le principe", "Des profits futurs actualisés.", "Le prix d'une action reflète la valeur présente des flux attendus, pas les résultats actuels."], ["La croissance", "+1 127 % sur un an.", "17 Md$ de chiffre d'affaires au troisième trimestre (Money Stack)."], ["Les coûts", "Le calcul pèse lourd.", "Dépenses d'infrastructure +77 % en un trimestre, contre +47 % pour les revenus."], ["L'exigence", "Le rendement du capital.", "Pour 20 % de rendement comme Alphabet ou Microsoft, il faudrait 602 Md$ de revenus, trois fois Meta (FT, via Aktionnaire)."], ["Le verdict", "Le marché hésite.", "Ouverture à 111,50 $, clôture à 97,17 $ : l'enthousiasme initial s'est érodé dès la première séance."]], "calc": true, "refs": ["<b>Irving Fisher.</b> La valeur d'un actif est la somme actualisée de ses revenus futurs.", "<b>Myron Gordon.</b> Le prix dépend de l'écart entre taux d'actualisation et taux de croissance : une petite variation change tout quand la croissance est forte.", "<b>Joseph Schumpeter.</b> La rente de l'innovateur est temporaire : la concurrence finit par l'éroder.", "<b>Robert Shiller.</b> Les récits et l'exubérance peuvent éloigner durablement les prix des fondamentaux."], "accroche": "Le 19 novembre 2026, Anthropic termine sa première séance à 97,17 $, après avoir ouvert à 111,50 $ : en quelques heures, le marché a révisé de plusieurs centaines de milliards la valeur qu'il lui prête.", "sujets": ["Les marchés financiers sont-ils efficients ?", "Comment évaluer une entreprise innovante ?", "La finance est-elle au service de l'innovation ?"]}, {"eyebrow": "Marché du travail", "title": "L'IA détruit-elle l'emploi qualifié ?", "q": "Coface estime qu'il manque trois millions d'emplois de cols blancs aux États-Unis et 100 000 offres en France en 2026. Est-ce le chômage technologique annoncé ?", "steps": [["Le choc", "Une productivité qui accélère.", "Plus de 5 % par an pour les cols blancs américains, contre 1,5 % avant 2020."], ["L'ajustement", "Des postes qui ne s'ouvrent pas.", "Départs non remplacés et embauches différées, sans plan social."], ["La sélection", "Les métiers exposés décrochent.", "Offres françaises 12 % sous celles de métiers comparables ; près de 30 % sous la tendance en RH, comptabilité, informatique."], ["Le déversement", "D'autres métiers recrutent.", "Production industrielle +12 % au-dessus de sa tendance ; maintenance automobile +20 %."], ["L'inconnue", "De nouvelles activités ?", "Tout dépend de la capacité des gains de productivité à créer de nouveaux besoins."]], "split": [["Une destruction créatrice classique", "Les gains de productivité baissent les prix, augmentent le revenu réel et finissent par créer des emplois ailleurs, comme lors des révolutions industrielles."], ["Un choc d'une nature nouvelle", "L'IA touche des tâches cognitives, donc les emplois qualifiés et les débutants : le déversement pourrait être lent et inégalitaire."]], "refs": ["<b>Joseph Schumpeter.</b> La destruction créatrice : l'innovation détruit des activités et en crée d'autres.", "<b>Alfred Sauvy.</b> La théorie du déversement : les emplois perdus dans un secteur se reportent vers de nouveaux secteurs.", "<b>John Maynard Keynes (1930).</b> Le « chômage technologique », lié à un progrès plus rapide que notre capacité à trouver de nouveaux usages du travail.", "<b>Daron Acemoglu et Pascual Restrepo.</b> L'automatisation crée un effet de déplacement ; seule la création de nouvelles tâches le compense."], "accroche": "« On embauche comme si on était en récession et on licencie comme en période d'expansion » : c'est ainsi que l'économiste Aurélien Duthoit résume l'effet de l'IA sur les cols blancs américains en novembre 2026.", "sujets": ["Le progrès technique est-il destructeur d'emplois ?", "Faut-il craindre la fin du travail ?", "Les gains de productivité profitent-ils à tous ?"]}, {"eyebrow": "Finances publiques", "title": "Réduire le nombre de fonctionnaires, une bonne méthode ?", "q": "Édouard Philippe propose 250 000 postes en moins en cinq ans pour ramener le déficit à 2 % du PIB. La mesure est-elle efficace ?", "steps": [["Le constat", "Un déficit au-delà de 5 %.", "Le candidat veut le ramener à 2 % du PIB."], ["La mesure", "Un départ sur trois remplacé.", "Soit 250 000 postes en cinq ans, sans licenciement."], ["La limite démographique", "Des économies lentes.", "Seuls 10 % des fonctionnaires ont plus de 60 ans : les départs à la retraite sont étalés (François Lenglet)."], ["La composition", "Quels postes ?", "Enseignants, soignants, policiers et magistrats forment une large part des effectifs."], ["L'alternative", "Le statut.", "Réserver le statut aux missions régaliennes et à l'enseignement change la gestion, pas immédiatement la dépense."]], "split": [["Un levier nécessaire", "La masse salariale publique est l'un des premiers postes de dépense ; sans maîtrise des effectifs, le redressement repose sur les impôts."], ["Un levier trompeur", "La France n'a pas beaucoup plus d'agents que la moyenne de l'OCDE ; supprimer des postes sans revoir les missions dégrade les services publics."]], "refs nt record"]], "ia": {"toc": "Anthropic cotée, Gemini prend la main sur le Mac, et une attaque assistée par IA paralyse la Commission européenne.", "intro": "Modèles, outils et projets : ce qui change dans l'IA, et ce qui sert vraiment.", "signalTitle": "Un labo coté, des agents qui pilotent l'ordinateur, et des attaquants qui s'en servent aussi", "signal": [{"img": "img/2026-11-20/anthropic_nasdaq.jpg", "alt": "Une vingtaine de personnes applaudissent derrière le pupitre du Nasdaq, sous un grand logo Anthropic", "credit": "Charly Triballeau / AFP via Aktionnaire", "eyebrow": "Anthropic · industrie", "title": "Le créateur de Claude termine sa première séance à +17 %", "text": ["Ouverte à 111,50 $, l'action Anthropic a clôturé jeudi à 97,17 $, pour un prix d'introduction de 83 $ (Investing.com). Avec le placement privé, l'opération lève 107,3 Md$. Les analystes de Melius et Needham visent 150 à 155 $.", "Pour justifier sa valorisation, Anthropic mise sur de nouveaux produits et des prix agressifs, jusqu'à −40 % pour l'administration américaine (Aktionnaire)."], "why": "Quatre sénateurs américains des deux partis ont déposé dans la foulée un texte imposant aux sociétés cotées de détailler leur usage de l'IA (Semafor). Coté, un laboratoire publie ses comptes chaque trimestre : coûts de calcul, marges et contrats deviennent publics, ce qui éclaire aussi les prix que paient les utilisateurs.", "sources": ["Investing.com (web)", "Aktionnaire", "Semafor (web)"], "url": "https://www.investing.com/news/stock-market-news/anthropic-opens-34-above-ipo-price-reaches-2-trillion-valuation-in-nasdaq-debut-5039595"}, {"eyebrow": "Google · agents", "title": "Gemini peut désormais utiliser votre Mac", "text": ["L'appli Gemini pour macOS sait exécuter des tâches à la place de l'utilisateur : naviguer dans les applications du Mac, remplir des formulaires, trier des fichiers dans des dossiers, répéter une opération sur une série de documents ou créer un diaporama. L'agent travaille dans un aperçu en direct, pendant qu'on garde la main sur l'écran ; on peut le mettre en pause, l'arrêter et approuver ses actions (TechCrunch).", "Réservé pour l'instant aux États-Unis, en anglais, aux abonnés Google AI Plus, Pro et Ultra."], "why": "OpenAI, Anthropic et Meta proposent déjà des fonctions comparables. Selon Bloomberg, Apple développe son propre agent capable de piloter applications, navigateur et code, et prépare des avertissements de permission pour les agents concurrents. Le contrôle de l'ordinateur devient le prochain terrain de concurrence, avec un enjeu évident d'accès aux données personnelles.", "sources": ["TechCrunch (web)", "Bloomberg (web)"], "url": "https://techcrunch.com/2026/11/19/google-gives-gemini-the-ability-to-use-your-mac-for-you/"}, {"img": "img/2026-11-20/commission_cyber.jpg", "alt": "La silhouette d'un homme portant une oreillette devant le drapeau européen", "credit": "via The Register", "eyebrow": "Sécurité", "title": "Une attaque assistée par IA paralyse la Commission européenne", "text": ["Depuis plus de dix jours, des systèmes internes de la Commission sont perturbés : Sysper, le portail du personnel pour les fiches de paie et les congés, MyPMO pour les remboursements médicaux, et les services de traduction. Les défenseurs ont repéré ARTEX, un outil public de test d'intrusion assisté par IA (The Register, d'après Politico).", "La Commission ne dit pas si des données ont été volées ; aucun attaquant n'a été identifié."], "why": "Le développeur d'ARTEX a retiré son dépôt GitHub en octobre, mais des copies circulaient déjà. Selon le FBI, plus de 1 600 consoles ARTEX sont exposées sur internet, et des intrus sont passés de la cible à un accès privilégié en moins de trois heures. Les outils de test conçus pour les défenseurs servent aussi aux attaquants : mises à jour rapides et authentification à deux facteurs restent la première protection.", "sources": ["The Register (web)"], "url": "https://www.theregister.com/cyber-crime/2026/1   const cache={}; if(LATEST) cache[LATEST.date]=LATEST;

  tabs.forEach(t=>t.addEventListener('click',()=>{show(t.getAttribute('aria-controls'));window.scrollTo({top:tabsTop()});}));

  const fmtShort=iso=>{const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};

  const SPK='<svg class="spk" aria-hidden="true"><rect width="100%" height="100%" filter="url(#speck)"/></svg>';
  const ph=(src,alt,lazy)=>`<div class="ph"><img src="${src}" alt="${esc(alt||'')}"${lazy?' loading="lazy"':''}><canvas class="xr" aria-hidden="true"></canvas>`;

          <defs><marker id="arrow" class="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
          <g id="edges"></g><g id="nodes"></g></svg>
        <div class="map-note" id="mapNote" aria-live="polite"></div></div>`)}

    }));

  function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);
  }

  function calcHTML(){return `
    <div class="calc">
      <div class="l">
        <span class="k">Maths appliquées · Actualisation</span>
        <h3>Pourquoi les taux font plus mal aux valeurs de l'IA</h3>
        <div class="formula">V = Σ (t = 1…30) CF<sub>t</sub> / (1 + r)<sup>t</sup></div>
        <p class="note">Deux entreprises gagnent la même somme sur 30 ans. L'entreprise <b>mature</b> touche 10 par an dès maintenant. L'entreprise <b>IA</b> gagne peu au début puis beaucoup plus tard (croissance de 25 % par an pendant 15 ans).</p>
      </div>
      <div class="r">
        <div class="slider"><label for="rate"><span class="k">Taux d'actualisation r</span><span class="rv" id="rateV">3,0 %</span></label><input type="range" id="rate" min="1" max="9" step="0.25" value="3"></div>
        <div class="bars">
          <div class="barrow"><span class="k">Mature</span><div class="track"><div class="fill" id="barA"></div></div><span class="num" id="valA">100</span></div>
          <div class="barrow"><span class="k">IA</span><div class="track"><div class="fill ia" id="barB"></div></div><span class="num" id="valB">100</span></div>
        </div>
        <p class="note" id="calcMsg"></p>
      </div>
    </div>`;}
  function initCalc(){
    const A=Array.from({length:30},()=>10), raw=Array.from({length:30},(_,i)=>Math.pow(1.25,Math.min(i,15)));
    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);
    const f1=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
    const rate=$('#rate');
    const upd=()=>{const r=parseFloat(rate.value)/100,a=pv(A,r)/bA*100,b=pv(B,r)/bB*100,mx=Math.max(a,b,100);
      $('#rateV').textContent=f1(r*100)+' %';$('#valA').textContent=Math.round(a);$('#valB').textContent=Math.round(b);
      $('#barA').style.width=(a/mx*100)+'%';$('#barB').style.width=(b/mx*100)+'%';
      const a1=pv(A,r+.01)/pv(A,r)-1,b1=pv(B,r+.01)/pv(B,r)-1;
      $('#calcMsg').innerHTML=`Base 100 à r = 3 %. À ${f1(r*100)} %, un point de taux en plus fait perdre <b class="down">${f1(-a1*100)} %</b> à l'entreprise mature et <b class="down">${f1(-b1*100)} %</b> à l'entreprise IA. Plus les profits sont lointains, plus la valeur est sensible au taux : c'est la duration.`;};
    rate.addEventListener('input',upd);upd();
  }

        <div class="g"><div style="grid-column:1/-1"><ol>${c.parts.map(([t,sub])=>`<li><b>${esc(t)}</b><ol>${sub.map(s=>`<li><span>${T(s)}</span></li>`).join('')}</ol></li>`).join('')}</ol></div></div></div>`:''}`;

    const key='revue-quiz-'+D.date; let st={};
    try{st=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){st={}}
    const save=()=>{try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}};
    const quiz=$('#quiz');
    const draw=()=>{
      let ok=0;
      quiz.innerHTML=D.quiz.map((it,i)=>{const ans=st[i];if(ans===it.a)ok++;

      $('#score').textContent=ok+'/'+D.quiz.length;
    };
    quiz.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.getAttribute('aria-disabled')==='true')return;st[b.dataset.q]=+b.dataset.o;save();draw();});
    $('#reset').addEventListener('click',()=>{st={};save();draw();});
    draw();

        if(x<-60||y<-60||x>r.width+60||y>r.height+60||!last) return;
        let mx=x-last.x, my=y-last.y; const m=Math.hypot(mx,my);
        if(m<.5||m>200) return;
        const g=grid(l), R=110, sg=46, k=.11, ux=mx/m, uy=my/m;
        const c0=Math.max(0,Math.floor((x-R)/DC)), c1=Math.min(g.cols-1,Math.ceil((x+R)/DC));
        const r0=Math.max(0,Math.floor((y-R)/DC)), r1=Math.min(g.rows-1,Math.ceil((y+R)/DC));
        for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){
          const dx=cc*DC-x, dy=rr*DC-y, wgt=Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))*k*Math.min(m,24), i=(rr*g.cols+cc)*2;
          const side=(dx*-uy+dy*ux)/sg;          /* de quel côté de la trajectoire : la matière s'y écarte */
          let a=g.d[i]+wgt*(ux*(1-.4*side*side)-uy*side*.7), b=g.d[i+1]+wgt*(uy*(1-.4*side*side)+ux*side*.7); const n=Math.hypot(a,b);
          if(n>DMAX){a*=DMAX/n;b*=DMAX/n;}
          g.d[i]=a;g.d[i+1]=b;
        }
        g.dirty=true;l.wakeUntil=now+900;l.settle=true;
      });
      kick();
    },{passive:true});
    const R={
      bands:(l,time)=>paint(l,'bands',time,pr=>{set(pr,'uType',l.type);disp(pr,l);}),
      mast:(l,time)=>paint(l,'mast',time,pr=>disp(pr,l)),
      ascii:(l,time)=>{
        const img=l.img;
        if(!img.complete||!img.naturalWidth) return false;
        if(!l.tex){try{l.tex=texture(img);l.st=stats(img);}catch(e){l.el.style.display='none';return false;}}
        return paint(l,'ascii',time,(pr,W,H,dpr)=>{
          const cw=W/dpr<500?3.6:5, ch=cw*1.7;
          if(!l.atex||l.akey!==cw*dpr){
            const ac=document.createElement('canvas'), gw=Math.round(cw*dpr*2), gh=Math.round(ch*dpr*2), x=ac.getContext('2d');
            const font=`${Math.round(gh*.86)}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
            /* signes seulement (ni lettres ni chiffres), classés par la quantité d'encre qu'ils déposent réellement */
            const cand=[...' .,\'`:;-_~^"=+*!|/\\()[]{}<>?#%&$@'];
            ac.width=gw;ac.height=gh;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            const ink=cand.map(g=>{x.clearRect(0,0,gw,gh);x.fillText(g,gw/2,gh*.54);const d=x.getImageData(0,0,gw,gh).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return [g,s];});
            l.ramp=ink.sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
            ac.width=gw*l.ramp.length;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            l.ramp.forEach((g,i)=>x.fillText(g,gw*(i+.5),gh*.54));
            if(l.atex)gl.deleteTexture(l.atex);
            l.atex=texture(ac);l.akey=cw*dpr;
          }
          gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,l.atex);set(pr,'uAtlas',1);
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uCellPx',[cw,ch]);
          set(pr,'uN',l.ramp.length);
        });
      },
      photo:(l,time,now)=>{
        const img=l.img;
        if(l.broken||!img.complete||!img.naturalWidth) return false;
        if(!l.tex){
          try{l.tex=texture(img);l.st=l.st||stats(img);}
          catch(e){l.broken=true;l.el.style.display='none';l.ph.classList.add('raw');return false;}
        }
        const dt=l.tl?Math.min(.1,(now-l.tl)/1000):0;
        if(l.rev!==l.target){
          const s=still.matches?1:dt/1.5;
          l.rev=l.target>l.rev?Math.min(l.target,l.rev+s):Math.max(l.target,l.rev-s);
        }
        l.tl=l.rev===l.target?0:now;
        const e=l.rev*l.rev*(3-2*l.rev);
        return paint(l,'photo',time,pr=>{
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uRev',e);set(pr,'uDark',col.dark);set(pr,'uLight',col.light);
        });
      }
    };
    function frame(now){
      raf=0;
      if(!ok) return;
      const move=!still.matches, time=move?(now-t0)/1000:(t0%1e5)/1000;
      let again=false;
      layers.forEach(l=>{
        if(!l.seen) return;
        const live=l.kind==='photo'?l.rev!==l.target:move;
        const fluid=l.wakeUntil>now;     /* pendant le geste : chaque image, pour un mouvement fluide */
        if(l.dirty||fluid||(live&&(l.kind==='photo'||now-l.last>=FPS))){
          if(R[l.kind](l,time,now)!==false)l.dirty=false;
          l.last=now;
        }
        if(fluid||(l.kind==='photo'?l.rev!==l.target:move)) again=true;
      });
      if(again&&!document.hidden) raf=requestAnimationFrame(frame);
    }
    function kick(){if(!raf&&ok)raf=requestAnimationFrame(frame);}
    const io=new IntersectionObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l){l.seen=e.isIntersecting;if(l.seen)l.dirty=true;}});kick();},{rootMargin:'200px 0px'});
    const ro=new ResizeObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l)l.dirty=true;});kick();});
    const add=(el,kind,o)=>{layers.set(el,Object.assign({el,kind,seen:false,dirty:true,last:0,ctx:null},o));io.observe(el);ro.observe(el);};
    const TYPE={fall:0,band:1,rise:2};
    /* (re)branche les couches après chaque rendu ; celles retirées du DOM sont libérées */
    function scan(){
      layers.forEach((l,el)=>{
        if(el.isConnected) return;
        io.unobserve(el);ro.unobserve(el);
        [l.tex,l.atex,l.dtex].forEach(x=>x&&gl.deleteTexture(x));
        layers.delete(el);
      });
      document.querySelectorAll('canvas.fx').forEach((el,i)=>{if(!layers.has(el))add(el,'bands',{type:TYPE[el.dataset.g]||0,seed:((i+1)*.6180339)%1});});
      document.querySelectorAll('canvas.mastfx').forEach(el=>{if(!layers.has(el))add(el,'mast',{});});
      document.querySelectorAll('canvas.ascfx').forEach(el=>{
        if(layers.has(el)) return;
        const img=new Image();img.src=el.dataset.src;
        add(el,'ascii',{img});
        img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      document.querySelectorAll('.ph').forEach((ph,i)=>{
        const el=ph.querySelector('canvas.xr'), img=ph.querySelector('img');
        if(!el||layers.has(el)) return;
        add(el,'photo',{img,ph,rev:0,target:0,tl:0,seed:((i+3)*.7548777)%1});
        if(!img.complete) img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      kick();
    }
    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
  function fitStair(el){
    const W=el.clientWidth; if(!W||el._w===W) return; el._w=W;
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let k=1;
    el.querySelectorAll(':scope > span').forEach(s=>{const pad=parseFloat(getComputedStyle(s).paddingLeft)||0,text=s.scrollWidth-pad;if(text>0)k=Math.min(k,(W-pad)/text);});
    if(k<1) el.style.fontSize=(base*k*.985)+'px';
  }
  const stairRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitStair(e.target))):null;
  function fitStairs(){document.querySelectorAll('.stair').forEach(el=>{el._w=0;fitStair(el);if(stairRO)stairRO.observe(el);});}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStairs);
  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();fitStairs();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
