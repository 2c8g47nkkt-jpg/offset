<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFSET</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Revue de presse quotidienne : économie, géopolitique et IA, chaque matin vers 6 h 40.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OFFSET">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta property="og:site_name" content="OFFSET">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="OFFSET — Revue du matin">
<meta property="og:description" content="Vendredi 13 novembre 2026 — Nvidia perd Jensen Huang, son fondateur">
<meta property="og:image" content="https://2c8g47nkkt-jpg.github.io/offset/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc{grid-row:auto}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}

5 %", "l": "part de production française dans ce que consomment les Français, contre plus de 80 % en 2010", "dir": "down"}], "themes": [{"title": "Nvidia sans Jensen Huang", "stories": [{"img": "img/2026-11-13/huang_serveurs.jpg", "alt": "Jensen Huang, en veste de cuir noire, devant des baies de serveurs", "credit": "Via myFT Daily Digest", "eyebrow": "Gouvernance", "title": "La chute du fondateur", "text": ["Le 12 novembre, Nvidia annonce que Jensen Huang quitte avec effet immédiat ses fonctions de président, de directeur général et d'administrateur. Dimanche, il avait reconnu une liaison avec Alice Huang, cadre de la société Megaspeed, que le renseignement américain soupçonne de travailler pour la Chine. Mercredi, le New York Times a révélé une relation avec une dirigeante placée sous son autorité ; Reuters en a signalé une seconde jeudi.", "Colette Kress, 59 ans, directrice financière entrée chez Nvidia en 2013, devient PDG par intérim tout en gardant son poste. Harvey Jones, ancien patron de Synopsys et administrateur depuis 1993, devient le tout premier président du conseil. Celui-ci cherche un successeur, en interne comme à l'extérieur (communiqué de Nvidia)."], "why": "Pour Stacy Rasgon (Bernstein), une relation avec une subordonnée rendait « bien plus difficile » de le maintenir en poste. Des élus américains avaient réclamé sa démission. Le conseil assure que les opérations, les engagements envers les clients et la feuille de route des produits continueront « sans interruption ».", "rep": 6, "sources": ["TNBS", "Aktionnaire", "myFT", "FT Opinion", "Cosmos", "Nvidia (web)", "CNBC (web)", "ABC News (web)"], "more": ["<b>Les excuses.</b> Dans un message interne cité par ABC News, Jensen Huang écrit : « Il n'y a aucune excuse à ce que j'ai fait. »", "<b>La suite.</b> Nvidia publiera ses résultats du troisième trimestre le mardi 17 novembre, première épreuve pour la nouvelle direction.", "<b>Le parcours.</b> Cofondateur en 1993, il a transformé un fabricant de cartes graphiques pour le jeu vidéo en pièce centrale du boom de l'IA (CNBC)."], "prog": "Gouvernance d'entreprise, théorie de l'agence, rôle du conseil d'administration"}, {"img": "img/2026-11-13/nvidia.jpg", "alt": "Une passante devant le logo lumineux de Nvidia sur un mur", "credit": "EPA, via ABC News", "eyebrow": "Marchés", "title": "Une chute brutale, puis un rebond partiel", "text": ["L'action Nvidia a perdu jusqu'à 14 % à l'ouverture avant de se reprendre et de clôturer à −4,3 %, juste au-dessus de 4 000 Md$ de capitalisation. Elle avait déjà perdu plus de 20 % en un mois (CNBC). Les investisseurs ont « acheté la baisse », note le FT.", "Le secteur a suivi : −9,7 % pour CoreWeave, −4,8 % pour Micron, −3 % pour Intel et −2,3 % pour TSMC (Aktionnaire). Bernstein a divisé par deux son objectif de cours, de 400 à 200 $."], "why": "Les investisseurs ne craignent pas un changement de stratégie, mais une crise d'exécution : livraisons, clients et partenariats étaient centralisés autour d'un seul homme. Pour un gérant cité par CNBC, l'absence de plan de succession rend l'action « ininvestissable ».", "rep": 3, "sources": ["Aktionnaire", "myFT", "TNBS", "CNBC (web)", "ABC News (web)"], "more": ["<b>Sur cinq ans.</b> L'action reste en hausse de 429 %, mais recule d'environ 17 % sur un an (ABC News).", "<b>Le reste du marché.</b> Le Dow Jones, le S&P 500 et le Nasdaq ont tous fini à −0,3 %."], "prog": "Marchés financiers, valorisation des actifs, information et anticipations"}, {"eyebrow": "Succession", "title": "Qui pour remplacer une légende ?", "text": ["Colette Kress, directrice financière depuis 2013, assure l'intérim. Selon le FT, repris par Reuters, le conseil d'administration a approché Rene Haas, patron d'Arm et ancien de Nvidia, où il a passé sept ans ; l'action Arm a perdu 6,5 % vendredi. Ian Buck, l'un des créateurs de CUDA, la plateforme qui a fait des puces Nvidia l'outil de base de l'IA, est en tête des paris sur Polymarket, note Cosmos Finance.", "Donald Trump a publiquement appelé Tim Cook, l'ancien patron d'Apple, à prendre la place de Jensen Huang : « Une légende remplace une légende ! » D'autres noms circulent, de Johny Srouji (Apple) à Matt Garman (AWS). Selon Cosmos Finance, Nvidia a perdu au moins 800 Md$ de capitalisation depuis début novembre et recule de 11 % depuis janvier."], "why": "Une piste évoquée : couper en deux le rôle que Huang tenait seul, la gestion et les marchés pour Colette Kress, la stratégie technologique pour un ingénieur. Pour John Thornhill (FT), son départ pourrait aussi creuser la rupture technologique entre Washington et Pékin.", "rep": 5, "sources": ["Aktionnaire", "Cosmos", "FT Newswrap", "FT Opinion", "TNBS", "myFT", "Business Recorder (web)", "Yahoo Finance (web)"], "prog": "Entrepreneur et manager, Schumpeter, pouvoir dans l'entreprise"}], "items": []}, {"title": "Le retour de la peur de l'inflation", "stories": [{"eyebrow": "États-Unis", "title": "Taux américains : la pire semaine depuis avril 2025", "text": ["L'inflation d'octobre a progressé de 0,4 % sur un mois, plus que prévu. Le taux à 10 ans des emprunts d'État américains a terminé la semaine autour de 5,1 %, sa plus forte hausse hebdomadaire depuis les annonces de droits de douane d'avril 2025 ; le FT parle de la pire semaine pour les Treasuries depuis plus de 18 mois."], "why": "Christopher Waller, gouverneur de la Fed, s'est dit prêt à une hausse de 0,5 point d'un coup si l'inflation accélère encore. Les marchés intègrent désormais une hausse de 0,25 point en décembre. Les investisseurs qui avaient parié en septembre sur la fin de la tempête obligataire ont dû se défaire de leurs positions.", "rep": 1, "sources": ["FT Newswrap", "Advisor Perspectives (web)"], "prog": "Politique monétaire, taux longs, anticipations d'inflation"}, {"eyebrow": "France", "title": "Paris emprunte à plus de 5 %, une première depuis 2002", "text": ["Le taux d'emprunt de la France à 10 ans a bondi de 1,6 point depuis fin février et a brièvement dépassé 5 %, une première depuis 2002, relève HyperTextes d'après Économix. C'est pire que la Belgique (+1,2 point) et deux fois plus que l'Espagne (+0,8 point)."], "why": "Avec une dette proche de 120 % du PIB et un déficit au-dessus de 5 %, la France a un handicap de plus : sa dette, abondante et facile à échanger, est devenue le terrain de jeu favori des investisseurs qui parient à la baisse.", "rep": 1, "sources": ["HyperTextes"], "prog": "Dette publique, prime de risque, spreads"}, {"eyebrow": "BCE", "title": "Succession de Lagarde : Paris soutiendrait l'Espagnol Hernández de Cos", "text": ["Selon le FT, la France laisse entendre qu'elle soutient Pablo Hernández de Cos, ancien gouverneur de la Banque d'Espagne et directeur général de la BRI, pour succéder à Christine Lagarde, qui quittera la présidence de la BCE le 7 février 2027. Son principal rival est le Néerlandais Klaas Knot ; des désaccords au sein de la coalition allemande retardent l'accord."], "why": "Les postes se négocient en paquet : Paris verrait bien Laurence Boone, ancienne cheffe économiste de l'OCDE, au directoire de la BCE. Le soutien français n'est pas confirmé officiellement.", "rep": 1, "sources": ["FT Newswrap", "Zonebourse (web)", "Arab News (web)"], "prog": "Banque centrale, gouvernance de la zone euro"}]}, {"title": "Puces, Chine et bulle de l'IA", "stories": [{"eyebrow": "Géopolitique", "title": "Washington, Pékin et l'ombre de l'espionnage", "text": ["Pékin qualifie les accusations de « calomnies sans fondement » et accuse les États-Unis de fabriquer des « récits d'espionnage » ; il les met en garde contre toute nouvelle restriction technologique (FT). Selon CNBC, Alice Huang serait aussi liée à Huawei, principal concurrent de Nvidia en Chine. Megaspeed, basée à Singapour, est accusée d'avoir contourné les contrôles américains à l'exportation de puces."], "why": "FT Opinion estime que ce départ pourrait creuser le fossé technologique entre Washington et Pékin. Reçu aux dîners d'État il y a peu, Jensen Huang est tombé en disgrâce à Washington, où ses adversaires voient désormais « du sang dans l'eau » (FT).", "rep": 3, "sources": ["myFT", "FT Opinion", "Aktionnaire", "CNBC (web)", "ITV News (web)"], "more": ["<b>Avant le scandale.</b> Donald Trump avait d'abord défendu Huang, le qualifiant de « personne bien » (ITV News).", "<b>Le précédent.</b> En mai, le fonds Culper Research avait parié à la baisse sur l'action en publiant un rapport sur ces liens."], "prog": "Guerre technologique sino-américaine, protectionnisme, souveraineté"}, {"img": "img/2026-11-13/datacenter.jpg", "alt": "Vue aérienne du chantier d'un immense centre de données au Texas, au milieu du désert", "credit": "Chantier Stargate à Abilene (Texas), via myFT Daily Digest", "eyebrow": "Financement de l'IA", "title": "La toile de dépendances qui inquiète", "text": ["Nvidia ne vend pas seulement des puces : elle investit dans des entreprises qui deviennent ensuite ses clients, dont OpenAI et Anthropic. Si la nouvelle direction réduit ces financements, des projets de centres de données pourraient être reportés, les valorisations baisser et les levées de fonds se compliquer (TNBS)."], "why": "Le FT pose la question : la chute de Huang pourrait-elle défaire le réseau de dépendances financières qui a nourri le boom de l'IA ? Il pointe aussi la concentration des portefeuilles sur quelques valeurs géantes. Pour l'instant, l'appétit reste fort : l'introduction en Bourse d'Anthropic serait six fois sursouscrite (Bloomberg, cité par Aktionnaire).", "rep": 3, "sources": ["TNBS", "myFT", "Aktionnaire"], "prog": "Bulles spéculatives, financement de l'économie, risque systémique"}, {"eyebrow": "États-Unis", "title": "Les centres de données, perdants des élections de mi-mandat", "text": ["Le président de la Heritage Foundation, think tank conservateur, admet que la proximité des républicains avec la Silicon Valley et la guerre avec l'Iran leur ont coûté des voix (FT). Selon AdImpact, les campagnes ont dépensé plus de 380 M$ en publicités télévisées mentionnant les centres de données, les démocrates trois fois plus que les républicains."], "why": "L'IA devient un sujet électoral local, et un handicap pour ceux qui lui sont associés. C'est une contrainte politique nouvelle pour un secteur qui prévoit des investissements massifs dans les centres de données.", "rep": 1, "sources": ["myFT", "ClickOnDetroit (web)"], "prog": "Économie politique, externalités, acceptabilité sociale de l'innovation"}], "items": []}, {"title": "France : coût du travail et institutions", "stories": [{"img": "img/2026-11-13/senat.jpg", "alt": "La façade du palais du Luxembourg, siège du Sénat, ornée de drapeaux français", "credit": "Via Le Figaro", "eyebrow": "Budget de la Sécu", "title": "Le Sénat diffère la baisse des allègements de cotisations", "text": ["Le gouvernement voulait réduire de 3,7 Md€ en 2027 les exonérations de cotisations patronales sur les bas salaires, en intégrant certains compléments comme l'épargne salariale. Le Sénat a reporté la mesure au 1er avril, ce qui coûte 900 M€ à la Sécurité sociale. Objectif : laisser le temps de préparer une réforme « structurelle » d'ici le 31 mars."], "why": "Ces allègements coûtent 75 Md€ par an à la Sécurité sociale. Le ministre du Travail Jean-Pierre Farandou y voit une « trappe à Smic » : augmenter de 100 € par mois un salarié au Smic coûte 450 € à l'entreprise, car elle perd une partie de l'exonération. Il cite le rapport des économistes Antoine Bozio et Étienne Wasmer (2024).", "rep": 1, "sources": ["Aktionnaire", "Le Figaro (web)"], "more": ["<b>Conditionner les aides ?</b> Un décret réduit déjà les allègements dans les branches dont les minima sont inférieurs au Smic. Les sénateurs communistes proposent de les moduler selon la précarité des contrats ou l'égalité professionnelle.", "<b>Le contexte.</b> La mesure suit la conférence sociale du 9 novembre à Matignon, consacrée à la hausse des salaires."], "prog": "Coût du travail, Smic, chômage et politiques de l'emploi"}, {"eyebrow": "Constitution", "title": "Le référendum n'est pas un chèque en blanc", "text": ["Le président du Conseil constitutionnel, Richard Ferrand, a rappelé que le référendum est encadré par la Constitution : un président élu ne peut pas en disposer à sa guise. Une réponse aux projets de Marine Le Pen, qui veut faire adopter par référendum la préférence nationale ou la fin du droit du sol, en invoquant le précédent du général de Gaulle en 1962."], "why": "Les élus du RN ont réclamé sa démission. The Friday memo s'étonne que personne ne soit venu défendre l'institution, signe qu'elle est « au mieux incomprise, au pire mal aimée ». En arrière-plan : la tension entre souveraineté populaire et État de droit.", "rep": 1, "sources": ["The Friday memo"], "prog": "Institutions de la Ve République, État de droit, démocratie"}, {"eyebrow": "Production", "title": "Le made in France recule dans nos achats", "text": ["Les biens et services consommés en France contiennent en moyenne 77,5 % de production française, contre plus de 80 % en 2010. Cette part atteint 78 % en Allemagne, 79 % en Italie, 88 % en Chine et 89,5 % aux États-Unis."], "why": "Un indicateur simple de la désindustrialisation et de la dépendance aux importations, au cœur des débats sur la réindustrialisation et la souveraineté économique.", "rep": 1, "sources": ["TNBS"], "prog": "Commerce international, désindustrialisation, compétitivité"}], "items": []}, {"title": "Entreprises : s'adapter pour résister", "stories": [{"img": "img/2026-11-13/burberry.jpg", "alt": "Trenchs et écharpes à motif tartan Burberry sur des cintres en bois", "credit": "Toby Melville/Reuters, via Aktionnaire", "eyebrow": "Luxe", "title": "Burberry à contre-courant", "text": ["Le groupe britannique dépasse les prévisions pour son deuxième trimestre : ventes comparables +4 % sur un an, portées par la Chine et les États-Unis. Sa recette : baisse des prix et retour à son identité, avec ses trenchs et écharpes. L'action prend 6 %."], "why": "Un cas d'école de repositionnement : quand le luxe ralentit, Burberry mise sur l'élasticité-prix et sur la marque plutôt que sur la montée en gamme.", "rep": 1, "sources": ["Aktionnaire"], "prog": "Stratégies de prix, différenciation, concurrence monopolistique"}, {"eyebrow": "Assurance", "title": "Allianz encaisse le choc climatique", "text": ["Les catastrophes naturelles de l'été en Europe ont coûté 1,1 Md€ à l'assureur allemand, contre 60 M€ à l'été 2025. Il affiche pourtant un bénéfice opérationnel de 4,7 Md€ au troisième trimestre (+6,2 %), grâce à la gestion d'actifs, dont le bénéfice bondit de 35 % à 1,1 Md€."], "why": "Le changement climatique se lit déjà dans les comptes des assureurs. La diversification des activités amortit le choc, mais la hausse des sinistres finira par se répercuter sur les primes.", "rep": 1, "sources": ["Aktionnaire"], "prog": "Risque, assurance, économie du changement climatique"}, {"eyebrow": "Culture", "title": "Le cinéma veut devenir un lieu de vie", "text": ["Les entrées en France ont chuté de 14 % en 2025, puis bondi de près de 25 % en 2026. Face à cette instabilité, MK2 investit 30 M€ pour transformer son complexe BNF à Paris : 16 salles, un musée, des restaurants et un hôtel-cinéma de 55 chambres dès 2027."], "why": "En 2026, 37 % des spectateurs ont déjà participé à une animation organisée par un cinéma. 81 % des moins de 25 ans y vont au moins une fois par an, et 69 % de la génération Z se sentent seuls (TNBS) : les salles misent sur le besoin de « tiers-lieux ».", "rep": 1, "sources": ["TNBS"], "prog": "Mutations de la consommation, économie de l'expérience"}], "items": []}, {"title": "Les nouveaux marchés du numérique", "stories": [{"img": "img/2026-11-13/m_msft.jpg", "alt": "Un ordinateur portable affiche la page d'assistance de Microsoft", "credit": "Via CBC News", "eyebrow": "Panne mondiale", "title": "Microsoft 365 en panne depuis deux jours", "text": ["Depuis jeudi, Outlook, Teams, Copilot, OneDrive et la messagerie Exchange Online fonctionnent mal ou plus du tout pour des entreprises, des hôpitaux et des administrations dans plusieurs régions du monde. Pour le FT, c'est l'une des défaillances les plus graves de Microsoft depuis des années."], "why": "Vendredi matin, Microsoft faisait état d'une reprise progressive en Amérique du Nord et en Europe, sans date de retour complet. L'entreprise dit n'avoir trouvé aucune trace d'attaque et cherche encore la cause.", "rep": 1, "sources": ["FT Newswrap", "CBC (web)", "CNN (web)"], "prog": "Concentration, dépendance numérique, risque systémique"}, {"eyebrow": "IA", "title": "Vendre aux agents : l'ère du « B2A »", "text": ["Les agents d'IA génèrent 54 % du trafic web, contre 42 % en 2021. Selon Shopify, le trafic issu de l'IA a été multiplié par 8 en un an au premier trimestre 2026, et les commandes issues de recherches assistées par IA presque par 13. Chez Vercel, les mises en ligne déclenchées par des agents ont été multipliées par 28 en douze mois."], "why": "Si un même assistant gère nos achats, nos voyages et nos abonnements, il orientera d'énormes flux d'argent : un nouveau pouvoir de marché, comparable à celui des moteurs de recherche ou des plateformes (TNBS).", "rep": 1, "sources": ["TNBS"], "prog": "Économie des plateformes, pouvoir de marché, intermédiation"}, {"eyebrow": "Jeu vidéo", "title": "La Chine domine le jeu mobile", "text": ["La Chine capte 40 % des revenus des 100 plus gros jeux mobiles, contre 16,5 % pour les États-Unis, alors que les deux pays étaient au coude-à-coude il y a deux ans. Un développeur coûte 142 000 $ par an aux États-Unis, 50 000 $ à Shanghai, et le marché intérieur compte 680 millions de joueurs."], "why": "Coûts bas, marché domestique géant pour tester les produits et soutien du ministère du Commerce à l'export : un exemple d'avantage comparatif construit par l'État. Paradoxe : Pékin limite ses mineurs à 3 heures de jeu par semaine.", "rep": 1, "sources": ["TNBS"], "prog": "Avantages comparatifs, politique industrielle, commerce international"}], "items": []}], "briefs": [["Tesla et SpaceX", "Selon Bloomberg, les discussions de fusion s'accélèrent ; l'annonce pourrait venir dès le mois prochain, pour un groupe valorisé à plus de 3 400 Md$ (Aktionnaire)."], ["Obésité", "Eli Lilly devient le premier laboratoire à faire approuver une pilule contre l'obésité de type GLP-1, en Chine, devant son rival Novo Nordisk (Reuters, cité par Aktionnaire)."], ["Ukraine", "Depuis Dublin, Volodymyr Zelensky affirme que l'Europe sera à la table des prochaines négociations, alors que des émissaires américains sont arrivés en Russie."], ["Défense", "L'armée allemande cloue au sol les drones de Quantum Systems après une cyberattaque ; la start-up, valorisée 7 Md€, opère en Ukraine (FT)."], ["Start-up françaises", "22 M€ levés cette semaine en 8 opérations, selon MaddyMoney ; Gallium Defense signe la plus grosse levée, 7 M€."], ["Société", "Selon une chercheuse citée par The Friday memo, la tristesse face à l'effritement des valeurs communes est un « deuil civique », qui peut mener à un engagement démocratique quotidien."], ["Safran", "La Chine signe près de 13 Md$ de contrats avec GE Aerospace : China Eastern commande 202 moteurs LEAP-1A, conçus avec Safran, pour 101 Airbus A320neo et A321neo (Cosmos Finance)."], ["Patrimoine", "Les ménages français détenaient 6 895 Md€ de patrimoine financier au deuxième trimestre, +205 Md€ en trois mois, surtout grâce à la hausse des placements (Insee, via Cosmos Finance)."], ["Déchets", "Sept ans après la loi Agec, une mission de l'Assemblée juge le bilan des filières « pollueur-payeur » décevant : sanctions restées théoriques, prévention et réemploi à la traîne (HyperTextes)."], ["Agriculture", "Le gouvernement annonce un plan de 725 M€ pour 2027, dont 400 M€ pour les filières prioritaires et 100 M€ contre les fortes chaleurs (Cosmos Finance)."], ["Ukraine", "Selon une analyse du FT fondée sur des données de décès ayant fuité, les morts russes de la guerre devraient atteindre 650 000 à la fin de l'année."], ["Pétrole", "Le marché mondial repasse en excédent pour la première fois depuis le début de la guerre avec l'Iran, mais reconstituer les stocks prendra des mois (FT Newswrap)."]], "good": "Le cinéma garde la cote auprès des jeunes : 81 % des moins de 25 ans y vont au moins une fois par an, et les entrées en France ont rebondi de près de 25 % en 2026 après une année 2025 difficile (TNBS).", "map": {"start": "huang", "nodes": [{"id": "huang", "x": 200, "y": 34, "l": ["Démission de", "Jensen Huang"], "t": "Le choc de gouvernance", "d": "Le fondateur part après 33 ans, sans successeur désigné ; Colette Kress assure l'intérim."}, {"id": "action", "x": 100, "y": 122, "l": ["Nvidia : −14 %", "en séance"], "t": "La sanction du marché", "d": "Clôture à −4,3 % : les investisseurs rachètent, mais l'incertitude demeure."}, {"id": "chine", "x": 300, "y": 122, "l": ["Pékin dénonce des", "« récits d'espionnage »"], "t": "La dimension géopolitique", "d": "La Chine met Washington en garde contre de nouvelles restrictions technologiques."}, {"id": "secteur", "x": 100, "y": 222, "l": ["CoreWeave −9,7 %,", "Micron −4,8 %"], "t": "La contagion", "d": "Les entreprises qui dépendent des puces ou des financements de Nvidia reculent."}, {"id": "fosse", "x": 300, "y": 222, "l": ["Fossé technologique", "États-Unis–Chine"], "t": "Moins de ponts", "d": "Selon FT Opinion, le départ de Huang pourrait creuser la rupture technologique entre Washington et Pékin."}, {"id": "toile", "x": 200, "y": 322, "l": ["Une toile de", "financements croisés"], "t": "Le talon d'Achille", "d": "Nvidia investit dans ses propres clients ; moins de financements ralentirait les centres de données."}, {"id": "ipo", "x": 100, "y": 414, "l": ["IPO d'Anthropic", "6 fois sursouscrite"], "t": "La demande tient", "d": "Selon Bloomberg, l'appétit des investisseurs pour l'IA reste massif."}, {"id": "dc", "x": 300, "y": 414, "l": ["Data centers :", "revers électoral"], "t": "La contrainte politique", "d": "Les élections de mi-mandat montrent le rejet local des centres de données."}], "edges": [["huang", "action"], ["huang", "chine"], ["action", "secteur"], ["chine", "fosse"], ["secteur", "toile"], ["fosse", "toile"], ["toile", "ipo"], ["toile", "dc"]]}, "dossiers": [{"eyebrow": "Coût du travail", "title": "Les allègements de cotisations : aide à l'emploi ou « trappe à Smic » ?", "q": "La France consacre 75 Md€ par an à alléger les cotisations patronales sur les bas salaires. Le gouvernement veut en économiser 3,7 Md€, le Sénat temporise. Pourquoi ce dispositif, pensé pour l'emploi, est-il accusé de bloquer les salaires ?", "steps": [["Le point de départ", "Le coût du travail peu qualifié.", "Le Smic est élevé par rapport au salaire médian. Pour éviter qu'il ne détruise des emplois peu qualifiés, l'État réduit les cotisations patronales au niveau du Smic."], ["La dégressivité", "Une aide qui diminue avec le salaire.", "L'exonération est maximale au Smic et baisse quand le salaire augmente. Chaque hausse de salaire fait donc perdre une partie de l'aide à l'employeur."], ["La trappe", "100 € de plus coûtent 450 €.", "Selon le ministre du Travail, augmenter de 100 € par mois un salarié au Smic coûte 450 € à l'entreprise. Les employeurs ont intérêt à maintenir les salaires près du Smic : c'est la « trappe à bas salaires »."], ["Le coût public", "75 Md€ par an pour la Sécu.", "La mesure pèse sur les comptes sociaux alors que la France doit réduire son déficit. D'où l'idée de raboter 3,7 Md€ en 2027."], ["La réforme", "Une refonte d'ici le 31 mars.", "Le Sénat reporte la baisse au 1er avril (coût : 900 M€). Le gouvernement prépare une réforme « structurelle », en s'appuyant sur le rapport Bozio-Wasmer de 2024, et commence à conditionner les aides."]], "split": [["Réduire les allègements", "Ils coûtent cher, enferment les salariés au niveau du Smic et subventionnent sans contrepartie des emplois qui existeraient de toute façon ; mieux vaut réorienter l'argent vers la formation ou les salaires."], ["Les préserver", "Ils ont contribué à l'emploi peu qualifié ; les supprimer augmenterait brutalement le coût du travail, au risque de détruire des emplois au moment où le chômage remonte."]], "refs": ["<b>Antoine Bozio et Étienne Wasmer (2024).</b> Leur rapport sur les exonérations de cotisations sert de base à la réforme annoncée.", "<b>Pierre Cahuc.</b> Ses travaux montrent l'effet du coût du travail sur l'emploi des moins qualifiés.", "<b>Gary Becker, le capital humain.</b> Une trappe à bas salaires décourage l'investissement en formation.", "<b>Le dilemme équité-efficacité (Okun).</b> Toute aide ciblée crée des effets de seuil qui changent les comportements."], "accroche": "« Augmenter de 100 euros par mois un salarié qui touche le Smic, ça coûte 450 euros à l'entreprise » : en novembre 2026, le ministre du Travail résume ainsi l'effet pervers des allègements de cotisations.", "sujets": ["Faut-il baisser le coût du travail pour lutter contre le chômage ?", "Le salaire minimum est-il un obstacle à l'emploi ?", "Les politiques de l'emploi sont-elles efficaces ?"]}, {"eyebrow": "Gouvernance", "title": "Le risque de l'homme-clé : une entreprise peut-elle survivre à son fondateur ?", "q": "Nvidia vaut plus de 4 000 Md$ et dépendait d'un seul homme. Pourquoi les investisseurs paient-ils une prime pour un fondateur, et que se passe-t-il quand il tombe ?", "steps": [["Le fondateur visionnaire", "Des choix faits dix ans plus tôt.", "Pour Bernstein, la position de Nvidia vient de décisions prises par Huang il y a dix ans : « Jensen, c'est Nvidia »."], ["Le « founder mode »", "Peu de contre-pouvoirs.", "Nvidia n'avait jamais eu de président du conseil distinct du patron. Le FT y voit les risques d'une liberté totale laissée aux dirigeants."], ["La faute", "Un risque privé devenu public.", "Des liaisons, dont l'une avec une personne soupçonnée d'espionnage, transforment une affaire personnelle en risque de sécurité nationale et de réputation."], ["Le prix", "Une décote immédiate.", "Jusqu'à −14 % en séance ; Bernstein divise son objectif de cours par deux. Le marché mesure la valeur attribuée au dirigeant."], ["La transition", "Séparer les pouvoirs.", "Une PDG par intérim, un président du conseil indépendant et une recherche ouverte : le conseil reprend la main."]], "split": [["Le fondateur est irremplaçable", "La vision, les relations avec les clients et la capacité à prendre des paris risqués tiennent à une personne ; sans lui, l'entreprise perd en audace et en pouvoir de fixation des prix."], ["Les institutions comptent plus", "Une grande entreprise repose sur ses équipes, ses brevets et sa position de marché ; Apple a prospéré après Steve Jobs, et un bon conseil d'administration limite les risques d'un pouvoir personnel."]], "refs": ["<b>Max Weber.</b> L'autorité charismatique doit se « routiniser » pour survivre à son porteur.", "<b>Jensen et Meckling (1976).</b> La théorie de l'agence et le rôle du conseil dans le contrôle du dirigeant.", "<b>Joseph Schumpeter.</b> L'entrepreneur innovateur face à la bureaucratisation de la grande entreprise.", "<b>Alfred Chandler.</b> La grande entreprise moderne remplace le fondateur par une hiérarchie de managers."], "accroche": "« Jensen, c'est Nvidia » : en novembre 2026, un analyste de Bernstein résume ainsi le dilemme d'une entreprise de plus de 4 000 Md$ privée du jour au lendemain de son fondateur.", "sujets": ["L'entrepreneur est-il encore indispensable à l'innovation ?", "Qui gouverne l'entreprise ?", "La gouvernance des entreprises peut-elle prévenir les crises ?"]}, {"eyebrow": "Institutions", "title": "Référendum : la souveraineté du peuple a-t-elle des limites ?", "q": "Marine Le Pen veut faire adopter par référendum des mesures sur l'immigration et la nationalité. Le président du Conseil constitutionnel prévient que l'institution s'y opposera. Qui a le dernier mot en démocratie ?", "steps": [["Le projet", "Passer par le peuple.", "Préférence nationale, fin du droit du sol, maîtrise des flux migratoires : la candidate veut les soumettre directement aux électeurs."], ["Le précédent", "1962, de Gaulle.", "Le général avait fait adopter l'élection du président au suffrage universel par référendum (article 11), sans passer par le Parlement. Le procédé reste contesté par de nombreux juristes."], ["Le rappel", "La Constitution encadre le référendum.", "Richard Ferrand rappelle qu'un président élu ne peut pas en disposer à sa guise, et que le Conseil s'opposera à un usage contraire au texte."], ["Le conflit", "Juges contre élus.", "Les élus nationalistes réclament sa démission et l'accusent de faire de la politique. Le débat oppose souveraineté populaire et État de droit."]], "refs": ["<b>Montesquieu.</b> « Le pouvoir arrête le pouvoir » : la séparation des pouvoirs protège la liberté.", "<b>Alexis de Tocqueville.</b> La « tyrannie de la majorité », risque propre aux démocraties.", "<b>Hans Kelsen.</b> La justice constitutionnelle garantit la hiérarchie des normes.", "<b>Pierre Rosanvallon.</b> Les institutions de contrôle comme formes de la démocratie, à côté de l'élection."], "accroche": "En novembre 2026, le président du Conseil constitutionnel rappelle qu'un président élu ne peut pas disposer du référendum à sa guise, et se voit sommé de démissionner.", "sujets": ["La démocratie se réduit-elle au vote ?", "L'État de droit limite-t-il la souveraineté populaire ?", "Les institutions peuvent-elles protéger la démocratie contre elle-même ?"]}], "flash": [["33 ans", "Jensen Huang", "Durée de son mandat à la tête de Nvidia, qu'il avait cofondée en 1993."], ["−14 %", "Nvidia en séance", "Plus forte baisse de l'action jeudi, avant une clôture à −4,3 %."], ["4 000 Md$", "Capitalisation", "Seuil au-dessus duquel Nvidia a réussi à clôturer malgré le choc."], ["−9,7 %", "CoreWeave", "Chute du loueur de puces, dont Nvidia est un actionnaire imp erms"], ["FT Newswrap", "newsletter, ven. 13 (soir)", "Succession chez Nvidia, panne Microsoft, taux, BCE"], ["HyperTextes", "newsletter, ven. 13", "Taux français, loi Agec, technoférence"], ["Business Recorder (Reuters)", "web, 13 nov.", "Nvidia a approché Rene Haas"], ["Yahoo Finance", "web, 13 nov.", "Chute de l'action Arm"], ["Advisor Perspectives (Bloomberg)", "web, 13 nov.", "Semaine noire des Treasuries"], ["Zonebourse (Reuters)", "web, 12 nov.", "Paris et la succession de Lagarde"], ["Arab News", "web, 12 nov.", "Négociations Paris-Berlin pour la BCE"], ["CBC", "web, 13 nov.", "Panne Microsoft, deuxième jour"], ["CNN", "web, 12-13 nov.", "Panne Microsoft en direct"]], "ia": {"toc": "Gemini 4 Hydrogen dans l'appli gratuite, un agent open source qui fait tes démarches, et tes projets sauvegardés sur GitHub.", "intro": "Modèles, outils et projets : ce qui change dans l'IA, et ce qui sert vraiment.", "signalTitle": "L'IA sort de la fenêtre de chat", "signal": [{"img": "img/2026-11-13/ia_gemini.jpg", "alt": "Visuel d'annonce de Gemini 4 Hydrogen", "credit": "Google", "eyebrow": "Google · 12 novembre", "title": "Gemini 4 Hydrogen, le modèle que tout le monde va utiliser", "text": ["Google lance Gemini 4 Hydrogen, le modèle rapide et bon marché de sa famille Gemini 4, à côté de Carbon et Argon. Il arrive dans le sélecteur de l'appli Gemini, dans Google Search pour tous, et les comptes gratuits y ont accès quand la sélection automatique le juge adapté.", "Selon Google, il termine les tâches environ 2,5 fois plus vite que Gemini 3.8 Flash, avec quatre niveaux de réflexion. Via l'API, il coûte 1,50 $ par million de jetons en entrée et 7,50 $ en sortie, sur toute sa fenêtre d'un million de jetons."], "why": "Ce que ça change : c'est le modèle qui répondra, sans qu'on le sache, à des millions de recherches Google. Côté développeurs, il coûte plus de cinq fois moins cher en entrée que Claude Fable 5.2.", "sources": ["Blog Google (web)", "Simon Willison (web)"], "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/"}, {"img": "img/2026-11-13/m_nod.jpg", "alt": "Visuel d'annonce de Nod, l'agent personnel de n8n Labs", "credit": "n8n", "eyebrow": "n8n · open source", "title": "Nod, un agent qui fait tes démarches sur ton propre ordinateur", "text": ["n8n, l'outil d'automatisation, publie Nod en avant-première : une application pour Mac et Windows qui fait tourner un agent dans un ordinateur virtuel isolé sur ta machine, avec son propre navigateur. Exemples donnés : résilier un abonnement et demander le remboursement, surveiller un prix, télécharger chaque mois les factures de portails fournisseurs, réserver un hôtel après ton accord.", "Il se branche sur Gmail, Google Agenda, Drive ou Slack, et sur des sites sans intégration. Il peut lancer des tâches répétées. Le logiciel est gratuit et open source (licence Apache 2.0) : tu paies seulement le modèle choisi, avec une limite de dépense mensuelle."], "why": "Sa limite est la même que celle de la tâche du matin d'OFFSET : sur un portable, il s'arrête quand l'ordinateur se met en veille. n8n prévoit une version hébergée.", "sources": ["Blog n8n (web)", "The Neuron (web)"], "url": "https://blog.n8n.io/meet-nod"}, {"img": "img/2026-11-13/m_glasses.jpg", "alt": "Lunettes connectées Gentle Monster équipées de Gemini, de Google et Samsung", "credit": "Gentle Monster, Google et Samsung, via TNW", "eyebrow": "Google · Samsung · Apple", "title": "Lunettes, voiture : l'assistant quitte l'écran", "text": ["Google et Samsung ouvrent les précommandes de leurs lunettes connectées équipées de Gemini, dessinées par Warby Parker et Gentle Monster : à partir de 395 $, livraison le 10 décembre. The Verge retient la traduction en direct et des réglages pour protéger les passants filmés.", "Au même moment, Gemini Live arrive dans CarPlay : sur iPhone, on peut parler à l'assistant en voiture, mains libres, pour préparer une réunion ou passer ses e-mails er une réunion, passer en revue ses e-mails, répéter une présentation. Les échanges se retrouvent ensuite dans l'appli Gemini."}, {"k": "Développeurs", "t": "Un faux AWS gratuit sur ton ordinateur", "d": "Amazon publie AWS Emulator, un outil local et gratuit qui simule plus de 200 services AWS pour tester sans payer le cloud. Selon Amazon, tout son code a été écrit et est maintenu par des agents IA, sans relecture humaine."}], "repos": [{"name": "we-promise/sure", "stars": "14,3 k", "week": "+944 en un jour", "lang": "Ruby", "what": "Une application de finances personnelles libre et auto-hébergeable, reprise par la communauté après l'abandon du projet Maybe Finance, qui avait coûté près d'un million de dollars à développer.", "why": "Ce qu'il montre : l'alternative gratuite à une appli de budget payante, et la seconde vie d'un projet ouvert. Elle s'installe avec Docker ; regarde surtout comment le code est organisé.", "cmd": "git clone https://github.com/we-promise/sure.git"}, {"name": "backnotprop/plannotator", "stars": "10,2 k", "week": "+100 en un jour", "lang": "TypeScript", "what": "Une interface locale dans le navigateur pour annoter les plans, les pages et le code que produit ton agent, puis lui renvoyer tes remarques en un clic.", "why": "Ce qu'il apprend : rester aux commandes quand l'agent travaille. Plutôt que de tout réécrire, tu commentes son plan comme un professeur annote une copie.", "cmd": "/plugin marketplace add backnotprop/plannotator"}, {"name": "alibaba/open-code-review", "stars": "50,1 k", "week": "+206 en un jour", "lang": "Go", "what": "L'outil de revue de code d'Alibaba, qui combine des vérifications automatiques classiques et un agent IA pour commenter le code ligne par ligne.", "why": "Ce qu'il apprend : on ne confie pas tout à l'IA. Les règles fixes attrapent les erreurs sûres, le modèle s'occupe de ce qui demande du jugement.", "cmd": "git clone https://github.com/alibaba/open-code-review.git"}], "labo": {"meta": "15 minutes · ton compte GitHub est déjà relié à ce Mac", "title": "Tes projets sauvegardés sur GitHub, automatiquement", "goal": "Un historique de chaque version et une copie hors de ton Mac pour tous tes projets : si tu casses quelque chose ou perds ton ordinateur, tout se récupère. Dépôts privés, visibles de toi seul.", "steps": [{"t": "Ouvre Claude Code dans le projet", "d": "Remplace le chemin par celui du dossier à protéger.", "cmd": "cd ~/Documents/mon-projet && claude"}, {"t": "Demande la mise en place", "d": "Claude crée l'historique, écarte les fichiers sensibles et crée le dépôt privé.", "cmd": "Mets ce dossier sous git avec un .gitignore adapté (exclure .env, clés, node_modules et fichiers de plus de 50 Mo), fais un premier commit, puis crée un dépôt privé sur mon compte GitHub avec gh et pousse-le. Montre-moi ce qui a été exclu."}, {"t": "Automatise la sauvegarde", "d": "Une tâche planifiée enregistre et envoie les changements chaque soir, seulement s'il y en a. Comme toute tâche locale, elle ne tourne que si le Mac est allumé et ouvert.", "cmd": "Crée une tâche planifiée qui, chaque soir à 22 h, fait un commit daté des changements de ce dossier et le pousse sur GitHub, uniquement s'il y a des modifications."}, {"t": "Reviens en arrière quand tu veux", "d": "Pour retrouver une version précédente, il suffit de demander à Claude : « montre-moi l'historique de ce fichier et restaure la version d'hier »."}]}, "briefs": [["Compagnies aériennes", "United Airlines bloque les agents IA non autorisés : ils peuvent montrer des vols, mais c'est au client d'acheter le billet."], ["Bulle", "Michelle Bowman, gouverneure de la Fed, avertit que les investissements dans l'IA pourraient provoquer une correction des marchés, en citant la dette liée à l'IA et des valorisations gonflées."], ["Dépenses", "Selon l'indice IA de Ramp, les dépenses d'IA des entreprises américaines ont atteint un record en octobre, mais ne progressent plus que de 1,65 % sur un mois ; 1 % des entreprises pèsent 80 % des   /* Chiffres signés en rouge/vert (−6,4 %, +165 000…) */
  const SIGNED=/(^|[\s(«])([+−])\s?\d[\d   ,.]*(\s?(%|Md\$|\$|€|k|points?))?/g;
  const tint=html=>html.replace(SIGNED,(m,pre,sign)=>pre+`<span class="${sign==='+'?'up':'down'}">${m.slice(pre.length)}</span>`);
  const T=s=>tint(esc(s));
  /* Coupe un titre en lignes décalées (gauche / droite / retrait) */
  const stair=(txt,n)=>{const w=String(txt).replace(/« /g,'«\u00a0').replace(/ ([»:;?!])/g,'\u00a0$1').split(' ');n=Math.min(n||3,w.length);const per=Math.ceil(w.length/n),out=[];for(let i=0;i<w.length;i+=per)out.push(w.slice(i,i+per).join(' '));return out.map(l=>`<span>${esc(l)}</span>`).join('');};
  const cache={}; if(LATEST) cache[LATEST.date]=LATEST;
  let D=LATEST;

  const tabs=[...document.querySelectorAll('.tab')], views=[...document.querySelectorAll('.view')];
  /* position naturelle de la barre d'onglets (offsetTop d'un élément sticky suit le défilement) */
  const tabsTop=()=>$('main').offsetTop-$('nav.tabs').offsetHeight;
  function show(id){views.forEach(v=>v.hidden=v.id!==id);tabs.forEach(t=>t.setAttribute('aria-selected',t.getAttribute('aria-controls')===id));}
  tabs.forEach(t=>t.addEventListener('click',()=>{show(t.getAttribute('aria-controls'));window.scrollTo({top:tabsTop()});}));

  const fmtShort=iso=>{const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y;};
  const dayName=iso=>new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long'});
  const issueNo=iso=>{const i=[...INDEX].reverse().findIndex(x=>x.date===iso);return i<0?'—':String(i+1).padStart(3,'0');};
  const blk=(k,body,cls='')=>`<div class="g blk ${cls}">${/\bop\b/.test(cls)?fx('fall'):''}<span class="k">${k}</span><div class="body">${body}</div></div>`;
  const ix=i=>String(i+1).padStart(2,'0');
  const fx=g=>`<canvas class="fx" data-g="${g}" aria-hidden="true"></canvas>`;
  const SPK='<svg class="spk" aria-hidden="true"><rect width="100%" height="100%" filter="url(#speck)"/></svg>';
  const ph=(src,alt,lazy)=>`<div class="ph"><img src="${src}" alt="${esc(alt||'')}"${lazy?' loading="lazy"':''}><canvas class="xr" aria-hidden="true"></canvas>`;

          <defs><marker id="arrow" class="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker></defs>
          <g id="edges"></g><g id="nodes"></g></svg>
        <div class="map-note" id="mapNote" aria-live="polite"></div></div>`)}

  function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);
  }

  function calcHTML(){return `
    <div class="calc">
      <div class="l">
        <span class="k">Maths appliquées · Actualisation</span>
        <h3>Pourquoi les taux font plus mal aux valeurs de l'IA</h3>
        <div class="formula">V = Σ (t = 1…30) CF<sub>t</sub> / (1 + r)<sup>t</sup></div>
        <p class="note">Deux entreprises gagnent la même somme sur 30 ans. L'entreprise <b>mature</b> touche 10 par an dès maintenant. L'entreprise <b>IA</b> gagne peu au début puis beaucoup plus tard (croissance de 25 % par an pendant 15 ans).</p>
      </div>
      <div class="r">
        <div class="slider"><label for="rate"><span class="k">Taux d'actualisation r</span><span class="rv" id="rateV">3,0 %</span></label><input type="range" id="rate" min="1" max="9" step="0.25" value="3"></div>
        <div class="bars">
          <div class="barrow"><span class="k">Mature</span><div class="track"><div class="fill" id="barA"></div></div><span class="num" id="valA">100</span></div>
          <div class="barrow"><span class="k">IA</span><div class="track"><div class="fill ia" id="barB"></div></div><span class="num" id="valB">100</span></div>
        </div>
        <p class="note" id="calcMsg"></p>
      </div>
    </div>`;}
  function initCalc(){
    const A=Array.from({length:30},()=>10), raw=Array.from({length:30},(_,i)=>Math.pow(1.25,Math.min(i,15)));
    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);
    const f1=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
    const rate=$('#rate');
    const upd=()=>{const r=parseFloat(rate.value)/100,a=pv(A,r)/bA*100,b=pv(B,r)/bB*100,mx=Math.max(a,b,100);
      $('#rateV').textContent=f1(r*100)+' %';$('#valA').textContent=Math.round(a);$('#valB').textContent=Math.round(b);
      $('#barA').style.width=(a/mx*100)+'%';$('#barB').style.width=(b/mx*100)+'%';
      const a1=pv(A,r+.01)/pv(A,r)-1,b1=pv(B,r+.01)/pv(B,r)-1;
      $('#calcMsg').innerHTML=`Base 100 à r = 3 %. À ${f1(r*100)} %, un point de taux en plus fait perdre <b class="down">${f1(-a1*100)} %</b> à l'entreprise mature et <b class="down">${f1(-b1*100)} %</b> à l'entreprise IA. Plus les profits sont lointains, plus la valeur est sensible au taux : c'est la duration.`;};
    rate.addEventListener('input',upd);upd();
  }

        <div class="g"><div style="grid-column:1/-1"><ol>${c.parts.map(([t,sub])=>`<li><b>${esc(t)}</b><ol>${sub.map(s=>`<li><span>${T(s)}</span></li>`).join('')}</ol></li>`).join('')}</ol></div></div></div>`:''}`;

      $('#score').textContent=ok+'/'+D.quiz.length;
    };
    quiz.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.getAttribute('aria-disabled')==='true')return;st[b.dataset.q]=+b.dataset.o;save();draw();});

        l.lastPt={x,y};
        if(x<-60||y<-60||x>r.width+60||y>r.height+60||!last) return;
        let mx=x-last.x, my=y-last.y; const m=Math.hypot(mx,my);
        if(m<.5||m>200) return;
        const g=grid(l), R=110, sg=46, k=.11, ux=mx/m, uy=my/m;
        const c0=Math.max(0,Math.floor((x-R)/DC)), c1=Math.min(g.cols-1,Math.ceil((x+R)/DC));
        const r0=Math.max(0,Math.floor((y-R)/DC)), r1=Math.min(g.rows-1,Math.ceil((y+R)/DC));
        for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){
          const dx=cc*DC-x, dy=rr*DC-y, wgt=Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))*k*Math.min(m,24), i=(rr*g.cols+cc)*2;
          const side=(dx*-uy+dy*ux)/sg;          /* de quel côté de la trajectoire : la matière s'y écarte */
          let a=g.d[i]+wgt*(ux*(1-.4*side*side)-uy*side*.7), b=g.d[i+1]+wgt*(uy*(1-.4*side*side)+ux*side*.7); const n=Math.hypot(a,b);
          if(n>DMAX){a*=DMAX/n;b*=DMAX/n;}
          g.d[i]=a;g.d[i+1]=b;
        }
        g.dirty=true;l.wakeUntil=now+900;l.settle=true;
      });
      kick();
    },{passive:true});
    const R={
      bands:(l,time)=>paint(l,'bands',time,pr=>{set(pr,'uType',l.type);disp(pr,l);}),
      mast:(l,time)=>paint(l,'mast',time,pr=>disp(pr,l)),
      ascii:(l,time)=>{
        const img=l.img;
        if(!img.complete||!img.naturalWidth) return false;
        if(!l.tex){try{l.tex=texture(img);l.st=stats(img);}catch(e){l.el.style.display='none';return false;}}
        return paint(l,'ascii',time,(pr,W,H,dpr)=>{
          const cw=W/dpr<500?3.6:5, ch=cw*1.7;
          if(!l.atex||l.akey!==cw*dpr){
            const ac=document.createElement('canvas'), gw=Math.round(cw*dpr*2), gh=Math.round(ch*dpr*2), x=ac.getContext('2d');
            const font=`${Math.round(gh*.86)}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
            /* signes seulement (ni lettres ni chiffres), classés par la quantité d'encre qu'ils déposent réellement */
            const cand=[...' .,\'`:;-_~^"=+*!|/\\()[]{}<>?#%&$@'];
            ac.width=gw;ac.height=gh;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            const ink=cand.map(g=>{x.clearRect(0,0,gw,gh);x.fillText(g,gw/2,gh*.54);const d=x.getImageData(0,0,gw,gh).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return [g,s];});
            l.ramp=ink.sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
            ac.width=gw*l.ramp.length;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            l.ramp.forEach((g,i)=>x.fillText(g,gw*(i+.5),gh*.54));
            if(l.atex)gl.deleteTexture(l.atex);
            l.atex=texture(ac);l.akey=cw*dpr;
          }
          gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,l.atex);set(pr,'uAtlas',1);
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uCellPx',[cw,ch]);
          set(pr,'uN',l.ramp.length);
        });
      },
      photo:(l,time,now)=>{
        const img=l.img;
        if(l.broken||!img.complete||!img.naturalWidth) return false;
        if(!l.tex){
          try{l.tex=texture(img);l.st=l.st||stats(img);}
          catch(e){l.broken=true;l.el.style.display='none';l.ph.classList.add('raw');return false;}
        }
        const dt=l.tl?Math.min(.1,(now-l.tl)/1000):0;
        if(l.rev!==l.target){
          const s=still.matches?1:dt/1.5;
          l.rev=l.target>l.rev?Math.min(l.target,l.rev+s):Math.max(l.target,l.rev-s);
        }
        l.tl=l.rev===l.target?0:now;
        const e=l.rev*l.rev*(3-2*l.rev);
        return paint(l,'photo',time,pr=>{
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uRev',e);set(pr,'uDark',col.dark);set(pr,'uLight',col.light);
        });
      }
    };
    function frame(now){
      raf=0;
      if(!ok) return;
      const move=!still.matches, time=move?(now-t0)/1000:(t0%1e5)/1000;
      let again=false;
      layers.forEach(l=>{
        if(!l.seen) return;
        const live=l.kind==='photo'?l.rev!==l.target:move;
        const fluid=l.wakeUntil>now;     /* pendant le geste : chaque image, pour un mouvement fluide */
        if(l.dirty||fluid||(live&&(l.kind==='photo'||now-l.last>=FPS))){
          if(R[l.kind](l,time,now)!==false)l.dirty=false;
          l.last=now;
        }
        if(fluid||(l.kind==='photo'?l.rev!==l.target:move)) again=true;
      });
      if(again&&!document.hidden) raf=requestAnimationFrame(frame);
    }
    function kick(){if(!raf&&ok)raf=requestAnimationFrame(frame);}
    const io=new IntersectionObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l){l.seen=e.isIntersecting;if(l.seen)l.dirty=true;}});kick();},{rootMargin:'200px 0px'});
    const ro=new ResizeObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l)l.dirty=true;});kick();});
    const add=(el,kind,o)=>{layers.set(el,Object.assign({el,kind,seen:false,dirty:true,last:0,ctx:null},o));io.observe(el);ro.observe(el);};
    const TYPE={fall:0,band:1,rise:2};
    /* (re)branche les couches après chaque rendu ; celles retirées du DOM sont libérées */
    function scan(){
      layers.forEach((l,el)=>{
        if(el.isConnected) return;
        io.unobserve(el);ro.unobserve(el);
        [l.tex,l.atex,l.dtex].forEach(x=>x&&gl.deleteTexture(x));
        layers.delete(el);
      });
      document.querySelectorAll('canvas.fx').forEach((el,i)=>{if(!layers.has(el))add(el,'bands',{type:TYPE[el.dataset.g]||0,seed:((i+1)*.6180339)%1});});
      document.querySelectorAll('canvas.mastfx').forEach(el=>{if(!layers.has(el))add(el,'mast',{});});
      document.querySelectorAll('canvas.ascfx').forEach(el=>{
        if(layers.has(el)) return;
        const img=new Image();img.src=el.dataset.src;
        add(el,'ascii',{img});
        img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      document.querySelectorAll('.ph').forEach((ph,i)=>{
        const el=ph.querySelector('canvas.xr'), img=ph.querySelector('img');
        if(!el||layers.has(el)) return;
        add(el,'photo',{img,ph,rev:0,target:0,tl:0,seed:((i+3)*.7548777)%1});
        if(!img.complete) img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      kick();
    }
    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
  function fitStair(el){
    const W=el.clientWidth; if(!W||el._w===W) return; el._w=W;
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let k=1;
    el.querySelectorAll(':scope > span').forEach(s=>{const pad=parseFloat(getComputedStyle(s).paddingLeft)||0,text=s.scrollWidth-pad;if(text>0)k=Math.min(k,(W-pad)/text);});
    if(k<1) el.style.fontSize=(base*k*.985)+'px';
  }
  const stairRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitStair(e.target))):null;
  function fitStairs(){document.querySelectorAll('.stair').forEach(el=>{el._w=0;fitStair(el);if(stairRO)stairRO.observe(el);});}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStairs);
  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();fitStairs();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
