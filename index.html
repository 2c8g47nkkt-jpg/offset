<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<style>
/* Layout : couverture de magazine suisse (Kolt) — titre géant sur toute la largeur, sommaire en colonnes,
   titres décalés façon PIN–UP ; aucune ligne de séparation, seul le vide sépare les blocs */
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5A5A5A; --faint:#9A9A9A;
  --up:#0E8A3E; --down:#D42A1E; --riso:#FF2D1A;
  --sans:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --gx:clamp(18px,3.2vw,64px);
  --col:clamp(16px,2vw,40px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --ink:#FFFFFF; --muted:#ABABAB; --faint:#6A6A6A; --up:#34D170; --down:#FF5A4D; --riso:#FF3B26; color-scheme:dark}

*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;font-weight:500;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding-left:max(var(--gx),env(safe-area-inset-left,0px));padding-right:max(var(--gx),env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
img{display:block;width:100%;max-width:100%}
figure{margin:0}
figure img{aspect-ratio:3/2;object-fit:cover;background:var(--faint)}
.k{font-size:13px;line-height:1.35;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.s{font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)}
.credit{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;color:var(--faint);margin-top:10px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--col)}
::selection{background:var(--riso);color:#000}

/* Impression : aplats rouges, photocopie, typo machine. Purement décoratif, jamais de grain dense sous du texte */
.mono{font-family:var(--mono);font-size:11.5px;line-height:1.4;font-weight:400;text-transform:uppercase;letter-spacing:.02em}
.defs{position:absolute;width:0;height:0;overflow:hidden}
html,body{overflow-x:clip}
/* Photos : tirage photocopie par-dessus, qui s'efface au survol (ou au toucher) et laisse la couleur */
.ph{position:relative;overflow:hidden;cursor:pointer}
.ph img{filter:grayscale(1);transition:filter 1.4s ease .25s}
.ph:hover img,.ph.on img{filter:none}
/* traitement photocopie dessiné par le moteur d'encre ; sans WebGL, l'image reste en niveaux de gris */
.ph canvas.xr{position:absolute;top:0;left:0;width:100%;aspect-ratio:3/2;display:block;pointer-events:none}
.hero .ph canvas.xr{aspect-ratio:21/9}
.ink .ph:not(.raw) img{opacity:0}
/* Fonds photocopie pleine largeur : grain procédural animé (WebGL), dessiné à la résolution de l'écran */
.fx{position:absolute;left:50%;width:100vw;margin-left:-50vw;pointer-events:none;z-index:-1;display:block}
.spk{position:absolute;inset:0;width:100%;height:100%;opacity:.3;pointer-events:none}

/* Couverture */
header.cover{padding-block:clamp(20px,3vw,48px) 0}
.mast{position:relative;isolation:isolate;display:flex;flex-direction:column-reverse;gap:clamp(10px,1.2vw,20px)}
.mastfx{position:absolute;left:50%;width:100vw;margin-left:-50vw;top:calc(-1 * clamp(20px,3vw,48px));height:calc(100% + clamp(20px,3vw,48px) + clamp(28px,3vw,52px));z-index:-1;pointer-events:none;display:block}
.brand{font-size:24.4vw;font-weight:800;letter-spacing:-.075em;line-height:.78;margin-left:-.04em;white-space:nowrap;display:block}
@media (min-width:1928px){.brand{font-size:470px}}
.issue{align-self:flex-end;display:flex;gap:18px;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.toc{margin-top:clamp(28px,3vw,52px);row-gap:28px}
.toc a{grid-column:span 2;display:flex;flex-direction:column;gap:2px;color:inherit;text-decoration:none;min-width:0}
.toc a .ix{margin-bottom:8px;color:var(--muted)}
.toc a .t{font-size:13.5px;line-height:1.35;font-weight:500}
.toc a .p{font-size:13.5px;line-height:1.35;color:var(--muted)}
.toc a:hover .k{text-decoration:underline}
@media (max-width:1000px){.toc a{grid-column:span 4}}
@media (max-width:600px){.toc a{grid-column:span 6}}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:clamp(72px,8vw,140px)}
.tabbar{display:flex;gap:clamp(18px,2.4vw,44px);overflow-x:auto;scrollbar-width:none;padding-block:16px}
.tabbar::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;font-size:15px;font-weight:700;color:var(--faint);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink)}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink)}

main{padding-block:clamp(56px,6vw,110px) clamp(140px,14vw,260px)}
section.view{display:flex;flex-direction:column;gap:clamp(140px,14vw,260px)}
.view[hidden]{display:none}

/* Titres décalés (PIN–UP) */
.stair{display:flex;flex-direction:column}
.stair span{display:block;white-space:nowrap}
.stair span:nth-child(3n+2){align-self:flex-end;text-align:right}
.stair span:nth-child(3n+3){padding-left:16%}
.big{font-size:clamp(46px,9.4vw,180px);line-height:.86;letter-spacing:-.055em}
.mid{font-size:clamp(38px,6vw,112px);line-height:.88;letter-spacing:-.05em}
@media (max-width:700px){.stair span{white-space:normal}.stair span:nth-child(3n+2){align-self:auto;text-align:left;padding-left:22%}.stair span:nth-child(3n+3){padding-left:8%}}

/* Une */
.hero{display:flex;flex-direction:column;gap:clamp(36px,4vw,64px)}
.hero figure img{aspect-ratio:21/9}
/* Étiquette rouge posée sur la photo, comme une pochette de disque */
.tag{position:absolute;left:0;bottom:0;width:min(40%,560px);background:var(--riso);color:#000;padding:clamp(16px,1.6vw,26px) clamp(16px,1.6vw,26px) clamp(20px,2vw,32px);
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;z-index:1}
.tag .ln{display:flex;align-items:center;gap:10px;font-size:clamp(13px,1vw,16px);font-weight:600;line-height:1.3}
.tag .ln + .ln{margin-top:4px}
.tag .bd{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#000;flex:none}
.tag .mono{padding:1px 0}
.tag > :not(.spk){position:relative;z-index:1}
.tag > :not(.vt):not(.spk){grid-column:1}
.tag .vt{grid-column:2;grid-row:1/span 3;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;align-self:end}
@media (max-width:700px){.tag{position:static;width:100%}}
.hero .meta{row-gap:24px}
.hero .meta .k{grid-column:1/4}
.hero .lede{grid-column:7/13;font-size:clamp(18px,1.45vw,23px);line-height:1.5;font-weight:500}
@media (max-width:800px){.hero .meta .k,.hero .lede{grid-column:1/-1}}

/* Blocs */
.blk{row-gap:40px}
.blk > .k{grid-column:1/4}
.blk > .k:empty{display:none}
.blk > .body{grid-column:4/13;min-width:0}
.blk > .full{grid-column:1/-1;min-width:0}
@media (max-width:900px){.blk > .k,.blk > .body{grid-column:1/-1}}

.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px calc(var(--col)*1.6)}
.fig{container-type:inline-size;min-width:0}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:flex;flex-direction:column;gap:14px}
/* le chiffre se règle sur la largeur de sa colonne : il ne déborde jamais sur la voisine */
.fig .v{white-space:nowrap;font-size:clamp(38px,4.3vw,84px);font-size:min(84px,19.5cqw);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}

.theme{display:flex;flex-direction:column;gap:clamp(56px,6vw,104px)}
.theme-top{row-gap:20px;align-items:end}
.theme-top .tt{grid-column:1/10;display:flex;flex-direction:column;gap:clamp(20px,2vw,32px)}
.theme-top .tt .mono{color:var(--muted)}
@media (max-width:800px){.theme-top .tt{grid-column:1/-1}}
/* Passage granuleux dans le vide qui précède certains thèmes */
.theme.pass{position:relative;isolation:isolate;padding-top:clamp(140px,16vw,300px)}
.theme.pass > .fx{top:calc(-1 * clamp(140px,14vw,260px));height:calc(clamp(140px,14vw,260px) + clamp(140px,16vw,300px))}
/* Ouverture des onglets : le grain tombe de la barre d'onglets et s'éclaircit avant le texte */
.blk.op{position:relative;isolation:isolate;padding-top:clamp(220px,24vw,440px)}
.blk.op > .fx{top:calc(-1 * clamp(56px,6vw,110px));height:calc(clamp(220px,24vw,440px) + clamp(56px,6vw,110px) + 120px)}
.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(72px,7vw,120px) var(--col);align-items:start}
@media (max-width:1100px){.stories{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.stories{grid-template-columns:1fr}}
.story{display:flex;flex-direction:column;gap:16px;min-width:0}
.story figure{margin-bottom:8px}
.story h3{font-size:clamp(25px,2vw,34px);line-height:1.02;letter-spacing:-.035em}
.story p{font-size:16.5px;line-height:1.6}
.story .why{color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--faint);padding-top:4px}
.src .rep{color:var(--ink);font-weight:700}
details.more summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;text-transform:uppercase;display:inline-flex;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+"}
details.more[open] summary::after{content:"−"}
details.more summary:hover{text-decoration:underline}
details.more .inner{padding-top:20px;display:flex;flex-direction:column;gap:14px}
details.more .inner p{font-size:16px}
.prog{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--muted)}

.briefs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.briefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.briefs{grid-template-columns:1fr}}
.briefs div{display:flex;flex-direction:column;gap:4px}
.briefs span{font-size:15.5px;line-height:1.5;color:var(--muted)}
.good .body{position:relative;background:var(--riso);color:#000;padding:clamp(28px,3.4vw,64px) clamp(24px,3vw,56px) clamp(40px,5vw,96px)}
.good p{position:relative;z-index:1;font-size:clamp(22px,2.2vw,38px);line-height:1.25;letter-spacing:-.02em;font-weight:600;max-width:34ch}
.good .mono{display:block;margin-bottom:22px}

/* Colophon : la photocopie monte du bas de page */
.colo{display:flex;flex-direction:column;gap:clamp(40px,4vw,72px);padding-top:clamp(40px,4vw,72px)}
.colo .field{position:relative;overflow:hidden;isolation:isolate;height:clamp(380px,48vw,820px);display:flex;align-items:flex-end;width:100%}
.colo .fx{left:0;margin:0;width:100%;top:0;height:100%}
.colo .top{position:relative;z-index:1;row-gap:24px}
.colo .top .mono{grid-column:1/4;color:var(--muted)}
.colo .top .asc{grid-column:4/13;grid-row:2;justify-self:end;width:100%;max-width:760px;aspect-ratio:16/9;display:block;margin-top:clamp(24px,3vw,56px)}
.colo .top p{grid-column:4/11;font-size:clamp(26px,2.8vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.colo .top .sig{grid-column:1/4;grid-row:2;align-self:end;display:block;width:clamp(120px,11vw,190px);aspect-ratio:3368/1451;height:auto;color:var(--ink);overflow:visible}
@media (max-width:900px){.colo .top .mono,.colo .top p,.colo .top .asc{grid-column:1/-1}.colo .top .asc,.colo .top .sig{grid-row:auto}.colo .top .sig{grid-column:1/-1;width:132px}}
.colo .end{position:relative;z-index:1;display:flex;justify-content:flex-end}
.colo .chip{position:relative;background:var(--riso);color:#000;padding:14px 20px 16px;font-weight:600;font-size:clamp(13px,1.1vw,17px);display:flex;align-items:center;gap:12px}

/* Comprendre */
.intro{font-size:clamp(22px,2.2vw,38px);line-height:1.2;letter-spacing:-.02em;font-weight:600;max-width:30ch}
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,5vw,96px);align-items:start}
@media (max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapgrid svg{width:100%;max-width:660px;height:auto;display:block}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.node text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:700}
.node{cursor:pointer;transition:opacity .2s}
.node.on rect{fill:var(--riso);stroke:var(--riso)} .node.on text{fill:#000}
.node.dim{opacity:.22}
.edge{stroke:var(--ink);stroke-width:1;transition:opacity .2s}
.edge.on{stroke-width:2;stroke:var(--riso)}
.edge.dim{opacity:.1}
.mk path{fill:var(--ink)}
.map-note{display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
.map-note b{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.map-note p{color:var(--muted);font-size:17px}

.dossier{display:flex;flex-direction:column;gap:clamp(56px,5vw,96px)}
.dossier .top{row-gap:28px}
.dossier .top .k{grid-column:1/-1}
.dossier .top h2{grid-column:1/-1}
.dossier .top .q{grid-column:7/13;font-size:clamp(18px,1.4vw,22px);line-height:1.5;color:var(--muted)}
@media (max-width:800px){.dossier .top .q{grid-column:1/-1}}
.dossier .rest{row-gap:clamp(56px,5vw,96px)}
.dossier .rest > *{grid-column:4/13;min-width:0}
@media (max-width:900px){.dossier .rest > *{grid-column:1/-1}}
.chain{display:flex;flex-direction:column;gap:6px}
.step button.s{all:unset;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) 24px;gap:14px;width:100%;padding:16px 0;align-items:baseline}
.step button.s:focus-visible{outline:2px solid var(--ink)}
.step .n{font-family:var(--mono);font-size:12px;color:var(--faint)}
.step .t{font-size:clamp(21px,1.7vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1;display:block}
.step .d{color:var(--muted);font-size:15.5px;display:block;margin-top:6px;font-weight:500}
.step .pm{font-size:20px;font-weight:700;text-align:right}
.step .x{display:none;padding:4px 38px 26px 70px;font-size:16.5px;line-height:1.7;max-width:76ch}
.step.open .x{display:block}
.step:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (max-width:600px){.step .x{padding:4px 0 24px}.step button.s{grid-template-columns:36px minmax(0,1fr) 20px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--col)}
.split div{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.split b{color:var(--ink)}
@media (max-width:700px){.split{grid-template-columns:1fr}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:var(--col)}
.charts img{aspect-ratio:auto}
.charts .ph canvas.xr{aspect-ratio:auto;height:100%}
@media (max-width:700px){.charts{grid-template-columns:1fr}}
.refs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px var(--col)}
@media (max-width:700px){.refs{grid-template-columns:1fr}}
.refs li{color:var(--muted);font-size:15.5px;line-height:1.55}
.refs li b{color:var(--ink);font-weight:700;display:block;margin-bottom:4px}
.accroche{font-size:clamp(28px,3vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.035em;max-width:24ch}
.sujets{display:flex;flex-direction:column;gap:10px}
.sujets span:not(.k){font-size:clamp(19px,1.5vw,24px);font-weight:700;letter-spacing:-.02em}
.lab{margin-bottom:22px}

/* Calculateur */
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px var(--col)}
@media (max-width:800px){.calc{grid-template-columns:1fr}}
.calc .l,.calc .r{display:flex;flex-direction:column;gap:26px;min-width:0}
.calc h3{font-size:clamp(28px,2.6vw,44px);letter-spacing:-.04em}
.formula{font-size:17px;font-weight:700;overflow-x:auto;white-space:nowrap}
.slider{display:flex;flex-direction:column;gap:12px}
.slider label{display:flex;justify-content:space-between;align-items:baseline}
.slider .rv{font-size:clamp(48px,4.4vw,80px);font-weight:800;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;background:var(--ink);border:0;margin-top:-11px}
input[type=range]::-moz-range-thumb{width:14px;height:24px;background:var(--ink);border:0}
.bars{display:flex;flex-direction:column;gap:20px}
.barrow{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:14px;align-items:center}
.track{height:16px;position:relative;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .25s}
.fill.ia{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 6px)}
.barrow .num{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:16px}
.note b{color:var(--ink);font-weight:700}

/* Réviser */
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px var(--col)}
.fc{all:unset;cursor:pointer;padding:18px 0;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:padding .15s}
.fc:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.fc .v{font-size:clamp(40px,3.6vw,60px);font-weight:800;letter-spacing:-.055em;line-height:.9;font-variant-numeric:tabular-nums}
.fc .b{display:none;font-size:15px;line-height:1.5}
.fc:hover .k{text-decoration:underline}
.fc.flip{background:var(--riso);color:#000;padding:18px 18px}
.fc.flip .v{display:none} .fc.flip .b{display:block}
.score{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:72px}
.score .sc{font-size:clamp(64px,6vw,120px);font-weight:800;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
.btn:focus-visible{outline:2px solid var(--ink)}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:96px var(--col)}
@media (max-width:800px){.quiz{grid-template-columns:1fr}}
.qcard{display:flex;flex-direction:column;gap:18px;min-width:0}
.qq{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 0;font-size:16.5px}
.opt .kk{font-weight:800;color:var(--faint)}
.opt:hover:not([aria-disabled="true"]) span:last-child{text-decoration:underline;text-underline-offset:4px}
.opt:focus-visible{outline:2px solid var(--ink)}
.opt.ok,.opt.ok .kk{color:var(--up);font-weight:700}
.opt.ko{color:var(--down);text-decoration:line-through;text-decoration-thickness:1px}
.opt[aria-disabled="true"]{cursor:default}
.expl{color:var(--muted);font-size:15.5px}
.plan{display:flex;flex-direction:column;gap:clamp(48px,5vw,88px)}
.plan ol{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px var(--col)}
@media (max-width:900px){.plan ol{grid-template-columns:1fr}}
.plan > ol > li{counter-increment:p;display:flex;flex-direction:column;gap:12px}
.plan > ol > li::before{content:counter(p,upper-roman);font-size:clamp(48px,4vw,72px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.plan li b{font-weight:800;font-size:19px;line-height:1.3;letter-spacing:-.015em}
.plan ol ol{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.plan ol ol li{color:var(--muted);font-size:15.5px;display:grid;grid-template-columns:22px minmax(0,1fr);counter-increment:s}
.plan ol ol li::before{content:counter(s,upper-alpha);font-weight:800;color:var(--faint)}

/* Archives */
.arch{display:flex;flex-direction:column;gap:6px}
.arow{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--col);padding:14px 0;align-items:baseline}
.arow:focus-visible{outline:2px solid var(--ink)}
.arow .t{font-size:clamp(24px,2.6vw,46px);font-weight:800;letter-spacing:-.045em;line-height:1}
.arow:hover .t{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.arow:not(.cur) .t{color:var(--muted)}
@media (max-width:700px){.arow{grid-template-columns:1fr;row-gap:6px}}

/* Sources */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:12px 8px;text-align:center}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--bg);padding-left:0;font-weight:700}
thead th{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--faint);vertical-align:bottom;padding-bottom:20px}
.d1{display:inline-block;width:10px;height:10px;background:var(--ink)}
.cnt{font-size:24px;font-weight:800;letter-spacing:-.04em}
.srclist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px var(--col)}

@media (max-width:560px){.srclist{grid-template-columns:1fr}}
.srclist div{display:flex;flex-direction:column;gap:2px}
footer{font-size:12.5px;color:var(--faint);max-width:70ch}

const LATEST = {"date": "2026-11-19", "label": "Jeudi 19 novembre 2026", "period": "18 au 19 novembre", "sourcesCount": 6, "countLabel": "6 newsletters + 12 sources web", "hero": {"img": "img/2026-11-19/anthropic_nasdaq.jpg", "alt": "Des passants devant des vitrines aux noms d'Anthropic et de Morgan Stanley, à New York", "credit": "Getty Images via CNBC", "eyebrow": "À la une", "title": "Anthropic signe la plus grosse introduction en Bourse de l'histoire", "lede": "Le créateur de Claude a fixé mercredi soir son prix à 83 $ par action, au-dessus de la fourchette prévue (70 à 78 $). Face à une demande plus de six fois supérieure à l'offre, il a porté le nombre d'actions vendues de 825 à 980 millions et lève 81,3 Md$, davantage que SpaceX en juin (CNBC). La valorisation atteint environ 1 500 Md$ sur une base entièrement diluée. Première cotation ce jeudi sur le Nasdaq, sous le symbole ANT. Un test pour toute l'IA, au moment où la BCE compare l'endettement du secteur à la bulle des subprimes."}, "brief": [["Anthropic", "Prix fixé à 83 $, 81,3 Md$ levés, record mondial ; la cotation commence ce jeudi sur le Nasdaq."], ["BCE", "Sa revue de stabilité financière voit des « parallèles historiques » entre la dette de l'IA et les bulles internet et subprimes."], ["Shenzhen", "Xi Jinping accueille Donald Trump d'une accolade ; premier sommet à trois avec Vladimir Putin ce jeudi."], ["France", "Roland Lescure juge l'objectif de 1 % de croissance en 2027 « à risque » ; Bruxelles ne prévoit que 0,6 %."], ["GTA VI", "Le jeu le plus cher de l'histoire sort ce jeudi, avec des recettes de lancement comparables à un très gros film."]], "figures": [{"v": "81,3 Md$", "l": "levés par Anthropic, plus grosse introduction en Bourse jamais réalisée (CNBC)", "dir": "up"}, {"v": "+1 200 %", "l": "hausse du chiffre d'affaires d'Anthropic sur neuf mois, à 33,24 Md$ (CNBC)", "dir": "up"}, {"v": "−12 Md$", "l": "recul de la valeur des stablecoins en trente jours (The Next Big Sh*t)", "dir": "down"}, {"v": "3,6 %", "l": "inflation britannique en octobre, au plus haut depuis un an (FT)", "dir": "up"}], "themes": [{"title": "Le jour des records : Anthropic et GTA VI", "stories": [{"img": "img/2026-11-19/anthropic_logo.jpg", "alt": "Le logo d'Anthropic en lettres noires éclairé par un projecteur", "credit": "Carlos Barria / Reuters via Aktionnaire", "eyebrow": "Introduction en Bourse", "title": "Une offre agrandie, un prix relevé", "text": ["Anthropic vend 980 millions d'actions à 83 $, dont environ 956 millions de titres nouveaux ; le reste est cédé par des actionnaires existants, dont les sept cofondateurs. Les banques disposent en plus d'une option de 30 jours sur 147 millions d'actions (Anthropic). S'y ajoute un placement privé de 26 Md$ au prix d'introduction, souscrit notamment par Google, Microsoft, Nvidia et AMD (CNBC).", "SpaceX avait levé 75 Md$ en juin, 85,7 Md$ avec l'option de surallocation. Selon Cosmos Finance, jusqu'à 20 % des actions pourraient revenir aux particuliers, une part inhabituelle pour une opération de cette taille."], "why": "Ce que les investisseurs achètent, c'est une croissance : 33,24 Md$ de chiffre d'affaires sur neuf mois, +1 200 % sur un an, et un rythme annualisé d'environ 81 Md$ fin octobre. Mais Anthropic affiche une perte nette de 104 Md$ sur la période, surtout liée à la réévaluation de dettes convertibles, et a dépensé 18,8 Md$ en calcul, soit 57 % de ses revenus (Cosmos Finance). Le FT rappelle que les dix plus grosses introductions de l'année ont perdu un cinquième de leur valeur depuis.", "rep": 5, "sources": ["Aktionnaire", "Cosmos Finance", "myFT Daily Digest", "FT Newswrap", "The Next Big Sh*t", "CNBC (web)", "Anthropic (web)"], "more": ["<b>Le contrôle.</b> Les cofondateurs, dont Dario et Daniela Amodei, conservent 50,1 % des droits de vote sans détenir 50,1 % du capital ; Amazon garderait environ 15 % du capital économique, Google 14 % (Cosmos Finance).", "<b>Les gagnants.</b> Une poignée de fonds de capital-risque se partagent plus de 100 Md$ de plus-values ; l'investisseur Anjney Midha a multiplié sa mise par plus de 2 000 depuis 2021 (FT).", "<b>Les regrets.</b> Masayoshi Son parle d'une « erreur » de SoftBank, qui a préféré OpenAI ; Sam Bankman-Fried, contraint de céder sa participation en 2024, aurait détenu 40 Md$ (FT).", "<b>Les engagements.</b> Plus de 900 Md$ de contrats d'infrastructure signés sur vingt ans, dont une large part pour Anthropic Direct, ses propres puces dans des centres de données à ses spécifications (FT)."], "prog": "Marché primaire, financement des entreprises, gouvernance et droits de vote"}, {"img": "img/2026-11-19/gta.jpg", "alt": "Une affiche de GTA VI montrant les deux personnages principaux, devant laquelle passe une silhouette floue", "credit": "AFP via Aktionnaire", "eyebrow": "Industries culturelles", "title": "GTA VI, un jeu au budget de superproduction", "text": ["Après treize ans d'attente, GTA VI sort ce jeudi. Selon Bloomberg, cité par Aktionnaire, son développement aurait coûté plus d'un milliard de dollars ; Cosmos Finance évoque un budget de 1,5 à 2 Md$. Environ 4 700 personnes y ont travaillé.", "Les estimations de précommandes divergent : 12 millions et environ 1,65 Md$ de revenus pour Aktionnaire, plus de 15 millions pour Cosmos Finance. Le cabinet Omdia attend 3,2 Md$ de ventes la première année. Take-Two, la maison mère de Rockstar, n'a donné aucun chiffre, son PDG se disant seulement bien au-dessus de ses attentes (Game Developer)."], "why": "Le jeu vidéo fonctionne comme le cinéma à gros budget : des coûts fixes énormes, un coût marginal presque nul par copie vendue, donc une rentabilité qui dépend des volumes. La vraie rente viendra ensuite : les achats dans le jeu ont représenté 78 % des ventes de Take-Two l'an dernier (Aktionnaire). Plusieurs studios ont décalé leurs sorties pour éviter la concurrence.", "rep": 2, "sources": ["Aktionnaire", "Cosmos Finance", "Game Developer (web)"], "more": ["<b>Le précédent.</b> GTA V s'est vendu à environ 235 millions d'exemplaires et a rapporté près de 11 Md$ (Aktionnaire).", "<b>Les risques.</b> Les tentatives d'hameçonnage liées au jeu ont bondi de 1 300 % depuis août, selon Aktionnaire."], "prog": "Économies d'échelle, coûts fixes, concurrence monopolistique"}]}, {"title": "Finance : la dette de l'IA sous surveillance", "stories": [{"img": "img/2026-11-19/lagarde.jpg", "alt": "Christine Lagarde, présidente de la BCE, s'exprime à une tribune", "credit": "Getty Images via Fortune", "eyebrow": "Stabilité financière", "title": "La BCE compare l'emballement de l'IA aux subprimes", "text": ["Dans sa revue de stabilité financière publiée mercredi, la BCE estime que le basculement rapide de l'IA vers le financement par la dette présente des « parallèles historiques » avec les bulles internet et subprimes.", "Le point central : les engagements hors bilan des géants de la tech. Ils louent des centres de données et des puces appartenant à d'autres, qui empruntent à leur tour auprès de banques, d'investisseurs obligataires ou de fonds de dette privée en s'appuyant sur ces loyers. La BCE estime ces engagements à plus de 4 000 Md$ au deuxième trimestre 2026, bien au-delà des dettes inscrites au bilan (BCE)."], "why": "Ces contrats ressemblent économiquement à de la dette, mais les normes comptables américaines ne les enregistrent pas comme telle. Si les profits déçoivent, la charge reviendrait progressivement au bilan, dégradant endettement et notations. Le parallèle avec 2008 tient à cette opacité, pas à la taille : pour l'instant, les résultats des grands groupes répondent aux attentes, note la BCE.", "rep": 2, "sources": ["myFT Daily Digest", "FT Newswrap", "BCE (web)", "Fortune (web)"], "more": ["<b>Le financement circulaire.</b> Selon le vice-président Boris Vujčić, quand fournisseurs et clients se financent mutuellement, la demande réelle devient difficile à mesurer.", "<b>Un détail.</b> Les équipes de la BCE ont utilisé un agent d'IA pour extraire les chiffres des documents déposés auprès de la SEC."], "prog": "Crises financières, risque systémique, hors bilan"}, {"img": "img/2026-11-19/nsa.jpg", "alt": "Le panneau d'entrée du siège de la NSA et du Cyber Command américain à Fort Meade", "credit": "Via Gizmodo", "eyebrow": "Cybersécurité", "title": "Trop de failles trouvées, trop vite corrigées", "text": ["Des responsables américains et des experts estiment que la course à la correction des failles découvertes par l'IA a probablement déstabilisé les systèmes de Microsoft, JPMorgan, de l'aviation civile et d'autres, à l'origine d'une vague de pannes (FT).", "Le directeur du renseignement national, Jay Clayton, a attribué les perturbations à des « opérations de maintenance et des changements techniques », pas à des pirates. Microsoft et JPMorgan évoquent chacun un bogue logiciel, sans faire de lien avec l'IA (Gizmodo)."], "why": "L'IA accélère la découverte de vulnérabilités plus vite que les entreprises ne peuvent tester leurs correctifs. Au Royaume-Uni, les régulateurs demandent aux entreprises de la City de renforcer leurs défenses, après une hausse des tentatives de piratage et un vol de 6 Md$ sur la plateforme Binance (FT).", "rep": 2, "sources": ["myFT Daily Digest", "FT Newswrap", "Gizmodo (web)"], "prog": "Risque opérationnel, infrastructures critiques"}, {"eyebrow": "Cryptomonnaies", "title": "Les stablecoins ne servent plus de refuge", "text": ["La valeur totale des stablecoins, ces cryptomonnaies conçues pour garder une valeur stable, a reculé d'environ 12 Md$ en trente jours, la contraction la plus rapide depuis l'effondrement de Terra-Luna en 2022. Le bitcoin a perdu plus de 20 % en un mois (The Next Big Sh*t)."], "why": "La newsletter avance deux explications : des placements obligataires mieux rémunérés quand les taux montent, et l'attrait des grandes introductions en Bourse, SpaceX puis Anthropic. Les investisseurs vendent leurs cryptos pour acheter des actions : moins de liquidités sur les plateformes, donc une pression à la baisse sur les prix.", "rep": 1, "sources": ["The Next Big Sh*t"], "prog": "Monnaie, actifs spéculatifs, arbitrage de portefeuille"}, {"eyebrow": "Nvidia", "title": "Après Huang, Nvidia rassure ses salariés et lâche la Chine", "text": ["La PDG par intérim, Colette Kress, a avancé à décembre les hausses de salaire et attributions d'actions prévues au printemps, pour retenir les quelque 49 000 salariés (Aktionnaire). L'action a pourtant reculé de près de 3 % malgré des résultats records.", "Kress a aussi indiqué qu'aucune nouvelle livraison de puces Hopper sous licence n'est prévue vers la Chine, après 2,4 Md$ de ventes chinoises au trimestre (The Verge, via The Neuron)."], "why": "Le conseil d'administration exclut le retour de Jensen Huang, qui manœuvrerait pour revenir selon le FT. Le départ d'un fondateur pose un problème classique : une partie de la valeur d'une entreprise tient à la confiance dans son dirigeant.", "rep": 3, "sources": ["Aktionnaire", "myFT Daily Digest", "FT Newswrap", "The Neuron (web)"], "prog": "Gouvernance, capital humain, rivalité sino-américaine"}]}, {"title": "Géopolitique : Shenzhen et l'Europe", "stories": [{"img": "img/2026-11-19/trump_xi.jpg", "alt": "Donald Trump souriant aux côtés de Xi Jinping devant les drapeaux chinois et américain", "credit": "Reuters via Al Jazeera", "eyebrow": "APEC", "title": "Une accolade, puis un sommet à trois", "text": ["Xi Jinping a accueilli Donald Trump d'une accolade à Shenzhen, où se tient le forum de l'APEC, un geste qu'il réserve d'habitude à Vladimir Putin (Aktionnaire). Les trois dirigeants tiennent ce jeudi leur premier sommet à trois.", "Au programme selon Al Jazeera : un traité nucléaire et la guerre menée par les États-Unis contre l'Iran ; l'Ukraine ne devrait pas être abordée. Xi devrait aussi demander à Trump de ne pas durcir l'accès de la Chine aux puces américaines."], "why": "Devant des patrons réunis en Chine, Putin a défendu un « grand partenariat eurasien » et affirmé que les sanctions nuisaient surtout aux Occidentaux. Le comité éditorial du FT dénonce ses « illusions d'un nouveau Yalta ». Pour Pékin, l'enjeu est de se montrer en organisateur de l'ordre international.", "rep": 3, "sources": ["Aktionnaire", "myFT Daily Digest", "FT Newswrap", "Al Jazeera (web)"], "more": ["<b>À suivre.</b> L'issue du sommet n'est pas connue au moment de la publication."], "prog": "Relations internationales, puissance, multilatéralisme"}, {"eyebrow": "Union européenne", "title": "Un nouveau prêt de 45 Md€ à l'Ukraine", "text": ["Bruxelles propose un nouveau prêt de 45 Md€ à l'Ukraine, financé par un emprunt commun (Aktionnaire). Selon le FT, la Commission compte utiliser les profits tirés des avoirs russes gelés pour en payer les intérêts.", "Ce prêt s'ajouterait au programme de 90 Md€ déjà adopté pour 2026 et 2027, dont il serait distinct (Kyiv Independent)."], "why": "L'Union contourne la question de la confiscation des quelque 200 Md€ d'avoirs russes immobilisés, à laquelle la Belgique s'était opposée en 2025 : elle en mobilise les revenus, pas le capital. L'emprunt commun prolonge la logique ouverte par le plan de relance de 2020.", "rep": 2, "sources": ["Aktionnaire", "myFT Daily Digest", "Kyiv Independent (web)"], "prog": "Construction européenne, budget de l'UE, sanctions"}, {"eyebrow": "Commerce", "title": "Londres refuse d'aligner ses droits de douane sur Bruxelles", "text": ["Le Royaume-Uni va résister à la demande de l'UE d'appliquer les mêmes droits de douane que les Vingt-Sept sur les produits chinois. Il réduit ainsi ses chances de bénéficier des règles « Made in Europe » sur les subventions et marchés publics (FT).", "De son côté, l'UE envisage d'exclure les entreprises chinoises qui enfreignent ses règles sur les subventions."], "why": "Sans alignement, les produits chinois pourraient entrer au Royaume-Uni puis être réexportés vers l'UE : c'est le risque de détournement de trafic. Londres doit choisir entre autonomie commerciale et accès au marché européen.", "rep": 2, "sources": ["myFT Daily Digest", "FT Newswrap"], "prog": "Politique commerciale, protectionnisme, intégration régionale"}]}, {"title": "France : croissance en berne, campagne lancée", "stories": [{"eyebrow": "Finances publiques", "title": "L'objectif de 1 % de croissance vacille", "text": ["Roland Lescure reconnaît que l'objectif de 1 % de croissance en 2027 est « à risque ». La Commission européenne ne prévoit plus que 0,6 %, et 43 Md€ d'efforts budgétaires pourraient ne plus suffire pour ramener le déficit à 5 % du PIB (Cosmos Finance).", "Dans ses prévisions d'automne, Bruxelles anticipe 0,4 % de croissance en 2026 puis 0,6 % en 2027, soit la plus faible de la zone euro l'an prochain ; au printemps, elle attendait 0,8 % puis 1,1 % (Le Petit Journal)."], "why": "Une croissance plus faible réduit mécaniquement les recettes fiscales : le déficit se creuse sans qu'aucune dépense n'augmente. Le ministre évoque des mesures supplémentaires, au risque de peser encore sur l'activité : c'est le dilemme de la consolidation budgétaire en période de ralentissement.", "rep": 2, "sources": ["Cosmos Finance", "The Next Big Sh*t", "Le Petit Journal (web)"], "more": ["<b>L'impôt sur le revenu.</b> Seuls 47,7 % des foyers fiscaux le paient ; il a rapporté 92,6 Md€ en 2025, et les 10 % les plus aisés en acquittent 73 % (Cosmos Finance, d'après la DGFiP)."], "prog": "Politique budgétaire, déficit, multiplicateur"}, {"eyebrow": "Présidentielle", "title": "Édouard Philippe détaille un programme d'économies", "text": ["Édouard Philippe veut fusionner ou supprimer « une trentaine d'agences de l'État », privatiser France Travail et porter l'âge de départ à la retraite à 65 ans. Il promet 20 % de hausse de salaire aux enseignants, 30 000 places de prison supplémentaires et des sanctions contre les « parents perturbateurs » (Aktionnaire)."], "why": "Le programme combine une offre de réduction de la dépense publique et un réinvestissement ciblé dans l'école. Le recul de l'âge de départ reste le levier le plus puissant sur les comptes sociaux, mais aussi le plus contesté.", "rep": 1, "sources": ["Aktionnaire"], "prog": "État-providence, retraites, finances publiques"}, {"img": "img/2026-11-19/melenchon.jpg", "alt": "Jean-Luc Mélenchon, le poing levé, s'exprime derrière un pupitre", "credit": "Stéphane Lemouton / SIPA via Aktionnaire", "eyebrow": "Patronat", "title": "Mélenchon dîne avec treize grands patrons", "text": ["Le leader insoumis a dîné mardi avec treize dirigeants, dont Bernard Arnault (LVMH), Patrick Pouyanné (TotalEnergies) et Alexandre Bompard (Carrefour), à l'invitation du Club Entreprise et Cité. Les échanges ont été cordiaux, mais « personne n'a changé d'avis », selon un participant cité par Les Échos (Aktionnaire)."], "why": "À l'approche de la présidentielle, les grandes entreprises cherchent à évaluer tous les candidats susceptibles de gouverner. Le dialogue n'efface pas les divergences de fond sur la fiscalité et la redistribution.", "rep": 1, "sources": ["Aktionnaire"], "prog": "Groupes d'intérêt, vie politique"}]}, {"title": "Prix, énergie, climat", "stories": [{"eyebrow": "Royaume-Uni", "title": "L'inflation britannique remonte à 3,6 %", "text": ["L'inflation a atteint 3,6 % en octobre, au plus haut depuis un an, tirée par l'essence. Le plafond des factures d'énergie devrait augmenter de 26 % en janvier, à plus de 2 000 £ par an (FT).", "Avec moins d'aides publiques, les ménages paieraient leur énergie plus cher, en termes réels, que lors du choc inflationniste lié à la guerre en Ukraine."], "why": "Ces chiffres accentuent la pression sur la Banque d'Angleterre pour relever encore ses taux. C'est un exemple d'inflation importée par l'énergie : la banque centrale doit éviter qu'elle se diffuse aux salaires et aux autres prix.", "rep": 2, "sources": ["myFT Daily Digest", "FT Newswrap"], "prog": "Inflation, politique monétaire, choc d'offre"}, {"eyebrow": "Allemagne", "title": "Berlin allège la facture énergétique", "text": ["L'Allemagne va supprimer presque toutes les taxes sur l'électricité au 1er janvier, pour 5,4 Md€, et plafonner les prix des carburants pendant trois mois (Aktionnaire).", "Un rabais fiscal de 17 centimes par litre de carburant s'applique déjà d'octobre à décembre, et le gouvernement fédéral négocie avec le secteur pétrolier un plafonnement temporaire des prix au plus tard au 1er janvier 2027 (gouvernement fédéral)."], "why": "Le plafonnement protège le pouvoir d'achat mais affaiblit le signal-prix qui incite à économiser l'énergie. La ministre de l'Économie, Katherina Reiche, avertit des risques pour les raffineries si le plafond est trop bas.", "rep": 1, "sources": ["Aktionnaire", "Gouvernement fédéral allemand (web)"], "prog": "Fiscalité de l'énergie, contrôle des prix"}, {"eyebrow": "Climat", "title": "Martin Wolf : « pessimisme de l'intelligence, optimisme de la volonté »", "text": ["Pour Martin Wolf, l'humanité excelle dans l'innovation mais échoue face aux défis politiques mondiaux. Le solaire et l'électrification ont fait des progrès remarquables, mais approcher l'objectif de 1,5 °C exigera des politiques qui feront des perdants (FT Opinion).", "À la COP31, l'Arabie saoudite multiplie les blocages, notamment contre un objectif d'électrification (FT)."], "why": "L'argument central de Wolf est un calcul coûts-bénéfices : les efforts d'atténuation sont lourds, mais bien moins que les coûts d'adaptation sur la trajectoire actuelle. Le climat reste un bien commun mondial où chaque pays a intérêt à laisser les autres agir.", "rep": 3, "sources": ["FT Opinion", "myFT Daily Digest", "FT Newswrap"], "prog": "Externalités, biens communs, négociations climatiques"}]}], "briefs": [["BCE", "L'Espagnol Pablo Hernández de Cos devient le favori pour succéder à Christine Lagarde, avec le soutien de Paris et Berlin (FT) ; l'Allemagne viserait en échange le poste d'économiste en chef (Euronews)."], ["Audit", "KPMG a fait examiner les comptes d'une société du FTSE 250 par des agents d'IA, qui ont posé de « meilleures questions » que ses auditeurs, avec toutefois une intervention humaine nécessaire (FT)."], ["Cybersécurité", "Palo Alto Networks rachète Applied Compute, jeune pousse d'IA fondée en 2025, pour 4,5 Md$ ; sa valorisation a été multipliée par 45 depuis ses débuts (Aktionnaire)."], ["Patrons", "Francesco Milleri (EssilorLuxottica) a perçu 33,3 M€ en 2025 ; les patrons du CAC 40 gagnent en moyenne 7,5 M€, 91 fois le salaire moyen de leurs salariés (Cosmos Finance)."], ["Universités", "Les nouvelles inscriptions d'étudiants étrangers aux États-Unis chutent de 18 % en 2025-2026 (The Next Big Sh*t)."], ["Médias", "Le groupe Figaro signe un accord avec OpenAI, troisième groupe de presse français après Le Monde et les médias de LVMH (Aktionnaire)."]], "good": "Aux États-Unis, les salons de coiffure sont de plus en plus reconnus comme relais de santé publique : ils permettent d'atteindre les hommes noirs dans un lieu et des relations qui font déjà partie de leur quotidien (FT Newswrap).", "map": {"start": "ia", "nodes": [{"id": "ia", "x": 200, "y": 34, "l": ["Boom des", "investissements IA"], "t": "Le moteur", "d": "Centres de données, puces et modèles absorbent des centaines de milliards."}, {"id": "ipo", "x": 100, "y": 122, "l": ["Introduction", "d'Anthropic"], "t": "Le marché", "d": "81,3 Md$ levés à 83 $ par action, record mondial."}, {"id": "dette", "x": 300, "y": 122, "l": ["Engagements", "hors bilan"], "t": "Le financement", "d": "Plus de 4 000 Md$ de contrats de location, financés par la dette."}, {"id": "crypto", "x": 100, "y": 222, "l": ["Capitaux retirés", "des cryptos"], "t": "Les arbitrages", "d": "Stablecoins −12 Md$ en un mois ; les épargnants préfèrent les actions."}, {"id": "bce", "x": 300, "y": 222, "l": ["Alerte", "de la BCE"], "t": "Le diagnostic", "d": "Parallèles avec les bulles internet et subprimes."}, {"id": "failles", "x": 100, "y": 322, "l": ["Failles trouvées", "par l'IA"], "t": "L'effet secondaire", "d": "Les correctifs en série déstabilisent les systèmes."}, {"id": "pannes", "x": 300, "y": 322, "l": ["Pannes en", "série"], "t": "Les incidents", "d": "Microsoft, JPMorgan, aviation civile touchés."}, {"id": "regul", "x": 200, "y": 414, "l": ["Régulateurs", "en alerte"], "t": "La réponse", "d": "BCE et autorités britanniques exigent plus de prudence."}], "edges": [["ia", "ipo"], ["ia", "dette"], ["ipo", "crypto"], ["dette", "bce"], ["ia", "failles"], ["failles", "pannes"], ["pannes", "regul"], ["bce", "regul"]]}, "dossiers": [{"eyebrow": "Valorisation", "title": "Combien vaut une entreprise qui perd de l'argent ?", "q": "Anthropic affiche une perte nette de 104 Md$ sur neuf mois, mais le marché la valorise environ 1 500 Md$. Comment justifier un tel écart ?", "steps": [["Le principe", "La valeur des profits futurs.", "Une action vaut la somme actualisée des flux qu'elle rapportera. Les pertes d'aujourd'hui comptent peu si les profits de demain sont énormes."], ["La croissance", "Un chiffre d'affaires multiplié par 13.", "33,24 Md$ sur neuf mois, +1 200 % sur un an, et un rythme annualisé d'environ 81 Md$ fin octobre (CNBC)."], ["Les coûts", "Un calcul très cher.", "18,8 Md$ de dépenses de calcul sur la période, environ 57 % du chiffre d'affaires (Cosmos Finance)."], ["L'actualisation", "Le rôle des taux.", "Plus les profits sont lointains, plus leur valeur actuelle est sensible au taux d'intérêt : une hausse des taux pèse lourd."], ["Le verdict", "Le marché tranche.", "Le prix d'introduction mesure la confiance du jour ; le cours dira si elle tient, alors que les grosses introductions de l'année ont perdu un cinquième de leur valeur."]], "calc": true, "refs": ["<b>Irving Fisher (1930).</b> La valeur d'un actif est la valeur actualisée de ses revenus futurs.", "<b>Myron Gordon.</b> Modèle de croissance des dividendes : le prix dépend de l'écart entre taux d'actualisation et taux de croissance.", "<b>Joseph Schumpeter.</b> Le profit de l'innovateur est une rente temporaire, que la concurrence finit par éroder.", "<b>Robert Shiller.</b> L'« exubérance irrationnelle » : les récits peuvent pousser les prix au-delà des fondamentaux."], "accroche": "Le 19 novembre 2026, Anthropic entre en Bourse valorisée environ 1 500 Md$, alors qu'elle a perdu 104 Md$ en neuf mois.", "sujets": ["Les marchés financiers évaluent-ils correctement l'innovation ?", "Faut-il craindre les bulles financières ?", "Le taux d'intérêt est-il le prix du temps ?"]}, {"eyebrow": "Crises financières", "title": "La dette de l'IA, nouvelle bulle des subprimes ?", "q": "La BCE voit des « parallèles historiques » entre l'endettement lié à l'IA et la crise de 2008. La comparaison tient-elle ?", "steps": [["L'investissement", "Des besoins colossaux.", "Les géants de la tech et les laboratoires d'IA financent centres de données et puces sur des décennies."], ["Le montage", "Louer plutôt qu'acheter.", "Ils louent des capacités à des tiers, qui empruntent en s'appuyant sur ces loyers : la dette ne figure pas à leur bilan."], ["L'ampleur", "Plus de 4 000 Md$.", "C'est l'estimation de la BCE des engagements hors bilan au deuxième trimestre 2026."], ["Le risque", "Le retour au bilan.", "Si les profits déçoivent, les engagements reviennent au bilan, l'endettement grimpe et les notations baissent."], ["La contagion", "Qui porte la perte ?", "Banques, investisseurs obligataires et fonds de dette privée, donc aussi assureurs et fonds de pension."]], "split": [["Une comparaison justifiée", "Comme en 2008, le risque est dispersé, opaque et sorti des bilans ; le financement circulaire rend la demande réelle difficile à mesurer."], ["Une comparaison exagérée", "Les emprunteurs sont des groupes très rentables, dont les résultats répondent aux attentes, et non des ménages insolvables ; l'effet de levier reste plus faible."]], "refs": ["<b>Hyman Minsky.</b> L'instabilité financière : la stabilité encourage la prise de risque et le passage à des financements de plus en plus fragiles.", "<b>Charles Kindleberger.</b> Manias, Panics and Crashes : le cycle déplacement, euphorie, détresse, krach.", "<b>Carmen Reinhart et Kenneth Rogoff (2009).</b> « Cette fois, c'est différent » : chaque bulle se croit unique.", "<b>Carlota Perez.</b> Les révolutions technologiques passent par une phase de bulle financière avant leur déploiement."], "accroche": "Le 18 novembre 2026, la BCE estime que les engagements hors bilan des géants de la tech dépassent 4 000 Md$ et y voit des parallèles avec les subprimes.", "sujets": ["Les crises financières sont-elles inévitables ?", "Faut-il réguler la finance de l'innovation ?", "L'endettement est-il un moteur de la croissance ?"]}, {"eyebrow": "Finances publiques", "title": "Peut-on réduire le déficit quand la croissance ralentit ?", "q": "La Commission ne prévoit que 0,6 % de croissance en France en 2027, contre 1 % dans le budget. Faut-il quand même tenir l'objectif de déficit ?", "steps": [["Le constat", "Une prévision trop optimiste.", "Le gouvernement table sur 1 % en 2027, Bruxelles sur 0,6 %, la plus faible de la zone euro."], ["La mécanique", "Moins de croissance, moins de recettes.", "Les impôts suivent l'activité : le déficit se creuse sans hausse des dépenses."], ["Le dilemme", "Ajuster ou attendre ?", "Des économies supplémentaires réduisent le déficit mais pèsent sur une activité déjà faible."], ["L'enjeu", "La dette et les taux.", "Si le taux d'intérêt sur la dette dépasse la croissance, la dette augmente d'elle-même : c'est l'effet « boule de neige »."]], "split": [["Tenir l'objectif", "La crédibilité budgétaire protège des hausses de taux et respecte les engagements européens."], ["Lisser l'effort", "Une austérité trop rapide en période de ralentissement peut réduire la croissance au point d'aggraver le ratio dette/PIB."]], "refs": ["<b>John Maynard Keynes.</b> Le multiplicateur : la dépense publique soutient l'activité en période de sous-emploi.", "<b>Olivier Blanchard nques se dégagent des agents d'IA.", "intro": "Modèles, outils et projets : ce qui change dans l'IA, et ce qui sert vraiment.", "signalTitle": "Un labo d'IA en Bourse, un nouveau Gemini, et les banques qui se protègent", "signal": [{"img": "img/2026-11-19/anthropic_logo.jpg", "alt": "Le logo d'Anthropic en lettres noires éclairé par un projecteur", "credit": "Carlos Barria / Reuters via Aktionnaire", "eyebrow": "Anthropic · industrie", "title": "Le premier laboratoire de modèles de pointe coté en Bourse", "text": ["Anthropic a vendu 980 millions d'actions à 83 $ et commence à coter ce jeudi sur le Nasdaq, sous le symbole ANT. La société émet environ 956 millions de titres nouveaux ; le reste est cédé par des actionnaires existants. L'opération doit être finalisée le 20 novembre (Anthropic).", "Selon CNBC, Claude Code a été le principal moteur de la croissance de 2026. Le prospectus compte plus de 90 pages de facteurs de risque."], "why": "C'est la première fois qu'un laboratoire de modèles de pointe publie ses comptes et se soumet aux exigences des marchés : publication trimestrielle des résultats, pression sur la rentabilité, transparence sur les coûts de calcul. OpenAI a déposé un dossier confidentiel et vise une cotation en 2027, selon CNBC.", "sources": ["Anthropic (web)", "CNBC (web)"], "url": "https://www.anthropic.com/news/anthropic-prices-initial-public-offering"}, {"img": "img/2026-11-19/ia_gemini.jpg", "alt": "Le nom Gemini 4 Neon écrit en néon orange sur fond noir", "credit": "Google", "eyebrow": "Google · modèles", "title": "Gemini 4 Neon, le milieu de gamme qui vise le code", "text": ["Google a présenté mercredi Gemini 4 Neon, positionné entre Gemini 4 Carbon, pour les projets les plus longs, et Gemini 4 Hydrogen, pour l'exécution rapide. Il dispose d'un contexte d'un million de jetons et coûte 3 $ par million de jetons en entrée et 15 $ en sortie.", "Il est accessible dans l'appli Gemini pour les abonnés Google AI Pro et Ultra, dans l'outil de code Antigravity pour ces mêmes abonnés, et par l'API payante. Aucune offre gratuite n'est mentionnée."], "why": "Selon Google, Neon arrive en tête de l'indice de code agentique d'Artificial Analysis (58,6) et troisième de son indice général. Ces classements sont fournis par Google : à vérifier sur ses propres tâches. Le prix est inférieur à celui de GPT-6.2 Astra (8 $ et 40 $).", "sources": ["Google (web)", "The Neuron (web)"], "url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-neon/"}, {"eyebrow": "Banques · agents", "title": "Brancher un agent d'IA sur son compte bancaire, à ses risques et périls", "text": ["Citibank a modifié cette semaine ses conditions : les clients qui donnent à un agent d'IA tiers l'accès à leur compte sont responsables de ce qu'il fait. Si l'outil laisse fuiter des identifiants ou est piraté, le client répond de ce que font les pirates. PNC et Citizens ont pris des positions similaires, après JPMorgan Chase et Bank of America le mois dernier (TechCrunch).", "Citi précise que ses propres agents peuvent être utilisés sans responsabilité supplémentaire."], "why": "Les assistants capables de lancer des virements arrivent plus vite que le cadre juridique. Partager ses identifiants bancaires avec un service tiers transfère le risque sur l'utilisateur. Un outil en lecture seule, qui consulte les comptes sans pouvoir déplacer d'argent, limite ce risque ; c'est ainsi qu'Anthropic présente son outil de finances personnelles.", "sources": ["TechCrunch (web)"], "url": "https://techcrunch.com/2026/11/18/more-banks-says-customers-using-ai-agents-are-on-their-own-even-if-they-get-hacked/"}], "models": [{"name": "Gemini 4 Neon", "maker": "Google", "date": "18 nov.", "access": "Appli Gemini et Antigravity (AI Pro et Ultra), API payante ; contexte d'un million de jetons.", "price": "3 $ / 15 $ par million de jetons"}, {"name": "GPT-6.2 Astra", "maker": "OpenAI", "date": "17 nov.", "access": "ChatGPT Work et Codex (Plus, Pro, Enterprise, Edu), API.", "price": "8 $ / 40 $ par million de jetons"}, {"name": "GPT-6.2 Sol", "maker": "OpenAI", "date": "17 nov.", "access": "ChatGPT Work et Codex, API.", "price": "2 $ / 10 $ par million de jetons"}, {"name": "MAI Code 2", "maker": "Microsoft", "date": "17 nov.", "access": "GitHub Copilot ; OpenRouter et OpenCode annoncés.", "price": "Tarif promotionnel, selon Microsoft"}, {"name": "SenseNova Loop-9B", "maker": "SenseTime", "date": "18 nov.", "access": "Poids ouverts ; texte et images, contexte jusqu'à 512 000 jetons.", "price": "Gratuit (poids ouverts)"}, {"name": "Sage S2.1 Flash", "maker": "Shanghai AI Laboratory", "date": "18 nov.", "access": "Poids téléchargeables sur Hugging Face ; modèle scientifique de 321 milliards de paramètres.", "price": "Gratuit (poids ouverts)"}], "claudeTitle": "Outils", "claude": [{"k": "Claude Code", "t": "Version 2.1.328 : des hooks MCP qui peuvent bloquer", "d": "Un hook de type mcp_tool peut désormais bloquer l'action si son appel échoue (\"onFailure\": \"block\"), comme les hooks de commande et HTTP. La version corrige aussi les commandes zsh qui échouaient sur un mot commençant par « = » (echo ====), la perte de la touche Échap aux invites de permission et des gels d'affichage. /status et claude doctor signalent un export OpenTelemetry sans destination.", "cmd": "claude update", "cmdLabel": "Terminal"}, {"k": "Gemini", "t": "Gemini 4 Neon dans le menu des modèles", "d": "Les abonnés Google AI Pro et Ultra peuvent le choisir dans l'appli Gemini et l'essayer dans AI Studio ; dans Antigravity, il sert d'agent de code. Les utilisateurs gratuits n'y ont pas accès pour l'instant."}], "repos": [{"name": "astral-sh/uv", "stars": "92,3 k", "week": "+258 en un jour", "lang": "Rust", "what": "Un gestionnaire de paquets et de projets Python extrêmement rapide, qui remplace pip, virtualenv et pipx : installation de Python, environnements, dépendances verrouillées, scripts autonomes.", "why": "La base d'un environnement Python propre et reproductible : chaque projet garde ses propres versions, sans conflit. Licence Apache 2.0.", "cmd": "curl -LsSf https://astral.sh/uv/install.sh | sh"}, {"name": "HKUDS/CLI-Anything", "stars": "60,0 k", "week": "+389 en un jour", "lang": "Python", "what": "Un registre de lignes de commande prêtes à l'emploi qui rendent des logiciels existants (édition vidéo, dessin, prise de notes…) pilotables par un agent de code.", "why": "Au lieu de cliquer dans une interface, l'agent appelle une commande documentée : plus fiable, plus facile à automatiser. Le gestionnaire cli-hub installe, met à jour et désinstalle chaque outil. Licence Apache 2.0.", "cmd": "pip install cli-anything-hub"}, {"name": "google-labs-code/stitch-skills", "stars": "10,5 k", "week": "+365 en un jour", "lang": "TypeScript", "what": "Des skills et plugins pour Google Stitch, l'outil de maquettes d'interfaces de Google, utilisables dans Claude Code, Cursor, Codex ou Gemini CLI.", "why": "Ils relient la conception d'écrans au code : l'agent génère une maquette dans Stitch puis construit les composants correspondants. Demande la configuration du serveur MCP de Stitch. Licence Apache 2.0.", "cmd": "npx plugins add google-labs-code/stitch-skills --scope project --target claude-code"}], "briefs": [["Nvidia", "Plus aucune livraison de puces Hopper sous licence n'est prévue vers la Chine, après 2,4 Md$ de ventes chinoises au trimestre (The Verge)."], ["OpenAI", "Ses modèles ont participé à la conception de puces : une refonte d'un multiplicateur réduit la surface estimée d'environ 15 % (OpenAI)."], ["Recherche", "Selon OpenAI, le taux de réussite autonome de ses agents sur des tâches de recherche de deux à quatre heures est passé de 23 % en mars à 46 % en octobre, avec de grandes variations selon les tâches."], ["Sécurité", "Le programme de cybersécurité Daybreak d'OpenAI s'ouvre à l'OTAN et aux gouvernements européens ; l'agence européenne ENISA l'a déjà utilisé (The Decoder)."], ["Press   function drawMap(){
    const W=168,H=44,ns='http://www.w3.org/2000/svg',mp=D.map;
    const by=Object.fromEntries(mp.nodes.map(n=>[n.id,n]));
    const gE=$('#edges'),gN=$('#nodes');
    const clip=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y,s=Math.min((W/2+4)/Math.abs(dx||1e-6),(H/2+4)/Math.abs(dy||1e-6));return{x:b.x+dx*s,y:b.y+dy*s};};
    const E=mp.edges.map(([a,b])=>{const p1=clip(by[b],by[a]),p2=clip(by[a],by[b]);const l=document.createElementNS(ns,'line');
      Object.entries({x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,class:'edge','marker-end':'url(#arrow)'}).forEach(([k,v])=>l.setAttribute(k,v));gE.appendChild(l);return{a,b,el:l};});
    const G={};
    mp.nodes.forEach(n=>{
      const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',n.t);
      const r=document.createElementNS(ns,'rect');Object.entries({x:n.x-W/2,y:n.y-H/2,width:W,height:H}).forEach(([k,v])=>r.setAttribute(k,v));
      const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');
      n.l.forEach((s,i)=>{const ts=document.createElementNS(ns,'tspan');ts.setAttribute('x',n.x);ts.setAttribute('y',n.y-3+i*14-(n.l.length-2)*7);ts.textContent=s.toUpperCase();t.appendChild(ts);});
      g.append(r,t);gN.appendChild(g);G[n.id]=g;
      const act=()=>sel(n.id);g.addEventListener('click',act);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
    });
    function sel(id){
      const L=new Set([id]);
      E.forEach(e=>{const on=e.a===id||e.b===id;if(on){L.add(e.a);L.add(e.b);}e.el.classList.toggle('on',on);e.el.classList.toggle('dim',!on);});
      Object.entries(G).forEach(([k,g])=>{g.classList.toggle('on',k===id);g.classList.toggle('dim',!L.has(k));});
      const n=by[id];$('#mapNote').innerHTML=`<span class="k">Sélection</span><b>${esc(n.t)}</b><p>${T(n.d)}</p>`;
    }
    sel(mp.start||mp.nodes[0].id);
  }

  function calcHTML(){return `
    <div class="calc">
      <div class="l">
        <span class="k">Maths appliquées · Actualisation</span>
        <h3>Pourquoi les taux font plus mal aux valeurs de l'IA</h3>
        <div class="formula">V = Σ (t = 1…30) CF<sub>t</sub> / (1 + r)<sup>t</sup></div>
        <p class="note">Deux entreprises gagnent la même somme sur 30 ans. L'entreprise <b>mature</b> touche 10 par an dès maintenant. L'entreprise <b>IA</b> gagne peu au début puis beaucoup plus tard (croissance de 25 % par an pendant 15 ans).</p>
      </div>
      <div class="r">
        <div class="slider"><label for="rate"><span class="k">Taux d'actualisation r</span><span class="rv" id="rateV">3,0 %</span></label><input type="range" id="rate" min="1" max="9" step="0.25" value="3"></div>
        <div class="bars">
          <div class="barrow"><span class="k">Mature</span><div class="track"><div class="fill" id="barA"></div></div><span class="num" id="valA">100</span></div>
          <div class="barrow"><span class="k">IA</span><div class="track"><div class="fill ia" id="barB"></div></div><span class="num" id="valB">100</span></div>
        </div>
        <p class="note" id="calcMsg"></p>
      </div>
    </div>`;}
  function initCalc(){
    const A=Array.from({length:30},()=>10), raw=Array.from({length:30},(_,i)=>Math.pow(1.25,Math.min(i,15)));
    const sB=raw.reduce((a,b)=>a+b,0), B=raw.map(v=>v*300/sB);
    const pv=(f,r)=>f.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0), bA=pv(A,.03), bB=pv(B,.03);
    const f1=v=>v.toLocaleString('fr-FR',{maximumFractionDigits:1,minimumFractionDigits:1});
    const rate=$('#rate');
    const upd=()=>{const r=parseFloat(rate.value)/100,a=pv(A,r)/bA*100,b=pv(B,r)/bB*100,mx=Math.max(a,b,100);
      $('#rateV').textContent=f1(r*100)+' %';$('#valA').textContent=Math.round(a);$('#valB').textContent=Math.round(b);
      $('#barA').style.width=(a/mx*100)+'%';$('#barB').style.width=(b/mx*100)+'%';
      const a1=pv(A,r+.01)/pv(A,r)-1,b1=pv(B,r+.01)/pv(B,r)-1;
      $('#calcMsg').innerHTML=`Base 100 à r = 3 %. À ${f1(r*100)} %, un point de taux en plus fait perdre <b class="down">${f1(-a1*100)} %</b> à l'entreprise mature et <b class="down">${f1(-b1*100)} %</b> à l'entreprise IA. Plus les profits sont lointains, plus la valeur est sensible au taux : c'est la duration.`;};
    rate.addEventListener('input',upd);upd();
  }

      $('#score').textContent=ok+'/'+D.quiz.length;

      ascii:(l,time)=>{
        const img=l.img;
        if(!img.complete||!img.naturalWidth) return false;
        if(!l.tex){try{l.tex=texture(img);l.st=stats(img);}catch(e){l.el.style.display='none';return false;}}
        return paint(l,'ascii',time,(pr,W,H,dpr)=>{
          const cw=W/dpr<500?3.6:5, ch=cw*1.7;
          if(!l.atex||l.akey!==cw*dpr){
            const ac=document.createElement('canvas'), gw=Math.round(cw*dpr*2), gh=Math.round(ch*dpr*2), x=ac.getContext('2d');
            const font=`${Math.round(gh*.86)}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
            /* signes seulement (ni lettres ni chiffres), classés par la quantité d'encre qu'ils déposent réellement */
            const cand=[...' .,\'`:;-_~^"=+*!|/\\()[]{}<>?#%&$@'];
            ac.width=gw;ac.height=gh;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            const ink=cand.map(g=>{x.clearRect(0,0,gw,gh);x.fillText(g,gw/2,gh*.54);const d=x.getImageData(0,0,gw,gh).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return [g,s];});
            l.ramp=ink.sort((a,b)=>a[1]-b[1]).map(e=>e[0]);
            ac.width=gw*l.ramp.length;x.font=font;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';
            l.ramp.forEach((g,i)=>x.fillText(g,gw*(i+.5),gh*.54));
            if(l.atex)gl.deleteTexture(l.atex);
            l.atex=texture(ac);l.akey=cw*dpr;
          }
          gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,l.atex);set(pr,'uAtlas',1);
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uCellPx',[cw,ch]);
          set(pr,'uN',l.ramp.length);
        });
      },
      photo:(l,time,now)=>{
        const img=l.img;
        if(l.broken||!img.complete||!img.naturalWidth) return false;
        if(!l.tex){
          try{l.tex=texture(img);l.st=l.st||stats(img);}
          catch(e){l.broken=true;l.el.style.display='none';l.ph.classList.add('raw');return false;}
        }
        const dt=l.tl?Math.min(.1,(now-l.tl)/1000):0;
        if(l.rev!==l.target){
          const s=still.matches?1:dt/1.5;
          l.rev=l.target>l.rev?Math.min(l.target,l.rev+s):Math.max(l.target,l.rev-s);
        }
        l.tl=l.rev===l.target?0:now;
        const e=l.rev*l.rev*(3-2*l.rev);
        return paint(l,'photo',time,pr=>{
          gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,l.tex);
          set(pr,'uImg',[img.naturalWidth,img.naturalHeight]);set(pr,'uSt',l.st);set(pr,'uRev',e);set(pr,'uDark',col.dark);set(pr,'uLight',col.light);
        });
      }
    };
    function frame(now){
      raf=0;
      if(!ok) return;
      const move=!still.matches, time=move?(now-t0)/1000:(t0%1e5)/1000;
      let again=false;
      layers.forEach(l=>{
        if(!l.seen) return;
        const live=l.kind==='photo'?l.rev!==l.target:move;
        const fluid=l.wakeUntil>now;     /* pendant le geste : chaque image, pour un mouvement fluide */
        if(l.dirty||fluid||(live&&(l.kind==='photo'||now-l.last>=FPS))){
          if(R[l.kind](l,time,now)!==false)l.dirty=false;
          l.last=now;
        }
        if(fluid||(l.kind==='photo'?l.rev!==l.target:move)) again=true;
      });
      if(again&&!document.hidden) raf=requestAnimationFrame(frame);
    }
    function kick(){if(!raf&&ok)raf=requestAnimationFrame(frame);}
    const io=new IntersectionObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l){l.seen=e.isIntersecting;if(l.seen)l.dirty=true;}});kick();},{rootMargin:'200px 0px'});
    const ro=new ResizeObserver(es=>{es.forEach(e=>{const l=layers.get(e.target);if(l)l.dirty=true;});kick();});
    const add=(el,kind,o)=>{layers.set(el,Object.assign({el,kind,seen:false,dirty:true,last:0,ctx:null},o));io.observe(el);ro.observe(el);};
    const TYPE={fall:0,band:1,rise:2};
    /* (re)branche les couches après chaque rendu ; celles retirées du DOM sont libérées */
    function scan(){
      layers.forEach((l,el)=>{
        if(el.isConnected) return;
        io.unobserve(el);ro.unobserve(el);
        [l.tex,l.atex,l.dtex].forEach(x=>x&&gl.deleteTexture(x));
        layers.delete(el);
      });
      document.querySelectorAll('canvas.fx').forEach((el,i)=>{if(!layers.has(el))add(el,'bands',{type:TYPE[el.dataset.g]||0,seed:((i+1)*.6180339)%1});});
      document.querySelectorAll('canvas.mastfx').forEach(el=>{if(!layers.has(el))add(el,'mast',{});});
      document.querySelectorAll('canvas.ascfx').forEach(el=>{
        if(layers.has(el)) return;
        const img=new Image();img.src=el.dataset.src;
        add(el,'ascii',{img});
        img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      document.querySelectorAll('.ph').forEach((ph,i)=>{
        const el=ph.querySelector('canvas.xr'), img=ph.querySelector('img');
        if(!el||layers.has(el)) return;
        add(el,'photo',{img,ph,rev:0,target:0,tl:0,seed:((i+3)*.7548777)%1});
        if(!img.complete) img.addEventListener('load',()=>{const l=layers.get(el);if(l){l.dirty=true;kick();}},{once:true});
      });
      kick();
    }
    /* état d'une photo : révélée si survolée à la souris ou touchée */
    function photo(ph){
      const l=layers.get(ph.querySelector('canvas.xr'));
      if(!l) return;
      l.target=ph._hover||ph.classList.contains('on')?1:0;
      if(l.target!==l.rev){l.tl=0;kick();}
    }
    gc.addEventListener('webglcontextlost',e=>{e.preventDefault();ok=false;cancelAnimationFrame(raf);raf=0;});
    gc.addEventListener('webglcontextrestored',()=>{ok=build();kick();});
    ok=build();
    if(!ok) return api;
    document.documentElement.classList.add('ink');
    readColors();
    dark.addEventListener('change',readColors);
    still.addEventListener('change',()=>{layers.forEach(l=>l.dirty=true);kick();});
    document.addEventListener('visibilitychange',kick);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{layers.forEach(l=>{if(l.kind==='ascii')l.atlas=null;l.dirty=true;});kick();});
    return {scan,photo,on:true};
  })();

  /* Titres en escalier : la taille baisse juste assez pour que la ligne la plus longue tienne dans la colonne */
  function fitStair(el){
    const W=el.clientWidth; if(!W||el._w===W) return; el._w=W;
    el.style.fontSize=''; const base=parseFloat(getComputedStyle(el).fontSize); let k=1;
    el.querySelectorAll(':scope > span').forEach(s=>{const pad=parseFloat(getComputedStyle(s).paddingLeft)||0,text=s.scrollWidth-pad;if(text>0)k=Math.min(k,(W-pad)/text);});
    if(k<1) el.style.fontSize=(base*k*.985)+'px';
  }
  const stairRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>fitStair(e.target))):null;
  function fitStairs(){document.querySelectorAll('.stair').forEach(el=>{el._w=0;fitStair(el);if(stairRO)stairRO.observe(el);});}
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitStairs);
  function renderAll(){renderCover();renderEssentiel();renderComprendre();renderReviser();renderIA();renderArchives();renderSources();renderColo();fitStairs();ink.scan();}

  async function go(date){
    if(!cache[date]){
      try{const r=await fetch('data/'+date+'.json');if(!r.ok)throw 0;cache[date]=await r.json();}
      catch(e){$('#archives').insertAdjacentHTML('afterbegin','<p class="note">Impossible de charger cette édition. Réessaie dans un instant.</p>');return;}
    }
    D=cache[date];
    try{history.replaceState(null,'','#'+(date===LATEST.date?'':date))}catch(e){}
    renderAll();show('essentiel');window.scrollTo({top:0});
  }

  /* Le titre OFFSET remplit exactement la largeur */
  const brand=$('#brand');
  function fit(){brand.style.fontSize='';const w=brand.parentElement.clientWidth,bw=brand.scrollWidth;if(bw)brand.style.fontSize=(parseFloat(getComputedStyle(brand).fontSize)*w/bw)+'px';}
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(fit);
  addEventListener('resize',fit); fit();

  renderAll();
  const h=(location.hash||'').slice(1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==LATEST.date&&INDEX.some(x=>x.date===h)) go(h);
})();
</script>
